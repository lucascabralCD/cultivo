Reserve com pagamento na retirada e cancelamento grátis — isso trava o preço sem te comprometer. Referência: Focus manual, 11 dias, €250 na carhire.ie com franquia €1.800. Compare Sixt, Hertz e Enterprise depois da resposta da Mastercard.\n- 🟠 ESTA SEMANA Mastercard: a carta e a pergunta: Ligue no número atrás do cartão. A pergunta: “o seguro de veículo alugado cobre a franquia quando o CDW básico vem incluído na tarifa e não pode ser recusado?” O pedido: carta de cobertura em inglês, datada, com seu nome, os 4 últimos dígitos e a frase “Republic of Ireland”. A Sixt e a Avis exigem a carta; o banco leva dias para emitir — por isso é esta semana e não lá.\n- 🟠 ESTA SEMANA PID no Detran-GO: go.gov.br → “Solicitar Permissão Internacional para Dirigir”, ~R$ 207, retirada presencial. Avis e o grupo Europcar exigem para CNH brasileira. É o único item que não dá para resolver na Irlanda — você embarca dia 25.\n- 🟡 SE QUISER 14 Henrietta Street, qua 30/09 às 10:00: €12, ainda com datas abertas — a única visita guiada da sua lista que não esgotou. Quarta e quinta são os dias quietos e a casa aceita quem chega, mas a capacidade é pequena. Se quiser garantir, é um clique: 14henriettastreet.ticketsolve.com. Se não, chegue às 09:50 e arrisque.\n- 🟡 SE QUISER Goldie, qui 8/10: 28 lugares, 021 239 8720. Em Cork, na semana do Folk Festival, um jantar de 28 lugares numa quinta é o tipo de coisa que enche. Dois minutos de telefone.\n- 🟡 SE QUISER A carne do churrasco — comprar no sábado 10: Domingo fecha tudo na Irlanda. Açougue de Dublin no sábado de manhã, pedindo picanha (ou “rump cap” / “top sirloin cap”), capa de gordura inteira. Ou encomendar na quinta 8 no English Market de Cork e trazer na geladeira de isopor — você está de carro. Sal grosso e farinha de mandioca vêm do Brasil; carne e laticínio, não — é confisco na alfândega da UE.\n- ⚪ NA SEMANA Hurling (só se for sábado), semifinal de Cork, Magazine Fort: A final de hurling virou bônus: ela só entra no roteiro se cair no sábado 10, e aí é parada na estrada Cork → Dublin. Ingresso só à venda na semana do jogo (Future Ticketing, ~€20–25) e a data cravada sai em tipperary.gaa.ie depois das semifinais de 26 e 27/09 — lembrete automático já marcado para 30/09. A semifinal de futebol gaélico de Cork sai na segunda ou terça antes (gaacork.ie). E o Eventbrite do Magazine Fort, para o caso de desistência.","bands":"Compromissos fixos: 25/09–27/09 Dublin com a Priscila — 25–27/09 em Dublin, com a Priscila. Base: Tyrconnell Road, Inchicore. | 28/09 dia livre — Seg 28/09 — o único dia inteiro livre em Dublin: Kilmainham Gaol, Collins Barracks, Open Gate, Cobblestone. | 29/09–01/10 estágio (tarde + noite) — 29/09, 30/09 e 01/10 — estágio no restaurante à tarde e à noite. Só as manhãs são suas. | 02/10–03/10 Galway com a Priscila e o Richie — Sex 02 e sáb 03/10 em Galway, com os dois. Eles voltam para Dublin no domingo. | 10/10–11/10 Dublin com eles — Sáb 10 — Cork → Dublin de carro e o dia com eles (Howth ou Wicklow). Dom 11 — churrasco na casa dos pais do Richie. Dorme em Inchicore nas duas noites. | 12/10–14/10 Porto — Comprado: FR7072 seg 12/10 19:35 → Porto 22:00 e FR7079 qua 14/10 17:55 → Dublin 20:20. €136,34 pagos. | 15/10 voo pra casa 09:15 — Qui 15/10 — AF1617 09:15. Check-in fecha 08:35. Dublin Express 782 de Heuston às 05:35.\n★ Carro e montanha: 02/10–12/10 carro alugado — sex 2 → seg 12 — Aluguel em Dublin na sexta 2 com a Priscila e o Richie; eles voltam de trem no domingo 4 e o carro fica com você até a devolução no aeroporto de Dublin, segunda 12 ~16:00. ~1.500 km. | 27/09 montanhas de Dublin — Dom 27/09 — travessia Marlay Park → Fairy Castle → Three Rock → Tibradden → Cruagh → Hell Fire Club: ~25 km, ~900 m, 7–8 h. Luas + S8 na ida, 15B na volta. Sugestão do Richie. | 05/10–06/10 Inishbofin — pernoite — Seg 05 → ter 06/10 — carro até Cleggan (89 km), balsa 11:30, noite no Day's Bar B&B, balsa 09:00 de terça. Com o Richie, se ele conseguir. “My favourite place in the country.” | 07/10 Cliffs · bus 350 — Qua 07/10 — Bus Éireann 350 do Galway Bus Station 07:00 → Cliffs 08:54 (€9,45 Leap), ingresso €8 online no horário da manhã, almoço em Doolin, volta 14:21 ou 16:08. | 09/10 Beara + Healy Pass — Sex 09/10 — GoCar na estação Kent → Glengarriff → Castletownbere (caranguejo) → Healy Pass → Kenmare → Cork, ~280 km. Galgos em Curraheen às 19:35.\n★ Feira de Ballinasloe: 04/10 DOMINGO — sozinho — Dom 04/10 — o dia de negócio de cavalos no Fair Green, sem os amigos (eles não recomendam; você decidiu ir de dia e voltar cedo). Citylink 763, 60 min. A segunda-feira na feira caiu para dar lugar à ilha. | 05/10 seg (fora) — Seg 05/10 é o segundo dia de negócio — mas você estará na balsa para Inishbofin. | 06/10–11/10 festival de família — dá pra pular — 07–11/10 vira festival de vila: show de cães, tratores antigos, motoqueiro acrobata, country'n'Irish no palco. O domingo 11 tem a feira tradicional de ovelhas.\n★ Cork Folk Festival: 08/10–09/10 47ª edição — pano de fundo de pub — 08–11/10/2026, confirmado pelo site do festival. Sessões grátis no Sin É (18:00–24:00), An Spailpín (21:30), Corner House; Folk on the Coal Quay ao ar livre no sábado; Trad in the Fort no domingo. Do programa pago, o Richie marcou uma coisa só: o Céilí Mór.\nCorridas: 25/09–26/09 Listowel — Listowel Harvest Festival 20–26/09 — uma vila inteira de porre por sete dias. Sex 25 = Ladies Day, sáb 26 = dia local. €20–25. | 04/10–05/10 Killarney — Killarney Racecourse, 04–05/10. | 06/10 corrida — ★ Galway Races em Ballybrit, ter 06/10: 7 páreos de obstáculo, portões 12:30, 1º páreo 14:20, ~€15. Richie: “Ballybrit on a Tuesday.”\nGAA — o jogo do povo: 02/10–04/10 semis hurling (Cork) — 02–04/10: semifinais do hurling do condado de Cork, em campos de clube no interior. Ingresso só online, €10–15. | 09/10–11/10 semis futebol (Cork) — 09–11/10: semifinais de futebol gaélico do condado de Cork, também em campos de clube — a opção da tarde de sábado 10. | 10/10–11/10 final de hurling — 10 OU 11 — A data cravada sai em tipperary.gaa.ie depois das semifinais (sáb 26 e dom 27/09). Se cair no sábado 10, entra como parada na estrada Cork → Dublin: desvio de +11 min e €0 de pedágio. Se cair no domingo 11 (o histórico diz que sim: as seis últimas foram todas no domingo), ela cai e o churrasco fica. Decisão em 30/09. | 11/10 ★ CHURRASCO — Dom 11/10 — churrasco na casa dos pais do Richie, em Dublin. Dia inteiro, sem dirigir. É o ponto alto do fim da viagem e não depende de calendário nenhum.\nGalgos, €10: 25/09–26/09 galgo — Curraheen Park (Cork) e Galway correm sexta e sábado. Portões 18:30, 1º páreo ~19:35–19:50, €10 na porta. | 02/10–03/10 galgo — Sex 02 e sáb 03/10 — galgos em Cork (Curraheen) e Galway. | 09/10 galgo — Sex 09/10 — galgos em Curraheen Park depois de Beara. Richie: “The dogs.”\nThe Welcome Inn (Cork): 30/09 folk — Qua 30/09 — Fireside Folk 21:30, grátis. | 01/10 banjos — Qui 01/10 — Ballads & Banjos 21:30, grátis. | 07/10 folk — Qua 07/10 — Fireside Folk 21:30, grátis. | 08/10 banjos — Qui 08/10 — Ballads & Banjos 21:30, grátis. Último early house da Irlanda: abre às 07:00 todos os dias, desde 1845. Não serve comida. | 14/10 folk — Qua 14/10 — Fireside Folk 21:30, grátis.\nFeiras de gado (marts): 28/09 mart — Seg — Bandon Mart, gado às 11:00, bezerros 10:30. | 30/09 mart — Qua — Ballinasloe Mart, venda de gado às 11:00. | 03/10 mart — Sáb — Macroom (11:30) e Ballinasloe (weanlings, 11:00). | 05/10 mart — Seg — Bandon Mart. (Mas você estará em Ballinasloe.) | 07/10 mart — Qua 07/10 — Ballinasloe Mart, gado às 11:00. Era o plano B do dia de carro; Inishbofin ganhou. | 09/10 mart — Sex 09/10 — Skibbereen Mart, dois ringues às 11:00. Saiu do plano (Richie: “leave the men to it”); volta só como plano de chuva. | 10/10 mart — Sáb 10/10 — Macroom Mart, 10:30/11:30. | 12/10 mart — Seg 12/10 — Bandon Mart.\nComida: 25/09–27/09 Galway Oyster — 25–27/09. A marquise com ingresso é exatamente a armadilha que você odeia; a rua e os pubs cheios, não. | 02/10–04/10 ★ Dingle Food Festival — 02–04/10, confirmado. Taste Trail: €20 = livro de 6 tickets, €3 por prova, 60–70 casas. Sáb e dom 13:00–17:00. Comitê de voluntários locais, sem fins lucrativos. | 02/10–04/10 Bia Bó Finne (Inishbofin) — 02–04/10 — o festival de comida de Inishbofin é no fim de semana anterior à sua visita de quarta.\nOutros festivais: 25/09–30/09 Lisdoonvarna (fecha 30/09) — Festival de casamenteiros, 01–30/09/2026. O último fim de semana é 25–27/09 — exatamente o da Priscila. Música country'n'Irish e jive, não trad. | 04/10 Misleór — 04/10 — o Misleór, festival de culturas nômades do Galway Traveller Movement, vai à feira de Ballinasloe. Essa é a porta de entrada respeitosa. | 25/09–27/09 Misleór (Galway city) — 24–27/09, Galway City. Teatro com elenco Traveller, painéis, oficinas de funilaria, música. | 25/09–27/09 Clifden Arts — Termina 27/09. O festival de artes comunitário mais antigo da Irlanda, em Connemara.","ultima":"- ★ A pé até Heuston + Dublin Express 782 (€10): É a recomendação, e é quase de graça. Você acorda em Inchicore, sai de Tyrconnell Road às 04:50 a pé e faz os 28 a 32 minutos plano até a estação Heuston pela South Circular → Con Colbert Road → ponte Sean Heuston. O Dublin Express 782 sai de Heuston às 05:35 e chega no Terminal 1 às 06:21. Passagem €10, mais barata comprando no app. O check-in da Air France fecha às 08:35: você chega com 2 h 14 de folga. E se perder esse, o seguinte é 06:05 → 06:57, que ainda te deixa 1 h 38 de sobra. ⚠️ Os horários publicados não batem entre si. O bustimes.org lista Heuston às 03:35 / 04:05 / 04:35 / 05:05 / 05:35 / 06:05; o PDF do próprio dublinexpress.ie lista 03:28 / 03:58 / 04:28 / 04:58 / 05:28 / 06:02 — provavelmente a coluna do George's Quay, uma parada antes. Confira no app na noite anterior e, na dúvida, esteja no ponto às 05:20.\n- Táxi só até Heuston, e o 782 igual (~€22): Se não quiser andar meia hora no escuro com a mala: agende um FreeNow na véspera para 05:05 na porta. São ~€10 a €13 até Heuston já com a tarifa noturna, e daí em diante é exatamente o plano de cima — 782 das 05:35, T1 às 06:21. ⚠️ Agende na véspera, pelo aplicativo. Táxi chamado na hora, às cinco da manhã, em Inchicore, não é coisa garantida.\n- Táxi porta a porta até o Terminal 1 (€40–50): A tarifa premium vale das 20:00 às 08:00: €5,40 de bandeirada, €1,81 por quilômetro e €3 de reserva, em cerca de 13 km. Saia às 05:45 e você desembarca no terminal por volta das 06:15 — dorme uma hora a mais e não pensa em mais nada. É o dobro do preço e o que ele compra é uma hora de sono. Ainda assim: agende na véspera.\n- ❌ O que NÃO fazer (—): O Luas não vai ao aeroporto. Nenhuma linha, nunca foi — e o primeiro bonde da linha vermelha só sai por volta das 06:05 de qualquer jeito. E o combo G1/G2 até a cidade + ônibus 41 ou Aircoach fecha no papel, mas a baldeação não tem horário publicado e sobram uns 20 minutos de folga no total. Não use. O ônibus 41 sozinho é ótimo se você já estiver no centro: roda 24 horas por €2 com Leap Card, sai do Irish Life na Abbey Street Lower às 05:00 e chega 05:32. Mas você vai estar em Inchicore.\n- E antes disso: a volta do aeroporto, quarta à noite (€10): Você pousa de Porto às 20:20 de quarta, sem pressa nenhuma. Dublin Express 782 do aeroporto até Heuston, €10 (o último sai 00:35), e de Heuston a Luas vermelha para Goldenbridge, duas paradas, último bonde por volta de 00:30, mais 9 minutos a pé. Em casa por volta das 22:15. Se preferir não pensar: o G1/G2 roda 24 horas e para em Inchicore Village. ⚠️ Confirme com antecedência que a cama de Tyrconnell Road está disponível nessa noite. Se cair, o plano volta a ser albergue no centro (~€22, com cancelamento grátis) mais o 782 da manhã.","carro":"O desenho: Sexta 2/10, ~09:00, Dublin: retirada (filial da cidade ou aeroporto), os três para Galway pela M4/M6 — 2h30, pedágios €3,60 + €2,30. Saindo de Inchicore pela N4 (Con Colbert Road) você não passa pela M50 e não paga os €3,80 que a locadora cobra com taxa. · Domingo 4: eles voltam de trem (Ceannt → Heuston) ou Citylink; o carro fica em Galway. Para Ballinasloe você vai de Citylink mesmo: as ruas da vila fecham de sábado 20:00 a segunda 21:00 e o estacionamento oficial é no arrabalde. · Segunda 5 → terça 6: Cleggan e a ilha (carro no estacionamento privado, ~€4/dia). Terça: Ballybrit tem estacionamento grátis, mas quem estaciona não bebe — deixe o carro e vá de 409 ou do shuttle de €8 da Eyre Square. · Quarta 7: os Cliffs viram a estrada do Burren — Kinvara, Ballyvaughan, Black Head, Fanore, Doolin, Cliffs (estacionamento incluído no ingresso), Lisdoonvarna e volta: ~200 km. O ônibus 350 continua no dia como plano sem carro. · Quinta 8: Galway → Cork pela M18/M20 em ~2h45 (contra 4h30 de ônibus), pedágio do túnel de Limerick €2,30. Sexta 9: Beara com este carro. Sábado 10: Cork → Dublin pela M8 cedo (2h45, €4,60 de pedágio) e o dia de Wicklow ou Howth com eles — é este carro que torna o plano deles possível. · Domingo 11: Thurles de carro (1h45 pela M7/M8) ou de trem — se o Richie for e houver pinta, é trem. Segunda 12, ~16:00: devolução no Eastlands Car Hire Facility do aeroporto, shuttle grátis até o T1 (~5 min, a cada ~20 min) — conte 45 minutos da entrada do pátio ao check-in.\nQuanto custa, honestamente: Carro: €250 (Focus manual, 11 dias, carhire.ie, com CDW e franquia €1.800, taxa de one-way incluída) a ~€400 numa das grandes. Combustível: ~1.500 km ÷ 17 km/l × €1,87/l (gasolina, AA Ireland, set/2026; diesel €1,94) ≈ €165. Pedágios: ~€25. Estacionamento: Galway e Cork à noite, ~€10–20/noite — pergunte à hospedagem antes de reservar a cama. · Seguro: zero se o cartão cobrir e a locadora aceitar (caução bloqueada: €1.800–5.000 conforme a locadora); ou €23–35/dia pelo zero de franquia da própria locadora (€253–385 em 11 dias) se não. · Total realista: €440 (com o cartão) a €800 (com o seguro da locadora). O plano anterior sem carro custava ~€400 em GoCar, ônibus e trens — e não dava carro nenhum ao fim de semana /* Cliente do Claude para o navegador — chamada direta à API da Anthropic (sem servidor no meio).
   A chave fica só no localStorage deste aparelho. */
(function () {
  'use strict';

  const API = 'https://api.anthropic.com/v1/messages';
  const VERSION = '2023-06-01';

  const MODELS = [
    { id: 'claude-opus-5', name: 'Claude Opus 5', sub: 'o mais inteligente · padrão', search: 'web_search_20260209', effort: true, fallbacks: true },
    { id: 'claude-sonnet-5', name: 'Claude Sonnet 5', sub: 'mais rápido e mais barato', search: 'web_search_20260209', effort: true, fallbacks: false },
    { id: 'claude-haiku-4-5', name: 'Claude Haiku 4.5', sub: 'o mais barato · respostas curtas', search: 'web_search_20250305', effort: false, fallbacks: false },
  ];

  function modelInfo(id) { return MODELS.find((m) => m.id === id) || MODELS[0]; }

  function headers(key, betas) {
    const h = {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': VERSION,
      'anthropic-dangerous-direct-browser-access': 'true',
    };
    if (betas && betas.length) h['anthropic-beta'] = betas.join(',');
    return h;
  }

  function buildBody(opts, variant) {
    const m = modelInfo(opts.model);
    const body = {
      model: m.id,
      max_tokens: opts.maxTokens || 16000, // inclui o raciocínio (thinking) nos modelos que pensam; a resposta visível é bem menor
      stream: true,
      system: opts.system,
      messages: opts.messages,
    };
    if (m.effort && opts.effort) body.output_config = { effort: opts.effort };
    if (opts.search) {
      body.tools = [{
        type: m.search, name: 'web_search', max_uses: opts.maxSearches || 3,
        user_location: { type: 'approximate', city: opts.city || 'Dublin', country: opts.country || 'IE', timezone: 'Europe/Dublin' },
      }];
    }
    const betas = [];
    if (m.fallbacks && variant.fallbacks) { body.fallbacks = 'default'; betas.push('server-side-fallback-2026-07-01'); }
    return { body, betas };
  }

  function parseError(status, text) {
    let msg = text;
    try { const j = JSON.parse(text); msg = (j.error && (j.error.message || j.error.type)) || text; } catch (e) { /* texto puro */ }
    const e = new Error(msg || ('HTTP ' + status));
    e.status = status;
    return e;
  }

  function friendly(err) {
    const s = err.status, m = String(err.message || '');
    if (s === 401 || /invalid x-api-key|authentication/i.test(m)) return 'Chave da API inválida ou revogada. Confira em Configurações.';
    if (s === 403) return 'A chave não tem permissão para este modelo. Confira em console.anthropic.com.';
    if (s === 429) return 'Limite de uso atingido por agora. Espere um minuto e tente de novo.';
    if (s === 529 || /overloaded/i.test(m)) return 'A API está sobrecarregada. Tente de novo em instantes.';
    if (s === 400 && /credit|balance|billing/i.test(m)) return 'Sem créditos na conta da API. Adicione saldo em console.anthropic.com.';
    if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Sem rede agora. As suas anotações ficam salvas; o Claude precisa de internet.';
    if (err.name === 'AbortError') return 'Cancelado.';
    return m || 'Erro desconhecido.';
  }

  /* Lê a resposta em stream (SSE) e chama onEvent para cada evento útil:
     {type:'text', text} · {type:'status', text} · {type:'done', stopReason, model, usage} */
  async function readStream(res, onEvent, signal) {
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '', stopReason = null, model = null, usage = null, complete = false;
    const blocks = {};

      const { value, done } = await reader.read();
      if (done) break;
      if (signal && signal.aborted) { try { reader.cancel(); } catch (e) { /* ignore */ } break; }

      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let data = null;
        for (const line of raw.split('\n')) {
          if (line.startsWith('data:')) data = (data || '') + line.slice(5).trim();
        }
        if (!data) continue;
        let ev; try { ev = JSON.parse(data); } catch (e) { continue; }
        if (ev.type === 'message_start' && ev.message) { model = ev.message.model || model; usage = ev.message.usage || usage; }
        else if (ev.type === 'content_block_start') {
          const cb = ev.content_block || {};
          blocks[ev.index] = cb.type;
          if (cb.type === 'server_tool_use') onEvent({ type: 'status', code: 'search' });
          else if (cb.type === 'web_search_tool_result') onEvent({ type: 'status', code: 'read' });
          else if (cb.type === 'text') onEvent({ type: 'status', code: '' });
          else if (cb.type === 'thinking') onEvent({ type: 'status', code: 'think' });

        else if (ev.type === 'content_block_delta') {
          const d = ev.delta || {};
          if (d.type === 'text_delta' && d.text) onEvent({ type: 'text', text: d.text });
        }
        else if (ev.type === 'message_delta') {
          if (ev.delta && ev.delta.stop_reason) stopReason = ev.delta.stop_reason;

  }

  /* opts: {key, model, effort, search, system:[blocks], messages:[...], signal, onEvent} */
  async function send(opts) {
    if (!opts.key) { const e = new Error('Sem chave da API.'); e.status = 401; throw e; }

        try { return await readStream(res, onEvent, opts.signal); }
        catch (err) { if (err.streamError && !gotText && attempt < 2) { await wait(1500 * (attempt + 1)); continue; } throw err; }
      }
      const text = await res.text();
      const err = parseError(res.status, text);
      // Se a beta de fallback não for aceita nesta conta/modelo, tenta sem ela.
      if (res.status === 400 && betas.length && /fallback|beta|unexpected|extra|unrecognized/i.test(err.message)) { variant = { fallbacks: false }; continue; }
      if ((res.status === 529 || res.status >= 500) && attempt < 2) { await wait(1500 * (attempt + 1)); continue; }
      if (res.status === 429 && attempt < 1) { await wait(4000); continue; }
      throw err;
    }
    throw new Error('Não consegui falar com a API.');
  }

  function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

  /* Modo claude.ai: a página publicada como artifact pergunta ao Claude pela conta do próprio usuário
     (capacidade "sample"), sem chave da API. Sem memória: o contexto inteiro vai em cada chamada. */
  function sampleFriendly(e) {
    const c = e && e.code;
    if (c === 'not_granted') return 'Você não permitiu que esta página use o seu Claude. Recarregue a página e aceite o pedido.';
    if (c === 'rate_limited') return 'Limite de uso do seu Claude por agora. Espere um pouco e tente de novo.';
    if (c === 'session_expired') return 'A sessão do claude.ai expirou. Entre de novo.';
    if (c === 'refused') return 'O Claude recusou este pedido. Reformule.';
    if (c === 'prompt_too_large') return 'Conversa grande demais para esta página. Comece uma conversa nova.';
    if (c === 'cancelled') return 'Cancelado.';
    if (c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled') return 'O Claude não está disponível nesta página. Use a versão instalada no celular.';
    if (c === 'empty_completion') return 'O Claude não respondeu nada. Tente perguntar de outro jeito.';
    return (e && e.message) || 'Erro ao falar com o Claude.';
  }
  async function sendSample(opts) { // {sample, turns, signal, onEvent, tier}
    opts.onEvent({ type: 'status', code: 'think' });
    const r = await opts.sample(opts.turns, { cache: false, signal: opts.signal, modelTier: opts.tier || 'default', onText: ({ text }) => opts.onEvent({ type: 'text', text, whole: true }) });
    const out = { stopReason: r.truncated ? 'max_tokens' : 'end_turn', model: 'claude.ai · ' + (r.modelTierApplied || 'default'), usage: null, complete: true };
    opts.onEvent(Object.assign({ type: 'done' }, out));
    return out;
  }

  window.ClaudeAPI = { MODELS, modelInfo, send, friendly, sendSample, sampleFriendly };
})();

  function addSug(mi, j) {
    const m = S.chat[mi]; if (!m) return; const s = parseSug(m.text).sug[j]; if (!s) return;
    const di = dayIndex(s.d || ''); const d = DAYS[di] || DAYS[todayIndex()];
    const tm = /^\d{1,2}:\d{2}$/.test(s.t || '') ? s.t : null;
    S.ex.push({ id: uid(), d: d.d, t: tm, h: tm ? '' : t('src_claude'), ti: String(s.ti).slice(0, 60), b: String(s.b || ''), c: 'note', kind: 'do', src: 'claude', sid: mi + ':' + j, from: chatCtx ? chatCtx.id : null, maps: s.maps || '', place: '', dur: 0, alts: [] });
    if (chatCtx) { const o = ovf(chatCtx.id); if (o.s === 'miss') o.res = 'claude'; }
    save(); renderClaude(); toast(t('added_day', { dt: d.dt, ti: s.ti }));
  }

  /* ---------- ações delegadas ---------- */
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    if (ev.target.closest('a')) return;
    const act = b.dataset.act, id = b.dataset.id;
    const stop = ev.target.closest('[data-stop]');
    if (act === 'open') { if (stop) return; open[id] = !open[id]; render(); return; }
    if (act === 'toggle') { open[b.dataset.k] = !open[b.dataset.k]; render(); return; }
    if (act === 'done') { const o = ovf(id); o.s = o.s === 'done' ? null : 'done'; if (o.s === 'done') { o.res = null; } prune(); save(); render(); if (o.s === 'done') toast(t('done_toast')); return; }
    if (act === 'miss') { sheetMiss(id); return; }
    if (act === 'skip') { const o = ovf(id); o.s = o.s === 'skip' ? null : 'skip'; prune(); save(); render(); return; }
    if (act === 'push') { const o = ovf(id); const e = baseEv(id); o.t = addMin(o.t || (e && e.t) || nowParts().hm, +b.dataset.m); save(); render(); toast('→ ' + o.t); return; }
    if (act === 'hora') { sheetHora(id); return; }
    if (act === 'todayat') { sheetHora(id, true); return; }
    if (act === 'move') { sheetMove(id); return; }
    if (act === 'note') { sheetNote(id); return; }
    if (act === 'reset') { delete S.ov[id]; save(); render(); toast(t('restored')); return; }
    if (act === 'del') { S.ex = S.ex.filter((x) => x.id !== id); delete S.ov[id]; save(); render(); return; }
    if (act === 'ask') { askAbout(id, 'ask'); return; }
    if (act === 'askq') { go('claude'); sendChat(b.dataset.q); return; }
    if (act === 'addev') { sheetAdd(b.dataset.d); return; }
    if (act === 'day') { cur = +b.dataset.i; diasMode = 'tl'; open = {}; go('dias'); return; }
    if (act === 'diasmode') { diasMode = b.dataset.m; go('dias'); return; }
    if (act === 'panel') { panel = b.dataset.p || null; go('mais'); return; }
    if (act === 'cfg') { sheetCfg(); return; }
    if (act === 'lang') { sheetLang(); return; }
    if (act === 'tr') { translateSection(b.dataset.sec); return; }
    if (act === 'ck') { if (S.ck[id]) delete S.ck[id]; else S.ck[id] = true; save(); render(); return; }
    if (act === 'remdone') { if (S.ck[id]) delete S.ck[id]; else S.ck[id] = true; save(); render(); return; }
    if (act === 'addsug') { addSug(+b.dataset.mi, +b.dataset.j); return; }
    if (act === 'ctxclear') { chatCtx = null; renderClaude(); return; }
    if (act === 'togglesearch') { S.cfg.search = !S.cfg.search; save(); renderClaude(); return; }
    if (act === 'newchat') { S.chat = []; chatCtx = null; save(); renderClaude(); return; }
    if (act === 'export') {
      const data = Object.assign({}, S, { key: undefined }); const json = JSON.stringify(data, null, 1);
      if (IN_ARTIFACT) { // o visualizador do claude.ai não deixa a página baixar arquivos: mostra para copiar
        openSheet('<h3>' + esc(t('bk_sheet')) + '</h3><div class="sub">' + esc(t('bk_sheet_s')) + '</div><textarea class="ta" id="bk-ta" style="margin-top:12px;min-height:180px;font-family:var(--mono);font-size:11px">' + esc(json) + '</textarea><div class="btnrow"><button class="btn p" id="bk-copy">' + esc(t('copy')) + '</button></div>', (p) => { p.querySelector('#bk-copy').onclick = () => { const ta = p.querySelector('#bk-ta'); ta.select(); (navigator.clipboard && navigator.clipboard.writeText(json) || Promise.reject()).then(() => toast(t('copied')), () => toast(t('select_copy'))); }; });
        return;
      }
      const blob = new Blob([json], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'irlanda-backup-' + nowParts().iso + '.json'; document.body.appendChild(a); a.click(); a.remove(); return;
    }
    if (act === 'reset-all') { openSheet('<h3>' + esc(t('reset_title')) + '</h3><div class="sub">' + esc(t('reset_sub')) + '</div><div class="btnrow"><button class="btn no" id="rz-ok">' + esc(t('reset_yes')) + '</button><button class="btn" id="rz-no">' + esc(t('cancel')) + '</button></div>', (p) => { p.querySelector('#rz-no').onclick = closeSheet; p.querySelector('#rz-ok').onclick = () => { const key = S.key, cfg = S.cfg, tr = S.tr; S = JSON.parse(JSON.stringify(BLANK)); S.key = key; S.cfg = cfg; S.tr = tr; save(); closeSheet(); render(); toast(t('zeroed')); }; }); return; }
    if (act === 'install') { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; } return; }
    if (act === 'update') { checkUpdate(true); return; }
  });

  /* ---------- rede / PWA ---------- */
  function net() { const on = navigator.onLine; document.getElementById('netdot').classList.toggle('off', !on); document.getElementById('nettxt').textContent = t(on ? (hasClaude() ? 'net_claude' : 'net_online') : 'net_offline'); }
  window.addEventListener('online', net); window.addEventListener('offline', net);
  let deferredInstall = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; const b = document.getElementById('btn-install'); if (b) b.hidden = false; });
  let swReg = null;
  function checkUpdate(manual) { if (!swReg) { if (manual) toast(t('no_sw')); return; } swReg.update().then(() => { if (manual && !swReg.waiting && !swReg.installing) toast(t('latest')); }).catch(() => { if (manual) toast(t('cant_check')); }); }
  if (IN_ARTIFACT) {
    window.claude.use('sample').then((fn) => { SAMPLE = (typeof fn === 'function') ? fn : null; sampleResolved = true; if (view === 'claude' || view === 'mais') render(); net(); }).catch(() => { sampleResolved = true; if (view === 'claude') renderClaude(); });
  }
  if ('serviceWorker' in navigator && !IN_ARTIFACT && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      swReg = reg;
      const onWaiting = () => { const f = document.getElementById('foot'); if (!document.getElementById('upd')) { const b = document.createElement('div'); b.className = 'banner'; b.id = 'upd'; b.innerHTML = esc(t('update_ready')) + '<button id="upd-go">' + esc(t('reload')) + '</button>'; f.parentNode.insertBefore(b, f); document.getElementById('upd-go').onclick = () => { if (reg.waiting) reg.waiting.postMessage('skipWaiting'); }; } };
      if (reg.waiting) onWaiting();
      reg.addEventListener('updatefound', () => { const nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) onWaiting(); }); });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
    }).catch(() => {});
    let refreshing = false; const hadController = !!navigator.serviceWorker.controller;
    // na primeira instalação o SW assume a página sem precisar recarregar; só recarrega quando uma versão NOVA assume
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (refreshing || !hadController) return; refreshing = true; location.reload(); });
  }

  /* ---------- relógio ---------- */
  setInterval(() => { if (view === 'hoje' && sheet.hidden && !streaming) renderHoje(); }, 60000);

  /* ---------- boot ---------- */
  applyStatic(); net();
  go('hoje');
  if (!S.key && !IN_ARTIFACT && !S.misc.seenCfg) { S.misc.seenCfg = true; save(); setTimeout(() => toast(t('first_toast'), 4000), 800); }
})();

</script>
</body>
