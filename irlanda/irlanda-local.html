oisas que a Irlanda não tem e pesam nada: <b>sal grosso</b> (o flocado de supermercado não serve) e <b>farinha para farofa</b>. Uma garrafa de cachaça cabe na franquia de 1 litro de destilado da UE, e limão e gelo se acham em qualquer Tesco. ⚠️ <b>Carne e laticínio do Brasil são proibidos de entrar na UE</b> — nada de linguiça e nada de queijo na mala, é confisco na alfândega.","ti":"Mala: sal grosso, farinha, cachaça","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-11.5.o-tempo","h":"o tempo","t":null,"c":"note","b":"Meados de outubro em Dublin: máxima de ~13 °C e chuva provável. Isso não cancela churrasco irlandês — eles assam debaixo de gazebo o ano inteiro, de casaco, e acham normal. Leve casaco e não comente o clima: comentar o clima é o esporte nacional e você não vai ganhar.","ti":"O tempo: ~13 °C e chuva, churrasco segue","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-11.6.o-que-levar","h":"o que levar","t":null,"c":"note","b":"Cerveja para a casa é obrigação, não gentileza. Some algo brasileiro — cachaça, ou o próprio sal grosso como presente do churrasqueiro. E leve o nome certo: não é “barbecue”, é <b>churrasco</b>, e vale explicar a diferença enquanto assa.","ti":"Levar cerveja e algo brasileiro","kind":"do","place":"","maps":"","dur":30,"alts":[{"ti":"Sal grosso ou cachaça como presente","b":"Se a cerveja ficar difícil de comprar no domingo, o presente brasileiro cobre: a garrafa de <b>cachaça</b> (cabe na franquia de 1 litro de destilado da UE) ou o próprio <b>sal grosso</b> trazido do Brasil, entregue como presente do churrasqueiro. Limão e gelo se acham em qualquer Tesco.","src":"days/2026-10-11.json eventos 'o que cabe na mala' e 'o que levar'; docs/churrasco-11-10-e-final-hurling-18-09.md","t":""}]},{"id":"2026-10-11.7.e-a-final","h":"⚠️ e a final","t":null,"c":"warn","b":"Se a final ficar no domingo — que é o provável —, ela cai. Não dá para estar em Thurles e no quintal ao mesmo tempo, e o churrasco ganha. O histórico está na seção 11; a decisão sai em 30/09.","ti":"A final de hurling cai se for domingo","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-11.8.onde-comer","h":"onde comer","t":null,"c":"eat","b":"O churrasco é a comida do dia — o que importa é o que você leva. <b>A carne compra-se no sábado</b> (domingo fecha tudo): açougue de Dublin, pedindo <b>picanha</b> / <b>rump cap</b> / <b>top sirloin cap</b>, com a capa de gordura inteira; ou encomendada na quinta no <b>English Market de Cork</b> (Tom Durcan, Coughlan's, O'Mahony) e trazida na geladeira de isopor, já que você está de carro. <b>Sal grosso e farinha de mandioca vêm do Brasil</b> — não existem lá no formato certo e pesam nada. ⚠️ <b>Carne e laticínio do Brasil não entram na UE.</b> Cerveja para a casa é obrigação. Se a final tomar o sábado, o almoço daquele dia é o <b>Hayes Hotel, Liberty Square, Thurles</b> (0504 22122), que em dia de jogo serve do meio-dia às 21:30.","ti":"Comer: o churrasco no quintal","kind":"do","place":"","maps":"","dur":240,"alts":[{"ti":"Almoço: The Patriot's Inn, Kilmainham","b":"Se o churrasco cair ou atrasar, <b>The Patriot's Inn, 760 South Circular Road</b>, ao lado do Royal Hospital, cozinha 12:00–21:30. O coddle não está no cardápio atual: ligue 01 679 9595 antes se for por ele.","src":"docs/adendo-dublin-porto-ultima-noite.md tabela Inchicore/Kilmainham; days/2026-09-28.json (ao lado do Royal Hospital); extra_DOUBTS.json 'Coddle no Patriot's Inn'","t":"12:30"},{"ti":"Café: Greenville Deli, dom 09:00–15:00","b":"<b>Greenville Deli, 5A Tyrconnell Road</b>, 200 m da porta, abre domingo 09:00–15:00. Deli moderno, não a caçarola, mas é o que abre no seu quarteirão antes de sair para o churrasco.","src":"docs/adendo-dublin-porto-ultima-noite.md tabela Inchicore/Kilmainham","t":"09:30"},{"ti":"Noite: Old Royal Oak, Kilmainham Lane","b":"Se sobrar noite depois do churrasco, a última irlandesa de verdade: <b>Old Royal Oak, 11 Kilmainham Lane</b>, uma sala só, snug com passa-copos, na mesma família desde 1837. Praticamente só bebida. Ou o Slatt's, 126A Tyrconnell Park, a 150 m da porta.","src":"days/2026-10-11.json nota do dia; days/2026-09-26.json evento 'noite'; days/2026-09-25.json evento 'noite' (Slatt's, 126A Tyrconnell Park); docs/adendo-dublin-porto-ultima-noite.md","t":"21:00"}]}]},{"d":"2026-10-12","wd":"SEG","dt":"12/10","ti":"Manhã em Dublin, carro devolvido, Porto à noite","base":"Dublin → Porto","rg":"porto","tags":["€60,99 pago"],"note":"","lead":"Manhã de sobra em Inchicore, carro devolvido às 15:30 no aeroporto e o Porto às 22:00. Jante tarde: Cufra ou Capa Negra II.","etq":[],"ev":[{"id":"2026-10-12.10.manha","h":"manhã","t":null,"c":"note","b":"Manhã livre em Inchicore, sem trem nenhum para pegar. Se a segunda 28 tiver falhado por qualquer motivo, hoje é a segunda chance da <b>Guinness Open Gate Brewery</b> (segunda 13:00–21:00, 53 James's Street) — de 13:00 às 15:30 cabe.","ti":"Open Gate Brewery — repescão 13:00–15:30","kind":"do","place":"Guinness Open Gate Brewery","maps":"Guinness Open Gate Brewery, 53 James's Street, Dublin","dur":150,"alts":[{"ti":"Jardins do Memorial de Guerra, Islandbridge","b":"Jardins de Lutyens, grátis, abrem <b>08:00 de segunda a sexta</b>, ~22 min a pé de Tyrconnell Road. Serve para a manhã inteira se o Open Gate já foi feito em 28/09 ou se ele não quiser cerveja antes de dirigir.","src":"plano.json 28/09 08:00 · docs/adendo-dublin-porto-ultima-noite.md §2 (terça 29/09)","t":"08:00"},{"ti":"Tour grátis do Royal Hospital + Bully's Acre","b":"Guia no local <b>todo dia às 11:00</b> (também 13:00 e 15:00), sem reserva, só os terrenos — o IMMA fecha às segundas. Emenda com o cemitério de Bully's Acre, entrada pela avenida oeste. A ~10 min da cama.","src":"plano.json 28/09 11:00 · docs/adendo-dublin-porto-ultima-noite.md §2 plano C · docs/dossie-pesquisa-irlanda-porto.md §3 (~10 min)","t":"11:00"},{"ti":"Collins Barracks — Museu Nacional","b":"Artes Decorativas e História, grátis, sem reserva, <b>segunda 13:00–17:00</b>, parada Museum do Luas. Cabe das 13:00 às 14:30 e ainda sobra hora para voltar e pegar o carro.","src":"plano.json 28/09 13:00 · docs/dossie-pesquisa-irlanda-porto.md §4","t":"13:00"}]},{"id":"2026-10-12.11.onde-comer","h":"onde comer","t":null,"c":"eat","b":"<b>Mannings Bakery, 39–40 Thomas Street</b> para a última padaria das Liberties, ou o <b>Kingfisher</b> da Parnell Street se estiver no centro. No aeroporto, coma antes de embarcar: a bordo da Ryanair não há nada que valha o preço.","ti":"Comer: Mannings Bakery ou Kingfisher","kind":"do","place":"Mannings Bakery","maps":"Mannings Bakery, 39-40 Thomas Street, Dublin","dur":45,"alts":[{"ti":"Loaf Café, Kilmainham Square","b":"Empresa social em frente à Kilmainham Gaol, <b>todo dia 08:00–16:00</b>, simples e barato (01 516 8294). A Gaol fica a ~12 min a pé da cama — resolve o café da manhã sem sair de Inchicore.","src":"plano.json 28/09 onde comer · docs/adendo-dublin-porto-ultima-noite.md §4 · docs/dossie-pesquisa-irlanda-porto.md §3 (Gaol ~12 min)","t":"09:00"},{"ti":"Greenville Deli, na sua rua","b":"5A Tyrconnell Road, a 200 metros da porta, <b>seg–sáb 08:00–16:00</b>. Deli moderno, não é caçarola, mas é o que abre no quarteirão enquanto você fecha a mala.","src":"plano.json 25/09 onde comer · docs/adendo-dublin-porto-ultima-noite.md §4","t":""},{"ti":"Prato sentado: The Patriot's Inn","b":"760 South Circular Road, ao lado do Royal Hospital, cozinha <b>12:00–21:30</b>. Almoço de verdade antes de pegar a estrada — mas o coddle não estava no cardápio lido; ligue 01 679 9595 se for por ele.","src":"plano.json 28/09 onde comer · extra_DOUBTS.json (Coddle no Patriot's Inn)","t":"12:30"}]},{"id":"2026-10-12.12.15-30","h":"15:30","t":"15:30","c":"time","b":"<b>Devolução do carro no Eastlands Car Hire Facility do aeroporto</b> (de Inchicore pela M50, €3,80 — o único pedágio da M50 da viagem). Tanque cheio. Shuttle grátis do pátio ao T1, ~5 min, a cada ~20 min. No T1 às 16:30, três horas antes; o portão da Ryanair fecha 19:05. Sem carro seria Luas + 782 de Heuston.","ti":"Devolver o carro — Eastlands, aeroporto","kind":"do","place":"Eastlands Car Hire Facility, Dublin Airport","maps":"Eastlands Car Hire Facility, Dublin Airport","dur":75,"alts":[{"ti":"Sem carro: Luas + Dublin Express 782","b":"Se o carro já não estiver com você (devolução antecipada ou problema), é Luas vermelha de Goldenbridge até Heuston e o <b>Dublin Express 782, Heuston → Terminal 1, €10</b>, mais barato no app. É a mesma rota da última manhã.","src":"plano.json 12/10 15:30 (rodapé) · plano.json 15/10 05:35 · docs/adendo-dublin-porto-ultima-noite.md §3","t":"15:00"},{"ti":"Táxi porta a porta ao T1","b":"FreeNow ou táxi de Tyrconnell Road direto ao Terminal 1, ~13 km. O adendo cota <b>€40–50 na tarifa noturna</b> (20:00–08:00: €5,40 de bandeirada + €1,81/km + €3 de reserva); o valor de dia não está nos arquivos.","src":"docs/adendo-dublin-porto-ultima-noite.md §3 alternativas","t":""}]},{"id":"2026-10-12.13.19-35","h":"19:35","t":"19:35","c":"time","b":"<b>FR7072 Dublin → Porto, pousa 22:00.</b> Jante tarde: Cufra na Boavista ou Capa Negra II, que servem de madrugada.","ti":"Voar FR7072 Dublin → Porto","kind":"do","place":"Dublin Airport Terminal 1","maps":"Dublin Airport Terminal 1, Dublin","dur":145,"alts":[]},{"id":"2026-10-12.0.22-00","h":"22:00","t":"22:00","c":"time","b":"FR7072 pousa. Metrô linha E (violeta) até Trindade, ~30 min. Compre o <b>Andante</b> na máquina.","ti":"Pousar no Porto — metrô E até Trindade","kind":"do","place":"Aeroporto do Porto","maps":"Estação de Metro Aeroporto, Aeroporto do Porto","dur":30,"alts":[{"ti":"Ônibus noturno 3M se perder o último metrô","b":"A linha E roda até <b>00:42</b> (primeiro trem 05:57). Se o voo atrasar além disso, o <b>ônibus 3M</b> faz aeroporto → centro das 00:30 às 05:30. O Andante custa €0,60 mais €2,25–2,30 da viagem.","src":"docs/dossie-pesquisa-irlanda-porto.md §15 (OPO → centro)","t":"00:30"}]},{"id":"2026-10-12.1.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Cozinha aberta de madrugada: <b>Cufra</b>, Av. da Boavista 2504 — o clássico portuense da madrugada, família, taxista, pedido às duas da manhã. Ou <b>Capa Negra II</b>, Rua do Campo Alegre 191, que é onde o lado universitário da cidade come francesinha.","ti":"Jantar: Cufra ou Capa Negra II","kind":"do","place":"Cufra","maps":"Cufra, Av. da Boavista 2504, Porto","dur":60,"alts":[{"ti":"Cervejaria Gazela — cachorrinhos em pé","b":"Cervejaria onde os portuenses comem <b>cachorrinhos</b> em pé. É o tipo de casa que a nota do dia manda procurar (\"cervejaria ou nada\"), mas nem endereço nem horário constam nos arquivos — confira antes de atravessar a cidade.","src":"docs/dossie-pesquisa-irlanda-porto.md §15 (onde os portuenses comem)","t":""},{"ti":"Bufete Fase — francesinha sem verniz","b":"Rua de Santa Catarina 1147: balcão apertado, sem cardápio em inglês, só dinheiro, francesinha que muito portuense põe acima do Santiago. Está no plano de terça, mas serve hoje se ainda estiver aberto — o horário não consta nos arquivos.","src":"plano.json 13/10 onde comer · docs/adendo-dublin-porto-ultima-noite.md §4 Porto","t":""},{"ti":"Só beber: Café Piolho","b":"Praça Parada Leitão 45, de 1909, mesa de mármore e cadeira de plástico. Se a fome passou e a noite pede só uma cerveja portuguesa, é aqui ou no <b>Catraio</b>, Rua de Cedofeita 256.","src":"plano.json 13/10 beber","t":""}]},{"id":"2026-10-12.2.nota","h":"nota","t":null,"c":"note","b":"Quase toda tasca fecha a cozinha às 22:00. Na noite de chegada é cervejaria ou nada.","ti":"Tascas fecham a cozinha às 22:00","kind":"info","place":"","maps":"","dur":0,"alts":[]}]},{"d":"2026-10-13","wd":"TER","dt":"13/10","ti":"O dia inteiro — o único","base":"Porto","rg":"porto","tags":["★ o dia cheio"],"note":"Boavista acabou de verdade: insolvência, queda até as distritais e ordem judicial de julho de 2026 para cessar atividade. Não existe jogo no Bessa.","lead":"O único dia inteiro no Porto: Bolhão cedo, peixe de Matosinhos no almoço e, se o Porto jogar em casa, o Dragão à noite.","etq":[1],"ev":[{"id":"2026-10-13.0.09-00","h":"09:00","t":"09:00","c":"time","b":"<b>Mercado do Bolhão</b> (fecha domingo, hoje abre). Vá cedo: o piso térreo ainda é banca de verdade com vendedor de verdade. Ao meio-dia o anel de cima vira praça de alimentação para turista.","ti":"Mercado do Bolhão — o térreo, cedo","kind":"do","place":"Mercado do Bolhão","maps":"Mercado do Bolhão, Porto","dur":90,"alts":[{"ti":"Café com cheirinho ao balcão","b":"A bica com um dedo de aguardente, ao balcão, entre 8 e 10 da manhã — a bagaceira portuguesa literal. <b>Café Progresso</b>, Rua Actor João Guedes 5 (o mais antigo do Porto ainda em funcionamento), ou a <b>Confeitaria do Bolhão</b> (1896). Serve de manhã curta se o Bolhão estiver lotado ou você acordar tarde; estava marcado para quarta, pode antecipar.","src":"days/2026-10-14.json evento 08:30; docs/revisao-regioes-v7-bagaceira.md §15 'Beber'","t":"08:30"},{"ti":"Ir direto ao Mercado de Matosinhos","b":"Se o Bolhão já virou praça de turista quando você chegar, pule-o: metrô linha A (Z2, €1,40, ~25 min) até o <b>Mercado Municipal de Matosinhos</b>, o mercado que não virou nada — peixe e hortaliça sem concessão. É o próximo bloco do dia, só mais cedo.","src":"days/2026-10-13.json evento 11:00; docs/dossie-pesquisa-irlanda-porto.md §15 'Matosinhos'","t":"10:00"}]},{"id":"2026-10-13.1.11-00","h":"11:00","t":"11:00","c":"time","b":"Metrô linha A até Matosinhos. <b>Mercado Municipal de Matosinhos</b> — esse é o mercado que não virou nada. Peixe e hortaliça, sem concessão.","ti":"Metrô A até o Mercado de Matosinhos","kind":"do","place":"Mercado Municipal de Matosinhos","maps":"Mercado Municipal de Matosinhos, Matosinhos","dur":90,"alts":[{"ti":"Afurada, a vila de pescadores de Gaia","b":"Vila de pescadores que sobreviveu dentro da área metropolitana, com o <b>lavadouro público ainda em uso</b>. Vá pela balsa Flor do Gás. Sardinha na calçada. Está marcada para quarta de manhã — se Matosinhos falhar, antecipe a Afurada e libere a quarta.","src":"days/2026-10-14.json evento 11:00; docs/revisao-regioes-v7-bagaceira.md §15 'Comer'","t":"11:00"},{"ti":"Ficar no térreo do Bolhão e comprar","b":"Se a linha A der problema, o Bolhão segue aberto (seg–sex 08–20h). Fique no térreo: compre queijo da Serra, presunto e azeitonas a granel; <b>não</b> compre vinho do Porto nem souvenir ali. Almoço no <b>O Buraco</b> (Bolhão), da lista de onde os portuenses comem.","src":"docs/dossie-pesquisa-irlanda-porto.md §15 'Mercado do Bolhão' e 'Onde os portuenses comem'","t":""}]},{"id":"2026-10-13.2.onde-comer","h":"onde comer","t":null,"c":"eat","b":"⭐ <b>Rua Heróis de França</b>, a 200 metros do mercado de Matosinhos: uma rua inteira de grelhados onde o peixe foi comprado no mercado de manhã. <b>Salta o Muro</b> (nº 386) é o clássico barato; <b>O Gaveto</b> é a ponta cara. <b>Almoço, não jantar.</b> À noite, se não houver jogo: <b>Casa Aleixo</b>, Rua da Estação 216, ao lado da estação de Campanhã — a casa de tripas à moda do Porto que os portuenses citam (reserve). Barato e sem verniz: <b>Bufete Fase</b>, Rua de Santa Catarina 1147 — balcão apertado, sem cardápio em inglês, só dinheiro, e uma francesinha que muito portuense põe acima do Santiago.","ti":"Almoço: Rua Heróis de França (Salta o Muro)","kind":"do","place":"Salta o Muro","maps":"Salta o Muro, Rua Heróis de França 386, Matosinhos","dur":60,"alts":[{"ti":"Outra grelha da mesma rua","b":"A Rua Heróis de França é uma rua inteira de grelhas na calçada com o peixe da lota da manhã. Se o Salta o Muro estiver cheio: <b>O Gaveto</b> (o mais consagrado, ponta cara), <b>O Xarroco</b> (arroz de marisco) ou <b>O Lusitano</b>. Peça pelo peso e pergunte o preço do quilo antes.","src":"days/2026-10-13.json 'onde comer'; docs/dossie-pesquisa-irlanda-porto.md §15 'Matosinhos'","t":"13:00"},{"ti":"Bifana no Conga ou pernil na Casa Guedes","b":"Se voltar ao centro sem ter almoçado: <b>Conga</b>, Rua do Bonjardim 314, bifana com molho, em pé, desde 1976; ou <b>Casa Guedes</b>, Praça dos Poveiros, sande de pernil com queijo da Serra — <b>a sala antiga, não o rooftop ao lado</b>. Os dois por menos de €6.","src":"days/2026-10-14.json 'onde comer'; docs/adendo-dublin-porto-ultima-noite.md §4 'Porto'","t":"14:00"},{"ti":"O Buraco, no Bolhão","b":"Almoço de portuense no <b>O Buraco</b> (Bolhão), da lista de onde a cidade come. Serve se a manhã ficar toda no Bolhão e Matosinhos cair. Bairros para caçar tasca com almoço completo por menos de €10: Bonfim, Campanhã, Paranhos.","src":"docs/dossie-pesquisa-irlanda-porto.md §15 'Onde os portuenses comem'","t":"12:30"}]},{"id":"2026-10-13.3.16-00","h":"16:00","t":"16:00","c":"time","b":"<b>Casa da Guitarra</b>, Av. Vímara Peres 49 — loja de guitarras que faz recitais pequenos de guitarra portuguesa. <b>O Porto não é cidade de fado</b> — quase tudo vendido como fado ali é jantar-espetáculo com fadista de Lisboa em rodízio.","ti":"Casa da Guitarra — guitarra portuguesa","kind":"do","place":"Casa da Guitarra","maps":"Casa da Guitarra, Av. Vímara Peres 49, Porto","dur":60,"alts":[{"ti":"Cockburn's em Gaia — os tanoeiros","b":"Terça é dia útil: a <b>Cockburn's</b> é a única cave de Gaia com <b>tanoeiros trabalhando no local</b>. Linha D de São Bento ao Jardim do Morro em 4 minutos. Pule a Cálem (esteira de grupos). O dossiê pede reserva com 1–2 semanas — pergunte na porta.","src":"docs/dossie-pesquisa-irlanda-porto.md §15 'Caves em Gaia' e 'Metrô urbano'","t":"16:00"},{"ti":"Café Piolho mais cedo","b":"Se a loja estiver fechada ou sem recital, adiante o bloco de beber: <b>Café Piolho</b>, Praça Parada Leitão 45, de 1909, mesa de mármore e cadeira de plástico.","src":"days/2026-10-13.json evento 'beber'","t":"17:00"}]},{"id":"2026-10-13.4.noite","h":"★ noite","t":null,"c":"star","b":"<b>Verifique se o FC Porto joga em casa.</b> A 2ª rodada da fase de liga da Champions é <b>13 e 14 de outubro</b> e o Porto está na competição. Se for dia 13 no Dragão, é a melhor noite disponível. Ingressos em bilhetes.fcporto.pt.","ti":"Champions no Dragão — se o Porto jogar em casa","kind":"do","place":"Estádio do Dragão","maps":"Estádio do Dragão, Porto","dur":150,"alts":[{"ti":"Jantar: Casa Aleixo, tripas à moda do Porto","b":"O plano B da noite já escrito no dia: <b>Casa Aleixo</b>, Rua da Estação 216, ao lado da estação de Campanhã — a casa de tripas à moda do Porto que os portuenses citam. <b>Reserve.</b> Quase toda tasca fecha a cozinha às 22:00.","src":"days/2026-10-13.json 'onde comer' (\"à noite, se não houver jogo\"); days/2026-10-12.json nota","t":"20:00"},{"ti":"Leixões no Estádio do Mar","b":"A alternativa autêntica de futebol apontada na revisão: <b>Leixões, Estádio do Mar, Matosinhos</b>. Confira se há jogo na data — não está confirmado. O Boavista não existe mais: não há bilhete do Bessa.","src":"docs/revisao-regioes-v7-bagaceira.md §15; days/2026-10-13.json note","t":""},{"ti":"Francesinha no Bufete Fase","b":"Barato e sem verniz: <b>Bufete Fase</b>, Rua de Santa Catarina 1147 — balcão apertado, sem cardápio em inglês, só dinheiro, e uma francesinha que muito portuense põe acima do Santiago. Depois, Piolho e Catraio.","src":"days/2026-10-13.json 'onde comer'; docs/adendo-dublin-porto-ultima-noite.md §4 'Porto'","t":"20:30"}]},{"id":"2026-10-13.5.beber","h":"beber","t":null,"c":"note","b":"<b>Café Piolho</b> (Praça Parada Leitão 45, de 1909, mesa de mármore e cadeira de plástico) e <b>Catraio</b> na Rua de Cedofeita 256 para cerveja portuguesa de verdade.","ti":"Café Piolho e Catraio — cerveja de verdade","kind":"do","place":"Café Piolho","maps":"Café Piolho, Praça Parada Leitão 45, Porto","dur":90,"alts":[{"ti":"Aduela, Letraria ou Cervejaria Galiza","b":"Os outros nomes da lista de beber do Porto: <b>Aduela</b>, <b>Letraria</b> e <b>Cervejaria Galiza</b>. Servem se o Piolho estiver lotado ou o Catraio fechado.","src":"docs/revisao-regioes-v7-bagaceira.md §15 'Beber'","t":""},{"ti":"Cachorrinhos na Cervejaria Gazela","b":"<b>Cervejaria Gazela</b> — os <i>cachorrinhos</i>, comidos em pé, na lista de onde os portuenses comem. Cerveja e petisco no mesmo balcão, se a noite pedir comida e não só copo.","src":"docs/dossie-pesquisa-irlanda-porto.md §15 'Onde os portuenses comem'; docs/revisao-regioes-v7-bagaceira.md §15","t":""},{"ti":"Madrugada: Cufra ou Capa Negra II","b":"Depois do jogo ou depois do balcão, com fome tarde: <b>Cufra</b>, Av. da Boavista 2504 — o clássico portuense da madrugada, família, taxista, pedido às duas da manhã (faz caça de época em outubro); ou <b>Capa Negra II</b>, Rua do Campo Alegre 191, a francesinha do lado universitário.","src":"days/2026-10-12.json 'onde comer'; docs/dossie-pesquisa-irlanda-porto.md §15 'Francesinha'","t":"23:30"}]}]},{"d":"2026-10-14","wd":"QUA","dt":"14/10","ti":"Meio dia de Porto e o avião","base":"Porto → Dublin","rg":"porto","tags":["€66,99 pago"],"note":"","lead":"Meio dia de Porto: café com cheirinho, Afurada pela balsa, bifana e o metrô das 15:30 pro FR7079. Dorme em Inchicore.","etq":[],"ev":[{"id":"2026-10-14.0.08-30","h":"08:30","t":"08:30","c":"time","b":"<b>Café com cheirinho</b> — a bica com um dedo de aguardente, ao balcão, entre 8 e 10 da manhã. É a bagaceira portuguesa literal. <b>Café Progresso</b>, Rua Actor João Guedes 5, o mais antigo do Porto ainda em funcionamento, ou a <b>Confeitaria do Bolhão</b> (1896).","ti":"Café com cheirinho no Café Progresso","kind":"do","place":"Café Progresso","maps":"Café Progresso, Rua Actor João Guedes 5, Porto","dur":30,"alts":[{"ti":"Confeitaria do Bolhão (1896)","b":"A outra casa do <b>café com cheirinho</b> ao balcão, entre 08:00 e 10:00 — bica com um dedo de bagaço. Mesmo ritual, citada no plano junto com o Progresso.","src":"days/2026-10-14.json evento 08:30; docs/revisao-regioes-v7-bagaceira.md linha 166","t":"08:30"},{"ti":"Café Piolho, Praça Parada Leitão","b":"<b>Café Piolho</b>, Praça Parada Leitão 45, de 1909 — mesa de mármore e cadeira de plástico. É o lugar que o plano cita para beber no Porto; serve de balcão velho se os dois cafés falharem.","src":"days/2026-10-13.json evento 'beber'; docs/revisao-regioes-v7-bagaceira.md linha 166","t":"09:00"},{"ti":"Mercado do Bolhão de manhã","b":"Se a terça 13 falhou: o <b>Mercado do Bolhão</b> abre seg–sex 08:00–20:00. Vá antes das 11h, quando o térreo ainda é banca de verdade — depois vira praça de alimentação de turista.","src":"days/2026-10-13.json evento 09:00; docs/dossie-pesquisa-irlanda-porto.md linha 462","t":"09:00"}]},{"id":"2026-10-14.1.11-00","h":"11:00","t":"11:00","c":"time","b":"<b>Afurada</b>, em Gaia — vila de pescadores que sobreviveu dentro da área metropolitana, com o <b>lavadouro público ainda em uso</b>. Vá pela balsa Flor do Gás. Sardinha na calçada.","ti":"Afurada pela balsa Flor do Gás","kind":"do","place":"Afurada, Vila Nova de Gaia","maps":"Afurada, Vila Nova de Gaia, Portugal","dur":150,"alts":[{"ti":"Mercado de Matosinhos e Heróis de França","b":"Metrô linha A (€1,40, ~25 min) até o <b>Mercado Municipal de Matosinhos</b>, o mercado que não virou nada, e almoço na <b>Rua Heróis de França</b> a 200 m: peixe da lota da manhã na grelha da calçada. <b>Salta o Muro</b> (nº 386) é o clássico barato. Substitui a Afurada como vila de pescadores com peixe na grelha — e resolve o almoço.","src":"days/2026-10-13.json eventos 11:00 e 'onde comer'; docs/dossie-pesquisa-irlanda-porto.md linha 464","t":"11:00"},{"ti":"Mercado do Bolhão (térreo)","b":"Se chover ou o tempo apertar: o <b>Bolhão</b> fica no centro, seg–sex 08:00–20:00. Térreo ainda autêntico antes das 11h; queijo da Serra, presunto e azeitona a granel. Não compre vinho do Porto nem souvenir ali.","src":"days/2026-10-13.json evento 09:00; docs/dossie-pesquisa-irlanda-porto.md linha 462","t":"10:00"},{"ti":"Cockburn's em Gaia (tanoeiros)","b":"Se quiser ficar em Gaia sem a balsa: <b>Cockburn's</b> é a única cave com <b>tanoeiros trabalhando no local</b> em dia útil (hoje é quarta). Pule a Cálem. O dossiê pede reserva com 1–2 semanas — confira antes de ir.","src":"docs/dossie-pesquisa-irlanda-porto.md linha 468","t":"11:00"}]},{"id":"2026-10-14.2.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Almoço rápido e barato antes do aeroporto: <b>Conga</b> (Rua do Bonjardim 314) para a bifana com molho, em pé, desde 1976; ou <b>Casa Guedes</b> na Praça dos Poveiros para a sande de pernil com queijo da Serra — <b>a sala antiga, não o rooftop ao lado</b>. Os dois saem por menos de €6.","ti":"Almoço: bifana no Conga ou pernil na Casa Guedes","kind":"do","place":"Conga","maps":"Conga, Rua do Bonjardim 314, Porto","dur":45,"alts":[{"ti":"Bufete Fase — francesinha sem verniz","b":"<b>Bufete Fase</b>, Rua de Santa Catarina 1147: balcão apertado, sem cardápio em inglês, <b>só dinheiro</b>, e uma francesinha que muito portuense põe acima do Santiago. Barato e sem verniz.","src":"days/2026-10-13.json evento 'onde comer'; docs/adendo-dublin-porto-ultima-noite.md linha 153","t":"13:00"},{"ti":"Cervejaria Gazela — cachorrinhos","b":"<b>Cervejaria Gazela</b>, os <i>cachorrinhos</i> que se comem em pé — outro clássico onde os portuenses comem, no mesmo espírito do Conga.","src":"docs/dossie-pesquisa-irlanda-porto.md linha 459; docs/revisao-regioes-v7-bagaceira.md linha 165","t":"13:00"},{"ti":"O Rápido, ao lado de São Bento","b":"<b>O Rápido</b>, em São Bento, pratos rotativos por dia — almoço de portuense. Também <b>O Buraco</b>, no Bolhão, para almoço.","src":"docs/dossie-pesquisa-irlanda-porto.md linha 459","t":"13:00"}]},{"id":"2026-10-14.3.15-30","h":"15:30","t":"15:30","c":"time","b":"Sai do centro. Metrô linha E até o aeroporto, ~30 min. O portão da Ryanair fecha 30 minutos antes.","ti":"Metrô linha E até o aeroporto","kind":"do","place":"Estação Trindade","maps":"Estação Trindade, Metro do Porto, Porto","dur":30,"alts":[{"ti":"Se atrasar: mudar o voo online","b":"O portão da Ryanair fecha 30 min antes e o check-in no balcão custa €55 — faça online. Perdeu o voo: mudança custa <b>€45 por perna online, €60 no balcão/telefone</b>, mais a diferença de tarifa. Lembre que o AF1617 sai de Dublin às 09:15 de quinta.","src":"docs/revisao-regioes-v7-bagaceira.md linhas 147 e 157","t":""}]},{"id":"2026-10-14.4.17-55","h":"17:55","t":"17:55","c":"time","b":"FR7079 → Dublin 20:20. <b>A partir daqui, seção 08.</b>","ti":"Voar FR7079 Porto → Dublin 20:20","kind":"do","place":"Aeroporto do Porto","maps":"Aeroporto do Porto, OPO","dur":145,"alts":[{"ti":"Chegada: 782 até Heuston + Luas","b":"Pousa 20:20 sem pressa. <b>Dublin Express 782 do aeroporto até Heuston, €10</b> (o último sai 00:35), depois <b>Luas vermelha até Goldenbridge</b>, duas paradas (último ~00:30) e 9 min a pé. Em casa em Tyrconnell Road ~22:15.","src":"extra_ULTIMA.json cartão 'E antes disso: a volta do aeroporto, quarta à noite'","t":"20:45"},{"ti":"G1/G2 direto até Inchicore Village","b":"Se preferir não pensar em baldeação: o <b>G1/G2 roda 24 horas</b> e para em Inchicore Village.","src":"extra_ULTIMA.json cartão 'E antes disso'; docs/adendo-dublin-porto-ultima-noite.md linha 83","t":"20:45"},{"ti":"Se a cama de Tyrconnell cair: albergue","b":"Confirme antes que a cama de Tyrconnell Road está livre nesta noite. Se cair, o plano volta a ser <b>albergue no centro (~€22, cancelamento grátis)</b> mais o 782 da manhã até o T1.","src":"extra_ULTIMA.json aviso do cartão 'E antes disso'","t":""}]}]},{"d":"2026-10-15","wd":"QUI","dt":"15/10","ti":"De Inchicore ao portão","base":"Dublin → casa","rg":"dublin","tags":["€10"],"note":"O check-in da Air France fecha às 08:35. Confira o horário do 782 no app na noite anterior — as fontes divergem em ~7 minutos.","lead":"Dia de ir embora: 04:50 a pé até Heuston, 782 das 05:35, check-in fecha 08:35. Confira o horário no app na véspera.","etq":[],"ev":[{"id":"2026-10-15.0.sai","h":"04:50","t":"04:50","c":"time","b":"Sai de <b>Tyrconnell Road a pé</b> — 28 a 32 minutos plano até Heuston pela South Circular → Con Colbert Road → ponte Sean Heuston. Alternativa: FreeNow agendado na véspera para 05:05 (~€10–13) e você sai às 05:00.","ti":"Sair a pé de Tyrconnell Road até Heuston","kind":"do","place":"Heuston Station","maps":"Heuston Station, Dublin","dur":30,"alts":[{"ti":"FreeNow agendado na véspera para 05:05","b":"Táxi agendado pelo app na noite anterior, na porta de Tyrconnell Road às 05:05. Sai por <b>€10–13</b> até Heuston já com a tarifa noturna e você pega o mesmo 782 das 05:35 (T1 às 06:21). Táxi chamado na hora, às cinco da manhã em Inchicore, não é garantido — agende antes.","src":"extra_ULTIMA.json #2 (Táxi só até Heuston, e o 782 igual)","t":"05:05"},{"ti":"Táxi porta a porta até o Terminal 1","b":"Se estiver atrasado ou sem condição de andar: táxi direto de Inchicore ao T1, <b>€40–50</b> (tarifa premium das 20:00 às 08:00, ~13 km). Saindo às 05:45 você desembarca no terminal por volta das 06:15. É o dobro do preço; agende na véspera.","src":"extra_ULTIMA.json #3 (Táxi porta a porta até o Terminal 1)","t":"05:45"}]},{"id":"2026-10-15.1.coach","h":"05:35","t":"05:35","c":"time","b":"<b>Dublin Express 782, Heuston 05:35 → Terminal 1 às 06:21. €10</b>, mais barato no app. Se perder, o seguinte é 06:05 → 06:57 e ainda sobram 1h38.","ti":"Dublin Express 782: Heuston → Terminal 1","kind":"do","place":"Heuston Station","maps":"Dublin Express 782 stop, Heuston Station, Dublin","dur":46,"alts":[{"ti":"782 seguinte: Heuston 06:05 → T1 06:57","b":"Se perder o das 05:35, o próximo Dublin Express 782 sai de Heuston às 06:05 e chega no Terminal 1 às 06:57. Ainda sobram <b>1h38</b> até o fechamento do check-in (08:35). Mesmo €10, mais barato no app.","src":"extra_ULTIMA.json #1 e docs/adendo-dublin-porto-ultima-noite.md (backup vivo 06:05 → 06:57)","t":"06:05"},{"ti":"Táxi direto ao Terminal 1","b":"Se o 782 falhar de vez, táxi até o T1: a referência do plano é <b>€40–50</b> saindo de Inchicore (tarifa premium das 20:00 às 08:00, ~13 km). Não tente Luas nem o combo G1/G2 + ônibus 41: o Luas não vai ao aeroporto e a baldeação não tem horário publicado.","src":"extra_ULTIMA.json #3 e #4 (O que NÃO fazer)","t":""}]},{"id":"2026-10-15.2.ckin","h":"06:35","t":"06:35","c":"note","b":"Check-in da Air France no T1. <b>Fecha 08:35.</b> Café no terminal, e o guarda-volumes só abre às 05:00 — não conte com ele.","ti":"Check-in Air France no T1 e café","kind":"do","place":"Dublin Airport Terminal 1","maps":"Dublin Airport Terminal 1, Dublin","dur":60,"alts":[]},{"id":"2026-10-15.3.voo","h":"09:15","t":"09:15","c":"star","b":"<b>AF1617 Dublin → Paris</b>, e daí Rio e Goiânia. Fim da viagem.","ti":"Voo AF1617 Dublin → Paris → Rio → Goiânia","kind":"do","place":"Dublin Airport Terminal 1","maps":"Dublin Airport Terminal 1, Dublin","dur":105,"alts":[]}]}],"book":[{"id":"b00","w":"⛔ PERDIDO","t":"Kilmainham Gaol e Magazine Fort","b":"Os dois <b>esgotaram em todas as datas da sua janela</b>. Não há o que reservar. Kilmainham: tente as devoluções online entre <b>09:15 e 09:30</b> em qualquer manhã de Dublin. Magazine Fort: um olhar manual no Eventbrite, sem contar com isso. Os substitutos já estão nos dias 28/09 e 01/10 — e são grátis e sem reserva."},{"id":"b01","w":"✅ DECIDE LÁ","t":"Quase tudo, e você está certo","b":"Ballinasloe (grátis), <b>Ballybrit</b> (€20 no portão contra €15 antecipado), <b>galgos de Curraheen</b> (~€10 na porta), <b>Cliffs of Moher</b> (€15 no portão contra €8 online antes das 11:00), <b>Collins Barracks</b> e <b>Richmond Barracks</b> (grátis, entra quem chega), <b>Guinness Open Gate</b> (sem reserva, sem couvert), mercados, pubs, o Céilí Mór, a semifinal de futebol gaélico (ingresso sai na semana) e a <b>final de hurling</b> (só entra à venda na semana do jogo). Esperar custa no máximo €5 a €7 por item — e compra informação melhor."},{"id":"b02","w":"🔴 NÃO ESPERA","t":"Camas em Galway: 2–4 e 6–7/10","b":"É o único item onde esperar pode custar a viagem: a feira de Ballinasloe esvazia a região de quarto na semana de 4 a 11. Athlone é o plano B. Combine com a Priscila se sexta e sábado são no mesmo lugar que eles."},{"id":"b03","w":"🔴 NÃO ESPERA","t":"Cama em Inishbofin, noite de 5/10","b":"Ilha de 200 moradores. O <b>Day's Bar &amp; B&B tem quatro quartos</b> (+353 95 45829); alternativas são o Lapwing House (+353 95 45996) e o hostel (+353 95 45855, privado €70). O Doonmore fechou a temporada e o Inishbofin House Hotel não abre outubro. Para dois, se o Richie for."},{"id":"b04","w":"🔴 NÃO ESPERA","t":"A balsa de Inishbofin — o telefonema","b":"<b>095 37228</b> (seg–sex 10:00–18:00) ou SMS <b>087 180 0586</b>. Confirmar e reservar a <b>saída de segunda 5/10 às 11:30</b> e a <b>volta de terça 6/10 às 09:00</b> — nenhuma das duas está no sistema online para outubro, e a das 09:00 é a que salva Ballybrit. €25 ida e volta. Uma operadora só."},{"id":"b05","w":"🔴 NÃO ESPERA","t":"Camas em Cork: 8 e 9/10","b":"Duas noites na semana do Folk Festival. Perto de South Main Street / Coburg Street, e <b>pergunte sobre estacionamento</b> — agora você chega de carro."},{"id":"b06","w":"🔴 NÃO ESPERA","t":"As três noites em Inchicore: 10, 11 e 14/10","b":"Não é reserva, é pedido: confirmar com quem te hospeda. O fim de semana com a Priscila e o Richie e a madrugada da quinta 15 dependem disso."},{"id":"b07","w":"🟠 ESTA SEMANA","t":"O carro — preço sobe perto da data","b":"Sex 2/10 ~09:00 Dublin → seg 12/10 ~15:30 Aeroporto de Dublin, manual compacto. <b>Reserve com pagamento na retirada e cancelamento grátis</b> — isso trava o preço sem te comprometer. Referência: Focus manual, 11 dias, €250 na carhire.ie com franquia €1.800. Compare Sixt, Hertz e Enterprise depois da resposta da Mastercard."},{"id":"b08","w":"🟠 ESTA SEMANA","t":"Mastercard: a carta e a pergunta","b":"Ligue no número atrás do cartão. <b>A pergunta:</b> “o seguro de veículo alugado cobre a franquia quando o CDW básico vem incluído na tarifa e não pode ser recusado?” <b>O pedido:</b> carta de cobertura em inglês, datada, com seu nome, os 4 últimos dígitos e a frase “Republic of Ireland”. A Sixt e a Avis exigem a carta; o banco leva dias para emitir — por isso é esta semana e não lá."},{"id":"b09","w":"🟠 ESTA SEMANA","t":"PID no Detran-GO","b":"go.gov.br → “Solicitar Permissão Internacional para Dirigir”, ~R$ 207, <b>retirada presencial</b>. Avis e o grupo Europcar exigem para CNH brasileira. É o único item que <b>não dá</b> para resolver na Irlanda — você embarca dia 25."},{"id":"b10","w":"🟡 SE QUISER","t":"14 Henrietta Street, qua 30/09 às 10:00","b":"€12, ainda com datas abertas — a única visita guiada da sua lista que <b>não</b> esgotou. Quarta e quinta são os dias quietos e a casa aceita quem chega, mas a capacidade é pequena. Se quiser garantir, é um clique: 14henriettastreet.ticketsolve.com. Se não, chegue às 09:50 e arrisque."},{"id":"b11","w":"🟡 SE QUISER","t":"Goldie, qui 8/10","b":"28 lugares, 021 239 8720. Em Cork, na semana do Folk Festival, um jantar de 28 lugares numa quinta é o tipo de coisa que enche. Dois minutos de telefone."},{"id":"b12","w":"🟡 SE QUISER","t":"A carne do churrasco — comprar no sábado 10","b":"Domingo fecha tudo na Irlanda. Açougue de Dublin no sábado de manhã, pedindo <b>picanha</b> (ou “rump cap” / “top sirloin cap”), capa de gordura inteira. Ou encomendar na quinta 8 no <b>English Market de Cork</b> e trazer na geladeira de isopor — você está de carro. <b>Sal grosso e farinha de mandioca vêm do Brasil</b>; carne e laticínio, <b>não</b> — é confisco na alfândega da UE."},{"id":"b13","w":"⚪ NA SEMANA","t":"Hurling (só se for sábado), semifinal de Cork, Magazine Fort","b":"A <b>final de hurling virou bônus</b>: ela só entra no roteiro se cair no <b>sábado 10</b>, e aí é parada na estrada Cork → Dublin. Ingresso só à venda na semana do jogo (Future Ticketing, ~€20–25) e a data cravada sai em tipperary.gaa.ie depois das semifinais de 26 e 27/09 — <b>lembrete automático já marcado para 30/09</b>. A semifinal de futebol gaélico de Cork sai na segunda ou terça antes (gaacork.ie). E o Eventbrite do Magazine Fort, para o caso de desistência."}],"doubts":[{"titulo":"Os museus de Dublin — verificado em 17/09","texto":"<b>Kilmainham Gaol: esgotada em 100% das datas liberadas</b> (17/09 a 15/10). O calendário do sistema distingue “esgotado” de “não liberado”, e tudo dentro da janela de 28 dias está esgotado — então não é o seu dia, é a atração. Sem venda no portão, sem revenda. Única porta: devoluções online 09:15–09:30. <b>Magazine Fort: bloco de outubro publicado e esgotado</b> (12 lugares/dia). ⚠️ Não consegui ler o Eventbrite linha por linha — pode haver vaga solta no dia 1; vale um olhar manual. <b>Dublin Festival of History: 13 de 34 eventos do fim de semana já esgotados</b>, e três dos quatro do Richmond Barracks. <b>14 Henrietta Street ainda tem datas</b>, mas o estoque real é JavaScript e não consegui ler: 01 524 0383. Tudo o mais da sua lista entra sem reserva."},{"titulo":"O seguro do cartão — o que está confirmado e o que não está","texto":"<b>Confirmado no guia de benefícios da Mastercard Black (versão set/2025, vigente):</b> cobertura “em qualquer lugar do mundo”, até 60 dias, colisão, roubo, vandalismo, fenômenos da natureza; condições: recusar o CDW da locadora, alugar e pagar a caução com o cartão, contrato no seu nome. Irlanda, Israel e Jamaica <b>não aparecem</b> em lista de exclusão nenhuma. <b>Não confirmado:</b> se a apólice cobre a <i>franquia</i> quando o CDW básico vem embutido na tarifa e não pode ser recusado (o modelo Hertz/Sixt), e o prazo de aviso de sinistro. É a pergunta do telefonema."},{"titulo":"As locadoras e o cartão brasileiro","texto":"<b>Europcar, Irish Car Rentals e carhire.ie:</b> só aceitam dispensa de CDW com cartão americano ou canadense, carta do emissor citando “Republic of Ireland” e caução de €5.000 — cartão brasileiro não entra. <b>Avis/Budget:</b> aceitam “prova de cobertura de terceiro”, caução €5.000 + €30 de taxa; o texto de marketing fala em cartões americanos/canadenses — confirme por e-mail. <b>Sixt:</b> aceita carta do provedor citando a Irlanda e o veículo, caução €5.000 + €39,73. <b>Enterprise:</b> deixa recusar o CDW e você assume o valor integral; não publica caução nem exigência de carta. <b>Hertz:</b> CDW com franquia (€2.000 Polo, €2.500 Golf/Focus, €3.500 Octavia) e SuperCover opcional; sem SuperCover, bloqueia a franquia e cobra dela em caso de dano — você recupera do cartão depois."},{"titulo":"Cotações de aluguel","texto":"A única locadora que cota sem JavaScript hoje é o grupo carhire.ie / Irish Car Rentals (Thrifty): <b>Ford Focus manual, 11 dias, €215,27 + €35 de one-way cidade → aeroporto = €250,27</b>, com CDW e roubo incluídos e franquia €1.800; aeroporto → aeroporto €217,47. Enterprise, Sixt, Avis, Europcar e os brokers só cotam com navegador — os valores deles ficam para você conferir no app antes de fechar. Outubro é baixa temporada: espere €25–45/dia num compacto manual."},{"titulo":"Inishbofin — as balsas de outubro","texto":"A operadora é uma só e os horários de setembro são 11:30/18:45 de ida e 09:00/17:00 de volta. <b>Para outubro só as saídas das 18:45 e 17:00 estão à venda online</b>, e o site não publica tabela de outubro. Se a das 11:30 de segunda e a das 09:00 de terça rodarem, o plano fecha; se não, a segunda vira saída às 18:45 e a terça perde Ballybrit. Resolve-se com um telefonema: 095 37228."},{"titulo":"Inishbofin — cama e Richie","texto":"O Day's Bar B&B não publica preço nem disponibilidade legível; o Inishbofin House Hotel aparece fechado para outubro; o Doonmore fechou em 27/09. E o Richie “vai ver se consegue ir”: se for, é de carro dele e são duas camas; se não, GoCar de dois dias (~€165). Duas incógnitas que se resolvem no mesmo dia: pergunte a ele e ligue para o Day's."},{"titulo":"Cliffs of Moher — entrada e ônibus","texto":"O 350 está confirmado no feed oficial (16/09/2026 a 27/01/2027) e sai do <b>Bus Station ao lado da Ceannt, não do Coach Station</b>. O ingresso online é €8 até as 11:00, €12 depois, €15 na porta; não há regra publicada para quem chega de ônibus, então compre. A trilha costeira de Doolin até os Cliffs está fechada — só o trecho até o Surfers Path abre."},{"titulo":"Ballinasloe — a opinião deles","texto":"A Priscila e o Richie não recomendam. O Richie tinha dito “grand” no questionário. As duas coisas cabem juntas: é uma feira de Travellers, com fama áspera, que um irlandês não recomendaria a uma amiga estrangeira — e é exatamente o que você pediu. Você decidiu ir de dia, sozinho, e voltar cedo. Se ouvir o Richie ao vivo no sábado e mudar de ideia, o domingo vira Galway."},{"titulo":"Trens de domingo 11/10","texto":"Horários e tarifas vêm do feed oficial e do sistema de vendas da Irish Rail em 14/09, sem obras carregadas ainda. Reconfira alterações de serviço em irishrail.ie uma semana antes. As passagens Low (€14,99) valem só para o trem escolhido."},{"titulo":"Beara — horários de comida e tempo de direção","texto":"Breen's (sex 12:00–17:00 e 17:30–21:30) e Murphy's vêm de avaliações de julho–agosto de 2026, não do site. O cardápio do MacCarthy's é imagem. <b>Ligue 027 70031 / 027 70014 na quinta 8.</b> Os 280 km e 4h30 são cálculo de rede viária; conte 6h."},{"titulo":"Montanhas de Dublin — os ônibus","texto":"S8, 16, 15B e 44 rodam sob esses nomes no feed da NTA. A fase A do BusConnects está prevista para “outono de 2026, sujeito a financiamento”, sem data, e pode mexer na família do 15. Confira no TFI Live na semana. A trilha de Bray a Greystones está fechada (2/9/2026) — isso é para o sábado 10 com eles."},{"titulo":"Magazine Fort — a reserva ainda não existe","texto":"Visita grátis das 11:00, diária, <b>12 lugares</b>, mas o OPW publica no Eventbrite em blocos de quinze dias e o de outubro ainda não estava no ar. <b>A duração da visita não está publicada em fonte alguma</b>. Ligue 01 677 0095."},{"titulo":"Richmond Barracks — preço e café","texto":"Nem o site oficial nem a Câmara publicam preço de entrada (tudo indica grátis), e o café “The Mess” não é mencionado no site atual. Ligue 01 524 2532."},{"titulo":"Coddle no Patriot's Inn","texto":"<b>O coddle não aparece no cardápio atual que consegui ler.</b> Ligue 01 679 9595 antes de ir por causa do prato."},{"titulo":"O café da manhã tradicional de Dublin","texto":"Constatação, não dúvida: <b>a caçarola de operário de Dublin praticamente se extinguiu.</b> O que substituiu foi o balcão quente de deli e o breakfast roll. Não inventei um endereço para preencher a lacuna."},{"titulo":"Final de hurling — por que ela virou bônus","texto":"Três fatos, verificados em 17–18/09. <b>Um:</b> as <b>seis últimas finais sênior de hurling de Tipperary foram todas no domingo</b> — 2020, 2021, 2022, 2023, 2024 e 2025, nenhuma no sábado. <b>Dois:</b> <b>três dessas seis foram para replay</b> (2021, 2022, 2023), sempre cerca de duas semanas depois — se a de 10–11/10 empatar, o jogo que decide cai por volta de 24–25/10, quando você já está em casa. <b>Três:</b> a data ainda não existe. As semifinais são <b>sáb 26 e dom 27/09</b>, no Semple Stadium, e a final deve ser anunciada na semana seguinte. O único sinal a favor do sábado é que o próprio conselho do condado passou a usar sábado nessa fase. Por isso o churrasco é o plano e a final é o bônus — e não o contrário."},{"titulo":"Thurles de carro — os números","texto":"Cork → Thurles: <b>114 km, 81 min</b>, saindo da M8 na <b>saída 6 (Horse and Jockey)</b> pela N62. Thurles → Dublin: <b>149 km, 112 min</b>, entrando pela <b>saída 5 (Twomileborris)</b>, que é só de entrada no sentido norte. Direto Cork → Dublin: 255 km, 182 min. <b>O desvio custa +8,5 km, +11 minutos e nada de pedágio</b> (€2,30 + €2,30 nos dois casos). Números de roteador aberto, não oficiais: some 20–30 min de trânsito em dia de jogo. ⚠️ A Câmara de Tipperary publicou em 2025 uma página sobre fechar a saída 6 no sentido norte e eu não consegui abrir — se estiver fechada, o desvio é pela saída 7 (Cashel) e a R660. <b>Estacionamento:</b> rede de estacionamentos com fiscal pela cidade (St Patrick's College na Cathedral Street e os da Liberty Square são os mais perto); ⚠️ a Garda multa quem estaciona nas ruas residenciais atrás da arquibancada velha."},{"titulo":"Clube de canto — caiu","texto":"Com o domingo 11 virando churrasco em Dublin, a única ida sentada que sobrava (An Spailpín, domingo 11 em Cork) morre de vez. A música fica como você pediu: pano de fundo de pub, sem programa marcado."},{"titulo":"Aula de dança no Cobblestone em 28/09","texto":"O calendário publicado do termo de outono é 07/10 a 04/11. Confirme em info@louise.ie. <b>Essa é a sua única noite de Cobblestone em Dublin</b> — vale o telefonema."},{"titulo":"Preço de Ballybrit","texto":"€15 é o preço publicado de 2025; a página do card de 06/10/2026 ainda não foi atualizada."},{"titulo":"Jogo do FC Porto em 13 ou 14/10","texto":"A 2ª rodada da fase de liga da Champions é 13–14/10 e o Porto está na competição. Confira em bilhetes.fcporto.pt."},{"titulo":"Um erro meu, corrigido","texto":"Eu havia citado um “Slattery's de Rialto” como early house perto de Inchicore. <b>Não existe.</b> O que existe é o <b>Slatt's, na Tyrconnell Park, a 150 metros da sua porta</b>. E o early house de verdade ao seu alcance é <b>o Galway Hooker, dentro da estação Heuston</b>, que abre às 07:00 todo dia — mas não serve comida."}],"etiquette":[{"titulo":"Travellers — a palavra e o assunto (Ballinasloe)","itens":["<b>Richie, sem rodeio: “Don't say travellers!”</b> A palavra não sai da sua boca no Fair Green — nem para elogiar, nem para perguntar, nem para explicar o que você leu. Você é um brasileiro vendo cavalos; é isso que se conversa.","<b>Nunca</b> “tinker”, “knacker”, “gypsy”, “itinerant”. São insultos, alguns criminosos. E não pergunte a ninguém se é Traveller.","Cavalo se olha; não se toca e não se avalia em voz alta. Negócio é entre duas pessoas — quem está de fora não comenta preço.","Se perguntarem de onde você é, responda com prazer e pergunte de volta sobre o cavalo. Fim de conversa boa: “fair play to you”.","Leia antes: <a href='https://www.paveepoint.ie/traveller-factsheets/'>paveepoint.ie/traveller-factsheets</a>. Dez minutos que evitam a única gafe grave disponível na viagem."]},{"titulo":"Câmera","itens":["<b>Gente não é paisagem.</b> Sem foto de pessoas, crianças ou negócios de cavalo sem pedir — e na feira, pedir já é intromissão. Fotografe o campo, não o negócio.","Sessão de pub: <b>nunca filme</b>. O músico que te viu filmar não volta a tocar solto. Bingo e mart: câmera no bolso a noite inteira.","No clube de canto, o celular fica guardado do começo ao fim. No estádio, foto do jogo é normal; foto das famílias na arquibancada, não."]},{"titulo":"Segurança na feira","itens":["80 mil pessoas numa vila de 6.600. Carteira no bolso da frente, notas pequenas, o celular só sai para o ônibus. Richie: “Grand — nobody will bother him.”","Fique fora do caminho dos cavalos e dos condutores: quem está segurando um animal tem prioridade absoluta. Não passe por trás de cavalo nenhum.","Beba devagar de dia: o fim de tarde é quando o Fair Green fica áspero. O último Citylink é 00:25; não seja o último a sair do pub.","Sulky racing é proibido desde 2015 — se vir corrida improvisada na rua, é a hora de se afastar, não de olhar."]},{"titulo":"Clube de canto (o mais rígido de todos)","itens":["Silêncio absoluto durante o canto — a única situação em pub irlandês onde falar por cima é ofensa real. Coro só se a sala entrar. Aplauso no fim.","<b>Não leve violão.</b> Clube de canto é à capela, sem instrumento. Isso é diferente de uma <i>session</i> instrumental.","Nome na lista com o organizador. Se cantar, cante algo brasileiro sem acompanhamento — Richie disse “grand”. Uma música, não três.","Chegue antes de começar e não saia no meio de uma canção. Pinta na mão é normal; o balcão espera a canção acabar."]},{"titulo":"Bingo","itens":["Chegue 20–30 minutos antes. As pessoas <b>têm</b> seus lugares. Pergunte “is anyone sitting here?” e, se disserem que é da Mary, levante.","Compre o <i>book</i> na mesa da entrada (€10–20) e um <b>dabber</b> (€1,50–3). Caneta não serve. Não peça emprestado o dabber de estranho. Leve dinheiro em notas pequenas.","Depois do <i>eyes down</i>, silêncio total. Celular no silencioso e guardado.","Quando completar, grite <b>“Check!”</b> (alguns dizem “House!”), pare de marcar e levante o cartão. Se errar, “sorry, false call” — acontece o tempo todo.","Você vai ser notado: sala majoritariamente feminina e acima de 60. A frase que resolve tudo é “I'm from Brazil, I'm travelling, I've never played bingo and I wanted to try it”.","Nada de fotografar o salão. Compre o book, entre na rifa e ajude a empilhar as cadeiras no fim."]},{"titulo":"Mart de gado (só no plano de chuva)","itens":["O Richie foi claro: “No. Leave the men to it.” Por isso o mart saiu do plano principal. Se for no plano de chuva, vá ao escritório primeiro e diga: <b>“I'm just here to look, I'm not buying.”</b>","Bota que você não se importe em estragar. Sente no fundo da arquibancada do ringue, nunca na beira.","<b>Nunca levante a mão, acene com a cabeça ou segure o olhar do leiloeiro.</b> Não entre nos currais nem bloqueie os corredores.","A cantina no andar de cima é onde se conversa — não à beira do ringue. Um jantar do mart sai por ~€8–12."]},{"titulo":"Jogo do GAA","itens":["Sem código de vestimenta. Mas <b>não vista camisa de condado</b> (o azul-e-ouro de Tipperary, o vermelho de Cork): final de clube é paróquia contra paróquia e a camisa te marca como turista. Roupa neutra é o certo.","“I've no dog in this fight, I'm just here for the match” é resposta perfeitamente normal e costuma render vinte minutos de conversa sobre as duas paróquias.","Chegue cedo: a final intermediária antes entra no mesmo ingresso e costuma ser tão boa quanto. Não se vende álcool dentro. <b>O Semple Stadium não aceita dinheiro</b> — só cartão nos portões e balcões.","Jogadores são amadores: o açougueiro e o professor da cidade. Elogiar o jogo no pub depois é o jeito de entrar na conversa."]},{"titulo":"Pubs","itens":["<b>A rodada é obrigação — e tem vez.</b> Richie: “He'll buy a round out of turn. He'll survive.” Quem chega numa mesa oferece a rodada; depois espera a sua vez chegar de novo.","Sessão não é show: sem pedidos, sem palmas no meio do conjunto de tunes, sem filmar. Você bebe e conversa baixo; a música é o fundo.","Assuntos pesados que não são papo de balcão: o Norte, a Igreja, a Fome, política sobre Travellers. Corrida de galgo divide a Irlanda desde o RTÉ Investigates de 2019 — não é papo leve.","Não se dá gorjeta no balcão. Peça no balcão, não na mesa. “Grand” resolve 80% das perguntas e “sound” é o elogio máximo."]}],"bands":[{"faixa":"Compromissos fixos","itens":[{"de":0,"ate":2,"rotulo":"Dublin com a Priscila","tipo":"fix","texto":"25–27/09 em Dublin, com a Priscila. Base: Tyrconnell Road, Inchicore."},{"de":3,"ate":3,"rotulo":"dia livre","tipo":"fix","texto":"Seg 28/09 — o único dia inteiro livre em Dublin: Kilmainham Gaol, Collins Barracks, Open Gate, Cobblestone."},{"de":4,"ate":6,"rotulo":"estágio (tarde + noite)","tipo":"fix","texto":"29/09, 30/09 e 01/10 — estágio no restaurante à tarde e à noite. Só as manhãs são suas."},{"de":7,"ate":8,"rotulo":"Galway com a Priscila e o Richie","tipo":"fix","texto":"Sex 02 e sáb 03/10 em Galway, com os dois. Eles voltam para Dublin no domingo."},{"de":15,"ate":16,"rotulo":"Dublin com eles","tipo":"fix","texto":"Sáb 10 — Cork → Dublin de carro e o dia com eles (Howth ou Wicklow). Dom 11 — churrasco na casa dos pais do Richie. Dorme em Inchicore nas duas noites."},{"de":17,"ate":19,"rotulo":"Porto","tipo":"porto","texto":"Comprado: FR7072 seg 12/10 19:35 → Porto 22:00 e FR7079 qua 14/10 17:55 → Dublin 20:20. €136,34 pagos."},{"de":20,"ate":20,"rotulo":"voo pra casa 09:15","tipo":"fix","texto":"Qui 15/10 — AF1617 09:15. Check-in fecha 08:35. Dublin Express 782 de Heuston às 05:35."}]},{"faixa":"★ Carro e montanha","itens":[{"de":7,"ate":17,"rotulo":"carro alugado — sex 2 → seg 12","tipo":"soft","texto":"Aluguel em Dublin na sexta 2 com a Priscila e o Richie; eles voltam de trem no domingo 4 e o carro fica com você até a devolução no aeroporto de Dublin, segunda 12 ~16:00. ~1.500 km."},{"de":2,"ate":2,"rotulo":"montanhas de Dublin","tipo":"s1","texto":"Dom 27/09 — travessia Marlay Park → Fairy Castle → Three Rock → Tibradden → Cruagh → Hell Fire Club: ~25 km, ~900 m, 7–8 h. Luas + S8 na ida, 15B na volta. Sugestão do Richie."},{"de":10,"ate":11,"rotulo":"Inishbofin — pernoite","tipo":"hot","texto":"Seg 05 → ter 06/10 — carro até Cleggan (89 km), balsa 11:30, noite no Day's Bar B&B, balsa 09:00 de terça. Com o Richie, se ele conseguir. “My favourite place in the country.”"},{"de":12,"ate":12,"rotulo":"Cliffs · bus 350","tipo":"s1","texto":"Qua 07/10 — Bus Éireann 350 do Galway Bus Station 07:00 → Cliffs 08:54 (€9,45 Leap), ingresso €8 online no horário da manhã, almoço em Doolin, volta 14:21 ou 16:08."},{"de":14,"ate":14,"rotulo":"Beara + Healy Pass","tipo":"hot","texto":"Sex 09/10 — GoCar na estação Kent → Glengarriff → Castletownbere (caranguejo) → Healy Pass → Kenmare → Cork, ~280 km. Galgos em Curraheen às 19:35."}]},{"faixa":"★ Feira de Ballinasloe","itens":[{"de":9,"ate":9,"rotulo":"DOMINGO — sozinho","tipo":"hot","texto":"Dom 04/10 — o dia de negócio de cavalos no Fair Green, sem os amigos (eles não recomendam; você decidiu ir de dia e voltar cedo). Citylink 763, 60 min. A segunda-feira na feira caiu para dar lugar à ilha."},{"de":10,"ate":10,"rotulo":"seg (fora)","tipo":"soft","texto":"Seg 05/10 é o segundo dia de negócio — mas você estará na balsa para Inishbofin."},{"de":11,"ate":16,"rotulo":"festival de família — dá pra pular","tipo":"soft","texto":"07–11/10 vira festival de vila: show de cães, tratores antigos, motoqueiro acrobata, country'n'Irish no palco. O domingo 11 tem a feira tradicional de ovelhas."}]},{"faixa":"★ Cork Folk Festival","itens":[{"de":13,"ate":14,"rotulo":"47ª edição — pano de fundo de pub","tipo":"hot","texto":"08–11/10/2026, confirmado pelo site do festival. Sessões grátis no Sin É (18:00–24:00), An Spailpín (21:30), Corner House; Folk on the Coal Quay ao ar livre no sábado; Trad in the Fort no domingo. Do programa pago, o Richie marcou uma coisa só: o Céilí Mór."}]},{"faixa":"Corridas","itens":[{"de":0,"ate":1,"rotulo":"Listowel","tipo":"s1","texto":"Listowel Harvest Festival 20–26/09 — uma vila inteira de porre por sete dias. Sex 25 = Ladies Day, sáb 26 = dia local. €20–25."},{"de":9,"ate":10,"rotulo":"Killarney","tipo":"s1","texto":"Killarney Racecourse, 04–05/10."},{"de":11,"ate":11,"rotulo":"corrida","tipo":"hot","texto":"★ Galway Races em Ballybrit, ter 06/10: 7 páreos de obstáculo, portões 12:30, 1º páreo 14:20, ~€15. Richie: “Ballybrit on a Tuesday.”"}]},{"faixa":"GAA — o jogo do povo","itens":[{"de":7,"ate":9,"rotulo":"semis hurling (Cork)","tipo":"s2","texto":"02–04/10: semifinais do hurling do condado de Cork, em campos de clube no interior. Ingresso só online, €10–15."},{"de":14,"ate":16,"rotulo":"semis futebol (Cork)","tipo":"s2","texto":"09–11/10: semifinais de futebol gaélico do condado de Cork, também em campos de clube — a opção da tarde de sábado 10."},{"de":15,"ate":16,"rotulo":"final de hurling — 10 OU 11","tipo":"hot","texto":"A data cravada sai em tipperary.gaa.ie depois das semifinais (sáb 26 e dom 27/09). <b>Se cair no sábado 10</b>, entra como parada na estrada Cork → Dublin: desvio de +11 min e €0 de pedágio. <b>Se cair no domingo 11</b> (o histórico diz que sim: as seis últimas foram todas no domingo), ela cai e o churrasco fica. Decisão em 30/09."},{"de":16,"ate":16,"rotulo":"★ CHURRASCO","tipo":"hot","texto":"Dom 11/10 — churrasco na casa dos pais do Richie, em Dublin. Dia inteiro, sem dirigir. É o ponto alto do fim da viagem e não depende de calendário nenhum."}]},{"faixa":"Galgos, €10","itens":[{"de":0,"ate":1,"rotulo":"galgo","tipo":"dot","texto":"Curraheen Park (Cork) e Galway correm sexta e sábado. Portões 18:30, 1º páreo ~19:35–19:50, €10 na porta."},{"de":7,"ate":8,"rotulo":"galgo","tipo":"dot","texto":"Sex 02 e sáb 03/10 — galgos em Cork (Curraheen) e Galway."},{"de":14,"ate":14,"rotulo":"galgo","tipo":"dot","texto":"Sex 09/10 — galgos em Curraheen Park depois de Beara. Richie: “The dogs.”"}]},{"faixa":"The Welcome Inn (Cork)","itens":[{"de":5,"ate":5,"rotulo":"folk","tipo":"dot2","texto":"Qua 30/09 — Fireside Folk 21:30, grátis."},{"de":6,"ate":6,"rotulo":"banjos","tipo":"dot2","texto":"Qui 01/10 — Ballads & Banjos 21:30, grátis."},{"de":12,"ate":12,"rotulo":"folk","tipo":"dot2","texto":"Qua 07/10 — Fireside Folk 21:30, grátis."},{"de":13,"ate":13,"rotulo":"banjos","tipo":"dot2","texto":"Qui 08/10 — Ballads & Banjos 21:30, grátis. Último early house da Irlanda: abre às 07:00 todos os dias, desde 1845. Não serve comida."},{"de":19,"ate":19,"rotulo":"folk","tipo":"dot2","texto":"Qua 14/10 — Fireside Folk 21:30, grátis."}]},{"faixa":"Feiras de gado (marts)","itens":[{"de":3,"ate":3,"rotulo":"mart","tipo":"mart","texto":"Seg — Bandon Mart, gado às 11:00, bezerros 10:30."},{"de":5,"ate":5,"rotulo":"mart","tipo":"mart","texto":"Qua — Ballinasloe Mart, venda de gado às 11:00."},{"de":8,"ate":8,"rotulo":"mart","tipo":"mart","texto":"Sáb — Macroom (11:30) e Ballinasloe (weanlings, 11:00)."},{"de":10,"ate":10,"rotulo":"mart","tipo":"mart","texto":"Seg — Bandon Mart. (Mas você estará em Ballinasloe.)"},{"de":12,"ate":12,"rotulo":"mart","tipo":"mart","texto":"Qua 07/10 — Ballinasloe Mart, gado às 11:00. Era o plano B do dia de carro; Inishbofin ganhou."},{"de":14,"ate":14,"rotulo":"mart","tipo":"mart","texto":"Sex 09/10 — Skibbereen Mart, dois ringues às 11:00. Saiu do plano (Richie: “leave the men to it”); volta só como plano de chuva."},{"de":15,"ate":15,"rotulo":"mart","tipo":"mart","texto":"Sáb 10/10 — Macroom Mart, 10:30/11:30."},{"de":17,"ate":17,"rotulo":"mart","tipo":"mart","texto":"Seg 12/10 — Bandon Mart."}]},{"faixa":"Comida","itens":[{"de":0,"ate":2,"rotulo":"Galway Oyster","tipo":"s4","texto":"25–27/09. A marquise com ingresso é exatamente a armadilha que você odeia; a rua e os pubs cheios, não."},{"de":7,"ate":9,"rotulo":"★ Dingle Food Festival","tipo":"s4","texto":"02–04/10, confirmado. Taste Trail: €20 = livro de 6 tickets, €3 por prova, 60–70 casas. Sáb e dom 13:00–17:00. Comitê de voluntários locais, sem fins lucrativos."},{"de":7,"ate":9,"rotulo":"Bia Bó Finne (Inishbofin)","tipo":"s4","texto":"02–04/10 — o festival de comida de Inishbofin é no fim de semana anterior à sua visita de quarta."}]},{"faixa":"Outros festivais","itens":[{"de":0,"ate":5,"rotulo":"Lisdoonvarna (fecha 30/09)","tipo":"s4","texto":"Festival de casamenteiros, 01–30/09/2026. O último fim de semana é 25–27/09 — exatamente o da Priscila. Música country'n'Irish e jive, não trad."},{"de":9,"ate":9,"rotulo":"Misleór","tipo":"s3","texto":"04/10 — o Misleór, festival de culturas nômades do Galway Traveller Movement, vai à feira de Ballinasloe. Essa é a porta de entrada respeitosa."},{"de":0,"ate":2,"rotulo":"Misleór (Galway city)","tipo":"s3","texto":"24–27/09, Galway City. Teatro com elenco Traveller, painéis, oficinas de funilaria, música."},{"de":0,"ate":2,"rotulo":"Clifden Arts","tipo":"s4","texto":"Termina 27/09. O festival de artes comunitário mais antigo da Irlanda, em Connemara."}]}],"confirmado":[{"titulo":"Voos Ryanair — <b>reserva D2T4SZ</b>","itens":["<b>Ida:</b> FR7072, seg 12/10, Dublin 19:35 → Porto 22:00","<b>Volta:</b> FR7079, qua 14/10, Porto 17:55 → Dublin 20:20","Pago: <b>€136,34</b> · MasterCard final 5548","Lembretes automáticos de check-in criados para 11/10 e 13/10 — chegam no seu celular"]},{"titulo":"Voos Air France — <b>reserva Y4WCIU</b>","itens":["<b>Chegada:</b> EI0521, sex 25/09, Paris CDG 10:20 → Dublin 11:15","<b>Volta:</b> AF1617, qui 15/10, Dublin <b>09:15</b> → Paris, e daí Rio e Goiânia","⚠️ O check-in da Air France <b>fecha às 08:35</b>. É a trava que organiza os últimos três dias da viagem."]},{"titulo":"Carro — o cenário novo: alugado de sexta 2 a segunda 12","itens":["A Priscila e o Richie <b>não têm carro</b>: vocês alugam um em Dublin na sexta 2, vão os três para Galway, eles voltam de trem no domingo e <b>o carro fica com você até a devolução no aeroporto de Dublin, segunda 12, antes do voo</b>. Dez dias e meio, ~1.500 km.","Os dois GoCar (Galway seg–ter e Cork sex) <b>saem do plano</b>; os ônibus para Galway e para Cork e o trem de sábado também. A seção 06 tem os preços, as locadoras e — o mais importante — a verdade sobre o seguro do seu cartão na Irlanda.","✅ <b>Mastercard Black do Brasil cobre a Irlanda</b> (guia de benefícios vigente: “em qualquer lugar do mundo”, até 60 dias). ⚠️ Mas <b>três locadoras irlandesas recusam ou dificultam cartão que não seja americano/canadense</b> — a escolha da locadora é o que decide se o seguro do cartão vale ou não.","✅ A CNH continua valendo perante a lei irlandesa; ⚠️ mas <b>Avis e o grupo Europcar exigem PID no balcão</b> para carteira brasileira. Tirar a PID esta semana no Detran-GO (~R$ 207, retirada presencial) é o que elimina o risco em qualquer balcão."]},{"titulo":"Base em Dublin — e ela conta duas vezes","itens":["38–41 Tyrconnell Road, Inchicore, D08 TXV4 — de 25/09 a 01/10, <b>o fim de semana de 10 e 11/10</b> e a noite de 14 para 15/10.","Luas linha vermelha: parada <b>Goldenbridge</b> ou <b>Suir Road</b>. Smithfield 12 min, O'Connell St 18 min.","Ônibus <b>G1 e G2 param em Inchicore Village e rodam 24 horas</b> — é a sua volta pra casa de madrugada.","Leap Card: €2,00 por 90 minutos em ônibus + Luas + DART, teto de €6/dia e €24/semana. A bordo o ônibus só aceita moeda.","⚠️ <b>Confirme com quem te hospeda as três noites avulsas: 10, 11 e 14/10.</b> A seção 08 e o fim de semana com eles dependem disso."]},{"titulo":"Estágio no restaurante — 29, 30/09 e 01/10","itens":["Tarde <b>e</b> noite ocupadas nos três dias. Sobra só a manhã, e é isso que a seção 04 usa.","Todos os planos de manhã terminam por volta das <b>12:15</b>, com o caminho de volta contado.","Se o seu turno começar mais tarde que 13:00, cada manhã ganha uma hora de folga — e aí o Magazine Fort deixa de ser apertado."]}],"carro":[{"titulo":"O desenho","itens":["<b>Sexta 2/10, ~09:00, Dublin</b>: retirada (filial da cidade ou aeroporto), os três para Galway pela M4/M6 — 2h30, pedágios €3,60 + €2,30. Saindo de Inchicore pela N4 (Con Colbert Road) você <b>não passa pela M50</b> e não paga os €3,80 que a locadora cobra com taxa.","<b>Domingo 4</b>: eles voltam de trem (Ceannt → Heuston) ou Citylink; o carro fica em Galway. Para Ballinasloe você vai de Citylink mesmo: as ruas da vila fecham de sábado 20:00 a segunda 21:00 e o estacionamento oficial é no arrabalde.","<b>Segunda 5 → terça 6</b>: Cleggan e a ilha (carro no estacionamento privado, ~€4/dia). <b>Terça</b>: Ballybrit tem estacionamento grátis, mas quem estaciona não bebe — deixe o carro e vá de 409 ou do shuttle de €8 da Eyre Square.","<b>Quarta 7</b>: os Cliffs viram <b>a estrada do Burren</b> — Kinvara, Ballyvaughan, Black Head, Fanore, Doolin, Cliffs (estacionamento incluído no ingresso), Lisdoonvarna e volta: ~200 km. O ônibus 350 continua no dia como plano sem carro.","<b>Quinta 8</b>: Galway → Cork pela M18/M20 em ~2h45 (contra 4h30 de ônibus), pedágio do túnel de Limerick €2,30. <b>Sexta 9</b>: Beara com este carro. <b>Sábado 10</b>: Cork → Dublin pela M8 cedo (2h45, €4,60 de pedágio) e o dia de Wicklow ou Howth com eles — <b>é este carro que torna o plano deles possível</b>.","<b>Domingo 11</b>: Thurles de carro (1h45 pela M7/M8) ou de trem — se o Richie for e houver pinta, é trem. <b>Segunda 12, ~16:00</b>: devolução no <b>Eastlands Car Hire Facility</b> do aeroporto, shuttle grátis até o T1 (~5 min, a cada ~20 min) — conte 45 minutos da entrada do pátio ao check-in."]},{"titulo":"Quanto custa, honestamente","itens":["<b>Carro:</b> €250 (Focus manual, 11 dias, carhire.ie, com CDW e franquia €1.800, taxa de one-way incluída) a ~€400 numa das grandes. <b>Combustível:</b> ~1.500 km ÷ 17 km/l × €1,87/l (gasolina, AA Ireland, set/2026; diesel €1,94) ≈ <b>€165</b>. <b>Pedágios:</b> ~€25. <b>Estacionamento:</b> Galway e Cork à noite, ~€10–20/noite — pergunte à hospedagem antes de reservar a cama.","<b>Seguro:</b> zero se o cartão cobrir e a locadora aceitar (caução bloqueada: €1.800–5.000 conforme a locadora); ou <b>€23–35/dia</b> pelo zero de franquia da própria locadora (€253–385 em 11 dias) se não.","<b>Total realista: €440 (com o cartão) a €800 (com o seguro da locadora).</b> O plano anterior sem carro custava ~€400 em GoCar, ônibus e trens — e não dava carro nenhum ao fim de semana deles nem ao sábado em Wicklow. Dividido com a Priscila e o Richie nos dias em que estão dentro, o carro sai mais barato que a alternativa.","Motorista adicional (a Priscila ou o Richie na sexta e no sábado): €11–12 por dia. Só se alguém além de você for dirigir."]},{"titulo":"O seguro do cartão, sem ilusão","itens":["✅ <b>A Mastercard Black do Brasil cobre a Irlanda.</b> O guia de benefícios em vigor diz “em qualquer lugar do mundo”, até 60 dias, com as condições de sempre: recusar o CDW da locadora, alugar e pagar a caução com o cartão, contrato no seu nome. (A Visa exclui a Irlanda nominalmente; a Mastercard não.)","⚠️ <b>A locadora é quem decide se você consegue usar isso.</b> Europcar, Irish Car Rentals e carhire.ie <b>recusam cartão que não seja americano ou canadense</b>. Avis/Budget e Sixt aceitam com <b>carta do emissor, em inglês, datada, com seu nome e a frase “Republic of Ireland”</b> — e bloqueiam <b>€5.000</b> no cartão mais uma taxa de €30–40. A Hertz nem pede carta: você fica com o CDW da tarifa (franquia €2.000–3.500 bloqueada) e não compra o SuperCover; se bater, ela cobra a franquia e você recupera do cartão.","❓ <b>A pergunta que decide tudo</b>, para fazer à Mastercard antes de reservar: <i>“o seguro cobre a franquia quando o CDW básico vem incluído na tarifa e não pode ser recusado?”</i> Se sim, a Hertz (sem carta, caução menor) é o caminho mais simples. Se a resposta for “só com recusa total do CDW”, é Sixt com a carta.","Cartão <b>físico, no seu nome, com limite livre para a caução</b> — €5.000 bloqueados durante 11 dias em cima do resto da viagem. Confira o limite antes de sair do Brasil."]},{"titulo":"A carteira","itens":["<b>Lei irlandesa:</b> a CNH vale sozinha (S.I. 384/1992: “domestic driving licence <i>or</i> international driving permit”). <b>Contrato de locadora:</b> Avis e o grupo Europcar pedem PID para carteira sem tradução em inglês; Hertz e Enterprise “recomendam”; a Sixt se contradiz entre a página de termos e a de marketing.","<b>Tire a PID esta semana</b>: go.gov.br → “Solicitar Permissão Internacional para Dirigir”, Detran-GO, ~R$ 207, retirada presencial. Custa pouco e elimina o único risco que pode te deixar a pé no balcão.","Leve a <b>CNH física</b>: a s.40 do Road Traffic Act obriga a apresentá-la a um Garda. Foto no celular não vale. Carteira há mais de 2 anos (Hertz/Avis exigem), e a Sixt pede 4.","Estradas locais “L” a 60 km/h desde 2025; na R336 de Connemara a velocidade segura é 40. Nunca troque de faixa dentro da rotatória. Do Eyre Square, a N59 até Moycullen são 25 km retos para calibrar a mão inglesa antes de Cleggan."]}],"ultima":[{"titulo":"★ A pé até Heuston + Dublin Express 782","custo":"€10","classe":"rec","texto":"<b>É a recomendação, e é quase de graça.</b> Você acorda em Inchicore, sai de Tyrconnell Road <b>às 04:50 a pé</b> e faz os <b>28 a 32 minutos plano</b> até a estação Heuston pela South Circular → Con Colbert Road → ponte Sean Heuston. O <b>Dublin Express 782 sai de Heuston às 05:35 e chega no Terminal 1 às 06:21</b>. Passagem <b>€10</b>, mais barata comprando no app. O check-in da Air France fecha às 08:35: você chega com <b>2 h 14 de folga</b>. E se perder esse, o <b>seguinte é 06:05 → 06:57</b>, que ainda te deixa 1 h 38 de sobra.","aviso":"⚠️ <b>Os horários publicados não batem entre si.</b> O bustimes.org lista Heuston às 03:35 / 04:05 / 04:35 / 05:05 / 05:35 / 06:05; o PDF do próprio dublinexpress.ie lista 03:28 / 03:58 / 04:28 / 04:58 / 05:28 / 06:02 — provavelmente a coluna do George's Quay, uma parada antes. <b>Confira no app na noite anterior</b> e, na dúvida, esteja no ponto às 05:20."},{"titulo":"Táxi só até Heuston, e o 782 igual","custo":"~€22","classe":"ok","texto":"Se não quiser andar meia hora no escuro com a mala: <b>agende um FreeNow na véspera para 05:05 na porta</b>. São ~€10 a €13 até Heuston já com a tarifa noturna, e daí em diante é exatamente o plano de cima — 782 das 05:35, T1 às 06:21.","aviso":"⚠️ <b>Agende na véspera, pelo aplicativo.</b> Táxi chamado na hora, às cinco da manhã, em Inchicore, não é coisa garantida."},{"titulo":"Táxi porta a porta até o Terminal 1","custo":"€40–50","classe":"ok","texto":"A tarifa premium vale <b>das 20:00 às 08:00</b>: €5,40 de bandeirada, €1,81 por quilômetro e €3 de reserva, em cerca de 13 km. Saia às <b>05:45</b> e você desembarca no terminal por volta das 06:15 — dorme uma hora a mais e não pensa em mais nada.","aviso":"É o dobro do preço e o que ele compra é uma hora de sono. Ainda assim: <b>agende na véspera</b>."},{"titulo":"❌ O que NÃO fazer","custo":"—","classe":"neutro","texto":"<b>O Luas não vai ao aeroporto.</b> Nenhuma linha, nunca foi — e o primeiro bonde da linha vermelha só sai por volta das 06:05 de qualquer jeito. E o combo <b>G1/G2 até a cidade + ônibus 41 ou Aircoach</b> fecha no papel, mas a baldeação não tem horário publicado e sobram uns 20 minutos de folga no total. Não use.","aviso":"O ônibus 41 sozinho é ótimo <b>se você já estiver no centro</b>: roda 24 horas por €2 com Leap Card, sai do Irish Life na Abbey Street Lower às 05:00 e chega 05:32. Mas você vai estar em Inchicore."},{"titulo":"E antes disso: a volta do aeroporto, quarta à noite","custo":"€10","classe":"neutro","texto":"Você pousa de Porto às <b>20:20 de quarta</b>, sem pressa nenhuma. <b>Dublin Express 782 do aeroporto até Heuston, €10</b> (o último sai 00:35), e de Heuston a <b>Luas vermelha para Goldenbridge</b>, duas paradas, último bonde por volta de 00:30, mais 9 minutos a pé. Em casa por volta das <b>22:15</b>. Se preferir não pensar: o <b>G1/G2 roda 24 horas</b> e para em Inchicore Village.","aviso":"⚠️ <b>Confirme com antecedência que a cama de Tyrconnell Road está disponível nessa noite.</b> Se cair, o plano volta a ser albergue no centro (~€22, com cancelamento grátis) mais o 782 da manhã."}],"richie":[{"titulo":"Galway antes de Cork","texto":"“Go Galway… then down to Cork.” O desenho está certo — e ele acrescentou Inishbofin, “my favourite place in the country”."},{"titulo":"Feira de Ballinasloe","texto":"“Grand.” Dia a proteger: <b>domingo</b>. Segurança: “nobody will bother him”. E a regra de ouro: <b>“Don't say travellers!”</b>"},{"titulo":"Noites de Cork","texto":"An Spailpín Fánach. Jantar: “Goldies”. Do festival inteiro, uma coisa só: <b>o Céilí Mór, €10</b>."},{"titulo":"Levar um amigo de fora","texto":"<b>Os galgos</b> — e <b>Ballybrit numa terça</b>. Os dois já estavam no plano."},{"titulo":"Mart de Skibbereen","texto":"“No. Leave the men to it.” Saiu do plano principal; sobrevive só como dia de chuva."},{"titulo":"Dia de carro","texto":"Connemara — mas com Inishbofin no meio. E um dia duro de montanha: <b>“Dublin mountains is good.”</b>"},{"titulo":"Uma noite em West Cork","texto":"<b>Castletownbere</b> — “some of the best crab/shellfish in the country”. Virou o almoço da sexta 9."},{"titulo":"Quanto você vai se queimar","texto":"“He'll buy a round out of turn. He'll survive.” Pints devidos ao Richie pelo questionário: <b>5</b>."},{"titulo":"O fim de semana final, em 18/09","texto":"Churrasco na casa dos pais do Richie <b>fixado no domingo 11</b>, e a final de hurling rebaixada a bônus: ela só acontece se cair no sábado 10, quando Thurles custa +11 minutos na estrada Cork → Dublin. Motivo: a ida-e-volta de domingo era puxada, o histórico diz que a final cai no domingo (seis de seis), e três das últimas seis foram para replay — plano nenhum deve ficar refém de uma data que ainda não existe."},{"titulo":"E a Priscila, em 13/09","texto":"Galway com eles sexta e sábado; Cliffs of Moher (“lindíssimo”); Inishbofin com pernoite (“ou gosta ou odeia”); o último fim de semana em Dublin com eles; e Kilmainham Gaol com o Richie. Sobre Ballinasloe: “unusual, não recomenda” — você decidiu ir mesmo assim, sozinho, no domingo."}],"eat":{"11/10":"O churrasco é a comida do dia — o que importa é o que você leva. <b>A carne compra-se no sábado</b> (domingo fecha tudo): açougue de Dublin, pedindo <b>picanha</b> / <b>rump cap</b> / <b>top sirloin cap</b>, com a capa de gordura inteira; ou encomendada na quinta no <b>English Market de Cork</b> (Tom Durcan, Coughlan's, O'Mahony) e trazida na geladeira de isopor, já que você está de carro. <b>Sal grosso e farinha de mandioca vêm do Brasil</b> — não existem lá no formato certo e pesam nada. ⚠️ <b>Carne e laticínio do Brasil não entram na UE.</b> Cerveja para a casa é obrigação. Se a final tomar o sábado, o almoço daquele dia é o <b>Hayes Hotel, Liberty Square, Thurles</b> (0504 22122), que em dia de jogo serve do meio-dia às 21:30.","02/10":"Chegando a Galway: ⭐ <b>GBC — Galway Bakery Company, 7 Williamsgate Street</b>, aberta desde <b>1936</b>, seg–sáb 08:00–16:30 e domingo 09:00–16:30 (091 563 087). É a última casa de comer velha, simples e sem modinha do centro. ⚠️ <b>O café do andar de cima do McCambridge's fechou</b>: sobrou o deli. Comida em pub: <b>Tigh Neachtain, 17 Cross Street, 11:00–16:00 todos os dias</b>. ⚠️ <b>O Tigh Cóilí e o Crane Bar não servem comida nenhuma.</b> Mas hoje quem escolhe são eles.","03/10":"⭐ <b>Galway Market</b>, Church Lane, sábado 08:00–18:00, quase tudo abaixo de €10: <b>The Oyster Man</b> abre ostra na hora, <b>Gannet Fishmongers</b>, <b>Coolfin Organic Bakery</b>. A ostra nativa está no auge em outubro: <b>McSwiggans, 3 Eyre Street, €19,50 a meia dúzia</b>. Barato: <b>Handsome Burger</b> (49 Dominick St Lower, €10,50) e <b>Xian Street Food</b> (7 Quay St, spice bag €8,75). Compre hoje o farnel de segunda: na ilha só há o Day's Bar.","04/10":"⚠️ <b>Domingo mata os cafés de Ballinasloe — o Bread Basket e o Kariba's fecham os dois.</b> Sobram dois endereços: ⭐ <b>Gibbons' Pillar House, 8 Society Street</b> — a rua do Fair Green — <b>comida das 09:00 às 21:00, sete dias</b> (090 964 3939); e o <b>Gullane's Hotel, Main Street</b>, <b>carvery 12:00–16:30, sem reserva</b> (090 964 2220). Na feira em si: peixe com batata e sonho açucarado frito na hora. ⚠️ O Hayden's Hotel fechou. Ninguém em Ballinasloe publica preço.","06/10":"Café da manhã no B&B da ilha, e a balsa das 09:00. Em Galway, antes de Ballybrit: <b>GBC, Williamsgate Street</b> (08:00–16:30) ou <b>Tigh Neachtain</b> (11:00–16:00) — dentro do hipódromo é bancada cara e fila. Depois da corrida, <b>o Crane Bar não serve comida</b>: jante antes no <b>Dela</b> (51 Dominick St Lower) ou no <b>Rúibín</b> (1 Dock Road, seg–sáb 12:00–23:00).","08/10":"Almoço dentro do English Market: ⭐ <b>Farmgate Café</b>, no mezanino — <b>a última porta do país que serve tripe and drisheen</b> (ter–sex 09:00–15:30; 021 427 8134). Para levar: <b>A. O'Reilly's</b>, o último fabricante de drisheen da Irlanda, €2 a porção. Jantar: <b>Goldie</b>, reservado. Antes do Sin É, se sobrar fome: ⭐ <b>The Long Valley, 10 Winthrop Street</b> (todo dia 10:00–00:30), o doorstep sandwich de spiced beef."},"phones":[{"n":"Balsa de Inishbofin","tel":"095 37228","obs":"seg–sex 10:00–18:00 · SMS 087 180 0586 · inishbofinferry.ie","tag":"west"},{"n":"Balsa de Inishbofin (SMS)","tel":"087 180 0586","obs":"mensagem de texto","tag":"west","sms":true},{"n":"Day's Bar B&B (The Beach), Inishbofin","tel":"+353 95 45829","obs":"4 quartos · info@thebeach.ie","tag":"west"},{"n":"Lapwing House B&B, Inishbofin","tel":"+353 95 45996","obs":"aberto o ano todo","tag":"west"},{"n":"Inishbofin Island Hostel","tel":"+353 95 45855","obs":"privado €70 · dormitório €25","tag":"west"},{"n":"Galway Greyhound Stadium","tel":"061 448080","obs":"galgos sexta 02/10, portões 18:30","tag":"west"},{"n":"GBC — Galway Bakery Company","tel":"091 563 087","obs":"7 Williamsgate St · seg–sáb 08:00–16:30","tag":"west"},{"n":"Gibbons' Pillar House, Ballinasloe","tel":"090 964 3939","obs":"8 Society St · comida 09:00–21:00","tag":"west"},{"n":"Gullane's Hotel, Ballinasloe","tel":"090 964 2220","obs":"carvery 12:00–16:30","tag":"west"},{"n":"Gus O'Connor's, Doolin","tel":"065 707 4168","obs":"Fisher St","tag":"west"},{"n":"McGann's, Doolin","tel":"065 707 4133","obs":"Roadford","tag":"west"},{"n":"Goldie, Cork","tel":"021 239 8720","obs":"128 Oliver Plunkett St · qua–sáb · 28 lugares","tag":"cork"},{"n":"Farmgate Café (English Market)","tel":"021 427 8134","obs":"ter–sex 09:00–15:30","tag":"cork"},{"n":"Breen's Lobster Bar, Castletownbere","tel":"027 70031","obs":"The Square · sex 12–17 e 17:30–21:30","tag":"cork"},{"n":"MacCarthy's Bar, Castletownbere","tel":"027 70014","obs":"The Square · seg–sáb 09:30–23:30","tag":"cork"},{"n":"Hayes Hotel, Thurles","tel":"0504 22122","obs":"Liberty Square · só se a final cair no sábado 10","tag":"cork"},{"n":"14 Henrietta Street","tel":"01 524 0383","obs":"€12 · qua–dom, de hora em hora 10–16 · 14henriettastreet.ticketsolve.com","tag":"dublin"},{"n":"Richmond Barracks","tel":"01 524 2532","obs":"entrada livre seg–sáb 10–17 · café \"The Mess\"?","tag":"dublin"},{"n":"Phoenix Park / Magazine Fort (OPW)","tel":"01 677 0095","obs":"perguntar duração da visita e vagas","tag":"dublin"},{"n":"The Patriot's Inn","tel":"01 679 9595","obs":"760 South Circular Rd · coddle no cardápio?","tag":"dublin"},{"n":"Loaf Café, Kilmainham Square","tel":"01 516 8294","obs":"todo dia 08:00–16:00","tag":"dublin"},{"n":"Phoenix Park Tea Rooms","tel":"01 671 9376","obs":"Chesterfield Ave · abre 09:30","tag":"dublin"},{"n":"Phoenix Park Café (Ashtown)","tel":"01 255 4445","obs":"abre 09:30","tag": do churrasco HOJE","b":"Domingo fecha tudo. Picanha / \"rump cap\" / \"top sirloin cap\", capa de gordura inteira. Cerveja para a casa.","dur":40},{"id":"r-ck1","d":"2026-10-11","t":"20:00","ti":"Check-in Ryanair FR7072 (amanhã 19:35)","b":"Fazer no app da Ryanair. Reserva D2T4SZ. Check-in no balcão custa €55.","dur":10},{"id":"r-dev","d":"2026-10-12","t":"14:30","ti":"Sair para devolver o carro (15:30, Eastlands, aeroporto)","b":"Tanque cheio. M50 €3,80. Shuttle grátis até o T1. Portão da Ryanair fecha 19:05.","dur":60},{"id":"r-ck2","d":"2026-10-13","t":"18:30","ti":"Check-in Ryanair FR7079 (amanhã 17:55)","b":"Reserva D2T4SZ.","dur":10},{"id":"r-782","d":"2026-10-14","t":"22:00","ti":"Conferir o horário do 782 de amanhã e pôr o despertador 04:30","b":"Dublin Express 782 Heuston 05:35 → T1 06:21 (€10, app). Check-in AF fecha 08:35. Sair a pé 04:50.","url":"https://www.dublinexpress.ie","dur":10},{"id":"r-ckaf","d":"2026-10-14","t":"09:15","ti":"Check-in Air France AF1617 (amanhã 09:15)","b":"Reserva Y4WCIU. Abre 24h antes; fecha 08:35 do dia 15.","dur":10}],"claude":{"brief":"## 1. Quem é o Lucas e as regras que ele deu\n\n**Lucas Almeida Cabral**, 36, brasileiro, mora em Goiás, viaja **sozinho**, inglês fluente. Interesses declarados: natureza, tecnologia, história, cerveja e principalmente gastronomia. Em forma, topa esforço físico. Tem uma amiga irlandesa em Dublin, a **Priscila**, e o namorado dela, o **Richie**, irlandês, que revisaram o plano inteiro.\n\nEstas frases dele são as regras do projeto. Qualquer app tem de respeitá-las:\n\n- *\"Se tem uma coisa que eu gosto é de cabaré e bagaceira, eu sou uma pessoa que gosta do simples, gosto duvidoso.\"* Banheiro de esgoto não incomoda. Bingo foi \"sensacional\". Quer **conhecer gente de verdade em lugares autênticos, estudando muito como respeitá-los**.\n- **A regra do Cristo Redentor** (a correção mais importante, dada em ~17/09): *\"não tenho alergia a turista, só que o que valha a pena, se algo for imperdíve
