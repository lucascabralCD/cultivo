button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
::selection{background:color-mix(in srgb,var(--acc) 35%,transparent)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px}

/* ---------- mono label utility ---------- */
.k{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.k.acc{color:var(--acc)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--rule2);
  padding-top:env(safe-area-inset-top,0px)}
.htop{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.01em;flex:1;min-width:0}
.brand .logo{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#1E6B4A,#0F3D2E);display:grid;place-items:center;font-size:13px;flex:none}
.brand i{font-style:normal;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstat{display:flex;align-items:center;gap:6px}
.dotst{width:7px;height:7px;border-radius:50%;background:var(--done);box-shadow:0 0 0 3px color-mix(in srgb,var(--done) 20%,transparent)}
.dotst.off{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 20%,transparent)}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink2);flex:none;background:var(--surf)}
.iconbtn:active{transform:scale(.96)}
.iconbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.lang{width:auto;padding:0 10px;font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--acc)}
.tab span{font:inherit}

/* ---------- day rail ---------- */
.rail{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 16px 10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.pill{flex:none;scroll-snap-align:center;min-width:50px;padding:7px 8px 6px;border-radius:11px;
  border:1px solid var(--rule);background:var(--surf);text-align:center;line-height:1.1;position:relative}
.pill em{display:block;font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal}
.pill s{display:block;font-weight:700;font-size:16px;text-decoration:none;margin-top:3px;font-variant-numeric:tabular-nums}
.pill i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:var(--rg)}
.pill[aria-current="true"]{background:var(--rg);border-color:var(--rg);color:#0A0E0C}
.pill[aria-current="true"] em,.pill[aria-current="true"] s{color:#0A0E0C}
.pill[aria-current="true"] i{background:rgba(0,0,0,.45)}
.pill.today::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--done)}
.pill.done s{color:var(--done)}

/* ---------- hero (hoje) ---------- */
.hero{position:relative;padding:20px 0 16px;border-bottom:1px solid var(--rule2);overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40px -16px auto -16px;height:220px;pointer-events:none;
  background:radial-gradient(60% 80% at 20% 0%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%)}
.hero>*{position:relative}
.kick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.kick .acc{color:var(--acc)}
.hero h1{margin:0;font-size:clamp(23px,6vw,30px);line-height:1.12;letter-spacing:-.03em;font-weight:800;text-wrap:balance}
.lead{margin:10px 0 0;color:var(--ink2);font-size:14.5px;line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--rule);color:var(--ink2);background:var(--surf)}
.chip.acc{border-color:color-mix(in srgb,var(--acc) 60%,transparent);color:var(--acc)}
.chip.ok{border-color:color-mix(in srgb,var(--done) 60%,transparent);color:var(--done)}
.prog{margin-top:14px;display:flex;align-items:center;gap:10px}
.prog .bar{flex:1;height:5px;border-radius:3px;background:var(--surf3);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--done));border-radius:3px;transition:width .4s ease}
.prog span{font:500 11px/1 var(--mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.daynote{margin-top:14px;padding:11px 13px;border-radius:12px;font-size:13.4px;line-height:1.5;color:var(--ink2);
  background:color-mix(in srgb,var(--warn) 10%,var(--surf));border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.daynote b{color:var(--ink)}

/* ---------- sections ---------- */
.sec{padding-block:18px 4px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sech h2{margin:0;font-size:12px;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sech .k{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.sech button{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}

/* ---------- now card ---------- */
.now{position:relative;border-radius:16px;padding:16px 16px 14px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 18%,var(--surf)),var(--surf) 60%);
  border:1px solid color-mix(in srgb,var(--acc) 45%,var(--rule));box-shadow:var(--shadow);overflow:hidden}
.now .k{color:var(--acc)}
.now .t{font:600 30px/1 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:8px}
.now .t small{font-size:13px;letter-spacing:.02em;color:var(--muted);margin-left:8px;font-weight:500}
.now h3{margin:8px 0 0;font-size:19px;line-height:1.2;letter-spacing:-.02em;font-weight:700}
.now p{margin:6px 0 0;color:var(--ink2);font-size:13.6px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.now .cd{position:absolute;top:14px;right:14px;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);
  padding:6px 9px;border-radius:999px;background:color-mix(in srgb,var(--ground) 55%,transparent);border:1px solid var(--rule)}
.now .cd.live{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:12px;
  border:1px solid var(--rule);background:var(--surf2);color:var(--ink);font-weight:600;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap;flex:1 1 auto}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#0A0E0C}
.btn.ok{background:color-mix(in srgb,var(--done) 18%,var(--surf2));border-color:color-mix(in srgb,var(--done) 50%,transparent);color:var(--done)}
.btn.no{background:color-mix(in srgb,var(--miss) 14%,var(--surf2));border-color:color-mix(in srgb,var(--miss) 45%,transparent);color:var(--miss)}
.btn.cl{background:color-mix(in srgb,var(--claude) 14%,var(--surf2));border-color:color-mix(in srgb,var(--claude) 45%,transparent);color:var(--claude)}
.btn.sm{min-height:34px;padding:0 11px;font-size:12.5px;border-radius:10px;flex:0 0 auto}
.btn.ghost{background:transparent}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.icon{flex:0 0 auto;width:42px;padding:0}

/* ---------- checklist items ---------- */
.list{display:grid;gap:8px}
.item{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;padding:12px 13px 12px 12px;border-radius:14px;
  background:var(--surf);border:1px solid var(--rule);box-shadow:var(--shadow);transition:opacity .2s ease}
.item.cur{border-color:color-mix(in srgb,var(--acc) 55%,var(--rule))}
.item .ck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;margin-top:2px;color:transparent;flex:none;background:var(--surf2)}
.item .ck svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.item.done .ck{background:var(--done);border-color:var(--done);color:#0A0E0C}
.item.miss .ck{border-color:var(--miss);color:var(--miss)}
.item.later .ck{border-color:var(--later);color:var(--later)}
.item.skip .ck{border-style:dashed;color:var(--muted)}
.item.info .ck{border-color:transparent;background:transparent;color:var(--muted)}
.item .bd{min-width:0}
.item .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.item .hh{font:600 13px/1.2 var(--mono);font-variant-numeric:tabular-nums;color:var(--acc);letter-spacing:-.01em}
.item .lb{font:500 10px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.item .st{font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:999px;border:1px solid currentColor}
.item .st.d{color:var(--done)} .item .st.m{color:var(--miss)} .item .st.l{color:var(--later)} .item .st.s{color:var(--muted)} .item .st.x{color:var(--claude)} .item .st.mv{color:var(--warn)}
.item h4{margin:3px 0 0;font-size:15.5px;line-height:1.3;letter-spacing:-.015em;font-weight:700}
.item .sub{margin-top:3px;color:var(--muted);font-size:12.5px;line-height:1.4}
.item .txt{margin-top:8px;color:var(--ink2);font-size:13.8px;line-height:1.55}
.item .txt.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item.done h4,.item.skip h4{color:var(--muted)}
.item.done .txt,.item.skip .txt{color:var(--muted)}
.item.skip h4{text-decoration:line-through}
.item.skip{opacity:.65}
.item.info{background:transparent;box-shadow:none;border-style:dashed;padding-block:10px}
.item.info h4{font-size:14px;font-weight:600}
.item[data-c="warn"] .lb,.item[data-c="warn"] .hh{color:var(--warn)}
.item[data-c="gone"] .lb,.item[data-c="gone"] .hh{color:var(--gone)}
.item[data-c="eat"] .hh,.item[data-c="eat"] .lb{color:var(--done)}
.item .mynote{margin-top:8px;padding:8px 10px;border-radius:9px;background:var(--surf2);border-left:2px solid var(--acc);font-size:13.2px;line-height:1.5;color:var(--ink2);white-space:pre-wrap}
.item .mynote em{display:block;font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-style:normal;margin-bottom:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.act{font:500 11px/1 var(--mono);letter-spacing:.03em;padding:8px 11px;border-radius:9px;border:1px solid var(--rule);color:var(--ink2);white-space:nowrap;background:var(--surf2);min-height:32px}
.act.on{background:var(--acc);border-color:var(--acc);color:#0A0E0C}
.act.ok{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.act.no{color:var(--miss);border-color:color-mix(in srgb,var(--miss) 45%,transparent)}
.act.cl{color:var(--claude);border-color:color-mix(in srgb,var(--claude) 45%,transparent)}
.act.warnb{color:var(--gone)}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
textarea.ta,input.in,select.in{width:100%;min-height:44px;padding:10px 12px;border-radius:11px;border:1px solid var(--rule);background:var(--surf2);color:var(--ink);font:14px/1.5 var(--sans);resize:vertical}
textarea.ta{min-height:70px}
input.in.hm{max-width:110px;font-family:var(--mono);font-size:14px;text-align:center}
select.in{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.empty{padding:22px 14px;border-radius:14px;border:1px dashed var(--rule);color:var(--muted);text-align:center;font-size:13.5px;line-height:1.5}

/* ---------- misc cards ---------- */
.card{border-radius:14px;padding:13px 14px;background:var(--surf);border:1px solid var(--rule);box-shadow:var(--shadow)}
.card+.card{margin-top:8px}
.card h4{margin:0 0 6px;font-size:14.6px;letter-spacing:-.012em;line-height:1.3}
.card p{margin:0;font-size:13.4px;line-height:1.55;color:var(--ink2)}
.card p+p{margin-top:6px}
.card ul{margin:6px 0 0;padding-left:18px}
.card li{font-size:13.4px;line-height:1.55;color:var(--ink2);margin-bottom:5px}
.card.acc{border-color:color-mix(in srgb,var(--acc) 45%,var(--rule))}
.card.w{border-color:color-mix(in srgb,var(--warn) 45%,var(--rule));background:color-mix(in srgb,var(--warn) 6%,var(--surf))}
.card.g{border-color:color-mix(in srgb,var(--done) 45%,var(--rule))}
.card.cl{border-color:color-mix(in srgb,var(--claude) 45%,var(--rule));background:color-mix(in srgb,var(--claude) 6%,var(--surf))}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{display:grid;gap:6px;padding:14px 13px;border-radius:14px;background:var(--surf);border:1px solid var(--rule);text-align:left;box-shadow:var(--shadow);min-height:86px;align-content:start}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:20px;line-height:1}
.tile b{font-size:14px;letter-spacing:-.012em}
.tile span{font-size:12px;color:var(--muted);line-height:1.35}
.tile.wide{grid-column:1/-1}
.lrow{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 13px;border-radius:13px;background:var(--surf);border:1px solid var(--rule);border-left:3px solid var(--rg);box-shadow:var(--shadow)}
.lrow .ld{font:500 11px/1.2 var(--mono);color:var(--muted)}
.lrow .ld b{display:block;font-size:17px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.lrow .lt{min-width:0;font-size:14px;line-height:1.35;font-weight:600;letter-spacing:-.012em}
.lrow .lt span{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--mono);letter-spacing:.03em}
.lrow .lc{font:500 10.5px/1.3 var(--mono);color:var(--muted);text-align:right}
.lrow .lc b{display:block;color:var(--done);font-weight:500}
.lrow.is{border-color:var(--rg)}
.lsep{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}
.list .lsep:first-child{margin-top:2px}
.pi{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:13px 14px;border-radius:13px;background:var(--surf);border:1px solid var(--rule);box-shadow:var(--shadow);text-align:left;width:100%}
.pi .box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:12px;color:transparent;margin-top:1px;flex:none}
.pi.ck .box{background:var(--done);border-color:var(--done);color:#0A0E0C}
.pi.ck .pt,.pi.ck .pb{color:var(--muted)}
.pi.ck .pt{text-decoration:line-through}
.pw{font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;display:block}
.pw.r{color:var(--gone)} .pw.o{color:var(--warn)} .pw.y{color:var(--acc)} .pw.g{color:var(--done)} .pw.w{color:var(--muted)}
.pt{font-weight:700;font-size:14.6px;letter-spacing:-.014em;line-height:1.3}
.pb{font-size:13.3px;line-height:1.55;color:var(--ink2);margin-top:6px}
.pnote{font-size:13px;line-height:1.55;color:var(--muted);padding:12px 14px;border-radius:12px;background:var(--surf2);border:1px solid var(--rule2);margin-bottom:8px}
.pnote b{color:var(--ink)}
.phone{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 13px;border-radius:13px;background:var(--surf);border:1px solid var(--rule)}
.phone b{display:block;font-size:14px;letter-spacing:-.012em}
.phone span{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.phone a.tel{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 13px;border-radius:11px;border:1px solid color-mix(in srgb,var(--done) 45%,transparent);color:var(--done);font:600 13px/1 var(--mono);white-space:nowrap;background:color-mix(in srgb,var(--done) 10%,transparent)}
.phone a.tel svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sub-h{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.sub-h h2{margin:0;font-size:20px;letter-spacing:-.025em;font-weight:800;flex:1}
.back{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);min-height:34px;padding:0 10px 0 4px;border-radius:9px;border:1px solid transparent}
.back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mapwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:14px;background:var(--water);line-height:0;-webkit-overflow-scrolling:touch}
.mapwrap svg{width:100%;min-width:560px;height:auto;display:block}
.map .r-bus{stroke:var(--s2)} .map .r-bus2{stroke:var(--s1)} .map .r-rail{stroke:var(--s4)} .map .r-car{stroke:var(--s3)} .map .r-opt{stroke:var(--muted)} .map .r-air{stroke:var(--ink2)} .map .r-sea{stroke:var(--s2)}
.map .pt{fill:var(--ink)} .map .pt.mid{fill:var(--ink2)} .map .pt.ctx{fill:var(--muted)}
.map .starpt{fill:var(--s3);stroke:var(--paper);stroke-width:1.6}
.map .lbl{font-family:var(--sans);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.4;stroke-linejoin:round}
.map .lbl.mid{font-weight:600;fill:var(--ink2)} .map .lbl.ctx{font-weight:500;fill:var(--muted)}
.map .lbl.star{fill:var(--s3);font-weight:800;letter-spacing:.04em} .map .lbl.air{fill:var(--ink2);font-weight:700}
.map .pill rect{fill:var(--paper);stroke:var(--coast);stroke-width:1} .map .pill text{font-family:var(--sans);font-weight:700;fill:var(--ink2)}
.mleg{display:grid;gap:6px 14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px;font-size:12.5px;color:var(--ink2)}
.mleg div{display:flex;gap:8px;align-items:center}
.mleg i{flex:none;width:22px;height:4px;border-radius:2px}
.field{display:grid;gap:6px;margin-top:12px}
.field label{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--surf2);border:1px solid var(--rule)}
.seg button{flex:1;min-height:36px;border-radius:9px;font:500 12px/1 var(--mono);letter-spacing:.03em;color:var(--ink2)}
.seg button.on{background:var(--acc);color:#0A0E0C;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 13px;border-radius:13px;background:var(--surf);border:1px solid var(--rule)}
.toggle b{font-size:14px;display:block}
.toggle span{font-size:12px;color:var(--muted);display:block;margin-top:2px;line-height:1.4}
.sw{width:46px;height:28px;border-radius:14px;background:var(--surf3);border:1px solid var(--rule);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw.on{background:color-mix(in srgb,var(--done) 35%,var(--surf3));border-color:var(--done)}
.sw.on::after{transform:translateX(18px);background:var(--done)}

/* ---------- chat ---------- */
.chat{display:grid;gap:12px;padding-block:14px 8px}
.msg{max-width:92%;padding:11px 14px;border-radius:16px;font-size:14.4px;line-height:1.55;white-space:normal;overflow-wrap:anywhere}
.msg.u{justify-self:end;background:color-mix(in srgb,var(--acc) 22%,var(--surf2));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.a{justify-self:start;background:var(--surf);border:1px solid var(--rule);border-bottom-left-radius:5px;max-width:100%}
.msg.a .who{font:500 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--claude);margin-bottom:6px;display:flex;gap:8px;align-items:center}
.msg.a .who i{font-style:normal;color:var(--muted);letter-spacing:.04em;text-transform:none}
.msg.a p{margin:0 0 8px} .msg.a p:last-child{margin-bottom:0}
.msg.a h1,.msg.a h2,.msg.a h3{font-size:15px;margin:10px 0 6px;letter-spacing:-.015em}
.msg.a ul,.msg.a ol{margin:4px 0 8px;padding-left:20px} .msg.a li{margin-bottom:4px}
.msg.a code{font-family:var(--mono);font-size:12.5px;background:var(--surf2);padding:1px 5px;border-radius:5px}
.msg.a pre{background:var(--surf2);padding:10px;border-radius:10px;overflow-x:auto;font-size:12px}
.msg.a hr{border:0;border-top:1px solid var(--rule);margin:10px 0}
.msg.a table{border-collapse:collapse;font-size:12.5px;margin:6px 0} .msg.a td,.msg.a th{border:1px solid var(--rule);padding:4px 7px;text-align:left}
.msg.err{border-color:color-mix(in srgb,var(--miss) 50%,transparent);color:var(--miss)}
.status{font:500 11px/1.4 var(--mono);letter-spacing:.04em;color:var(--muted);display:flex;gap:8px;align-items:center;padding:2px 4px}
.status .sp{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule);border-top-color:var(--claude);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sug{margin-top:10px;display:grid;gap:8px}
.sug .s{padding:11px 12px;border-radius:12px;background:color-mix(in srgb,var(--claude) 8%,var(--surf2));border:1px solid color-mix(in srgb,var(--claude) 35%,transparent)}
.sug .s b{display:block;font-size:14px;letter-spacing:-.012em}
.sug .s .m{font:500 11px/1 var(--mono);color:var(--claude);letter-spacing:.04em;margin-bottom:5px;display:block}
.sug .s p{margin:4px 0 0;font-size:13px;line-height:1.5;color:var(--ink2)}
.sug .s .row{margin-top:9px}
.composer{position:sticky;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 0 8px;background:linear-gradient(to top,var(--ground) 75%,transparent)}
.cbox{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;padding:8px 8px 8px 12px;border-radius:18px;background:var(--surf);border:1px solid var(--rule);box-shadow:var(--shadow)}
.cbox textarea{border:0;background:transparent;color:var(--ink);font:14.5px/1.45 var(--sans);resize:none;min-height:24px;max-height:140px;padding:6px 0;width:100%;outline:none}
.cbox .send{width:40px;height:40px;border-radius:13px;background:var(--claude);color:#0A0E0C;display:grid;place-items:center;flex:none}
.cbox .send:disabled{opacity:.4}
.cbox .send svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ctools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.ctools .act{min-height:30px;padding:6px 10px}
.quick{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:4px}
.quick::-webkit-scrollbar{display:none}
.quick .act{flex:none}
.ctxbar{display:flex;gap:8px;align-items:center;padding:9px 12px;border-radius:12px;background:color-mix(in srgb,var(--miss) 10%,var(--surf));border:1px solid color-mix(in srgb,var(--miss) 40%,transparent);font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.ctxbar b{color:var(--ink)} .ctxbar button{margin-left:auto;color:var(--muted);font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ---------- bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--ground) 90%,transparent);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);max-width:680px;margin:0 auto;height:var(--nav)}
.tab{display:grid;gap:4px;justify-items:center;align-content:center;font:500 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);position:relative}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--acc)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:2px;background:var(--acc)}
.tab .bdg{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--miss);color:#0A0E0C;font:600 9.5px/16px var(--mono);text-align:center}

/* ---------- bottom sheet ---------- */
.sheet{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet .bdp{position:absolute;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet .pnl{position:relative;width:100%;max-width:680px;max-height:calc(100dvh - 24px);overflow:auto;background:var(--surf);border:1px solid var(--rule);border-bottom:0;
  border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:4px auto 14px}
.sheet .shx{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:10px;border:1px solid var(--rule);background:var(--surf2);color:var(--muted);display:grid;place-items:center;z-index:2}
.sheet .shx svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.sheet h3{padding-right:40px}
.sheet h3{margin:0;font-size:19px;letter-spacing:-.02em;line-height:1.25}
.sheet .sub{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.45}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:13px 13px;border-radius:14px;background:var(--surf2);border:1px solid var(--rule)}
.opt:active{transform:scale(.99)}
.opt .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:var(--surf3)}
.opt b{display:block;font-size:14.6px;letter-spacing:-.012em}
.opt span{display:block;font-size:12.3px;color:var(--muted);margin-top:2px;line-height:1.4}
.opt .chev{color:var(--muted);font-size:18px}
.opt.cl .ic{background:color-mix(in srgb,var(--claude) 20%,var(--surf3))}
.opt.w .ic{background:color-mix(in srgb,var(--later) 20%,var(--surf3))}
.opt.g .ic{background:color-mix(in srgb,var(--done) 20%,var(--surf3))}
.opt.b .ic{background:color-mix(in srgb,var(--acc) 20%,var(--surf3))}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.reasons .act.on{background:var(--miss);border-color:var(--miss);color:#0A0E0C}
.alt{padding:12px 13px;border-radius:13px;background:var(--surf2);border:1px solid var(--rule);margin-top:8px}
.alt>b{display:block;font-size:14.4px;letter-spacing:-.012em}
.alt p b{display:inline;font-size:inherit}
.alt .src{font:500 10px/1.3 var(--mono);color:var(--muted);letter-spacing:.03em;margin-top:6px}
.alt p{margin:5px 0 0;font-size:13.2px;line-height:1.5;color:var(--ink2)}

/* ---------- toast / banner ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%) translateY(8px);z-index:90;
  padding:10px 14px;border-radius:12px;background:var(--surf3);border:1px solid var(--rule);color:var(--ink);font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 13px;border-radius:12px;background:color-mix(in srgb,var(--done) 12%,var(--surf));border:1px solid color-mix(in srgb,var(--done) 40%,transparent);font-size:13px;margin:10px 0 0}
.banner button{margin-left:auto;color:var(--done);font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
footer{padding:22px 0 12px;font-size:11.5px;line-height:1.55;color:var(--muted);text-align:center}
@media (max-width:440px){.hstat .k{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:720px){body{padding-bottom:calc(var(--nav) + 24px)}}
</style>
</head>

},{"id":"2026-09-25.1.tarde","h":"tarde","t":null,"c":"note","b":"Sem heroísmo no dia de fuso: Leap Card, compra de despensa, e o bairro a pé — Tyrconnell Road, Emmet Road, o canal em Suir Road. Se as pernas pedirem, os <b>Jardins do Memorial de Guerra</b> ficam a 20 minutos e fecham só ao anoitecer.","ti":"Leap Card, despensa e o bairro a pé","kind":"do","place":"Inchicore","maps":"Tyrconnell Road, Inchicore, Dublin 8","dur":120,"alts":[{"ti":"Richmond Barracks — entrada livre, 10 min a pé","b":"Se chover: o <b>prédio do Richmond Barracks é entrada livre, sem reserva, seg–sáb 10:00–17:00</b>, dez minutos a pé da cama. Exposição e jardim, sem ingresso nenhum. É o mesmo lugar do festival de amanhã, então hoje você só reconhece o terreno.","src":"days/2026-09-26.json, 'o que salva o dia'","t":"15:00"},{"ti":"Sirga do Grand Canal, Suir Road → Portobello","b":"O caminho de sirga do <b>Grand Canal</b>, subindo de Suir Road até Portobello e voltando — ~5 km plano, garça, eclusa e nenhuma atração. A caminhada de perna cansada, ideal para o dia de fuso.","src":"days/2026-09-29.json, 'se não quiser museu'","t":""},{"ti":"Tour grátis dos terrenos do Royal Hospital, 15:00","b":"<b>Tour grátis dos terrenos do Royal Hospital Kilmainham</b>, guia no local todo dia às 11:00, 13:00 e 15:00, sem reserva. Emenda com <b>Bully's Acre</b>, o cemitério de pobre e de cólera fechado em 1832, entrada pela avenida oeste. Grátis e a ~10 minutos a pé.","src":"days/2026-09-28.json, evento 11:00; docs/adendo-dublin-porto-ultima-noite.md, plano C de quinta; docs/dossie-pesquisa-irlanda-porto.md (IMMA ~10 min)","t":"15:00"}]},{"id":"2026-09-25.2.onde-comer","h":"onde comer","t":null,"c":"eat","b":"<b>Greenville Deli, 5A Tyrconnell Road</b>, a 200 metros da porta — seg–sáb 08:00–16:00, domingo 09:00–15:00. É deli moderno, não é a caçarola que você queria, mas é o que abre no seu quarteirão. À noite, a cozinha do <b>Black Lion, 207A Emmet Road</b> — pub documentado desde 1734, o mais antigo de Inchicore — serve seg–sex 15:00–21:00, dois pratos por €17.","ti":"Comer: Greenville Deli · jantar no Black Lion","kind":"do","place":"Greenville Deli","maps":"Greenville Deli, 5A Tyrconnell Road, Inchicore, Dublin 8","dur":60,"alts":[{"ti":"Loaf Café, Kilmainham Square (08:00–16:00)","b":"<b>Loaf Café, Kilmainham Square, Unit 2, Inchicore Road</b> — todo dia 08:00–16:00, empresa social, prato quente e sanduíche a preço de bairro, em frente à Kilmainham Gaol (01 516 8294). Mesmo horário do Greenville: serve se você estiver do lado de Kilmainham na hora do almoço.","src":"days/2026-09-29.json 'onde comer'; docs/adendo-dublin-porto-ultima-noite.md, tabela Inchicore","t":""},{"ti":"Breakfast roll do Centra/Spar da Emmet Road","b":"A resposta honesta para a caçarola de operário: o <b>breakfast roll do balcão quente do Centra ou do Spar da Emmet Road</b>, uns €4 (nenhuma dessas lojas publica horário). É o que o trabalhador daqui come, e você passa na porta comprando a despensa.","src":"days/2026-09-29.json 'onde comer'; extra_DOUBTS.json 'O café da manhã tradicional de Dublin'","t":""},{"ti":"Jantar: The Patriot's Inn, South Circular Rd","b":"Se a cozinha do Black Lion não estiver servindo: <b>The Patriot's Inn, 760 South Circular Road</b>, cozinha 12:00–21:30, prato sentado ao lado do Royal Hospital. O coddle NÃO está no cardápio atual — ligue 01 679 9595 antes se for por ele.","src":"days/2026-09-28.json 'onde comer'; extra_DOUBTS.json 'Coddle no Patriot's Inn'","t":"19:00"}]},{"id":"2026-09-25.3.noite","h":"noite","t":null,"c":"note","b":"<b>Slatt's, 126A Tyrconnell Park</b> — a uns 150 metros da sua porta. Pub de conjunto habitacional, bar e lounge com entradas separadas que não se comunicam, <b>sem televisão</b>, Guinness €5,40.","ti":"Slatt's — o primeiro pub","kind":"do","place":"Slatt's","maps":"Slatt's, 126A Tyrconnell Park, Inchicore, Dublin","dur":90,"alts":[{"ti":"Old Royal Oak, Kilmainham Lane","b":"<b>Old Royal Oak, 11 Kilmainham Lane</b> — uma sala só, snug de verdade com passa-copos, aquecedor a gás dos anos 70, na mesma família desde 1837. Praticamente só bebida; é programa de noite.","src":"days/2026-09-26.json 'noite'; docs/adendo-dublin-porto-ultima-noite.md, tabela Inchicore","t":""},{"ti":"Black Lion, Emmet Road — o pub de 1734","b":"<b>The Black Lion, 207A Emmet Road</b> — pub documentado desde 1734, o mais antigo de Inchicore, com cozinha seg–sex 15:00–21:00 (dois pratos por €17). Resolve jantar e pinta no mesmo balcão se o Slatt's estiver fechado ou lotado.","src":"days/2026-09-25.json 'onde comer'; docs/adendo-dublin-porto-ultima-noite.md, tabela Inchicore","t":""}]},{"id":"2026-09-25.4.rodape","h":"rodapé","t":null,"c":"note","b":"Nesse fim de semana existe o <b>Féile Frank Harte</b> no Teachers' Club (canto tradicional sem instrumento, €25 o concerto avulso). Você já disse que esse formato não é a sua praia — fica aqui só como rodapé.","ti":"Féile Frank Harte — só rodapé","kind":"info","place":"","maps":"","dur":0,"alts":[]}]},{"d":"2026-09-26","wd":"SÁB","dt":"26/09","ti":"Festival de História — no seu quarteirão","base":"Dublin","rg":"dublin","tags":["com a Priscila","grátis"],"note":"","lead":"Sábado de história no quarteirão: Richmond Barracks de manhã, Bohemians às 15:00 e o snug do Old Royal Oak. Cedo: amanhã são 25 km.","etq":[1,7],"ev":[{"id":"2026-09-26.0.o-dia","h":"★ o dia","t":null,"c":"star","b":"<b>Dublin Festival of History, 26/09 a 11/10, com o fim de semana de abertura no Richmond Barracks, em Inchicore</b> — dez minutos a pé da sua cama, tudo grátis. ⚠️ <b>Em 17/09 já havia 13 dos 34 eventos do fim de semana esgotados</b>, e dos quatro do Richmond Barracks <b>três estão lotados</b>: sobrou uma oficina de escrita às 15:00 (18+, 15 lugares) — que bate de frente com o Bohemians. <b>Os eventos são grátis mas exigem reserva; não há entrada de última hora.</b> Veja o que sobrou em dublinfestivalofhistory.ie/events.","ti":"Festival de História: 3 de 4 esgotados","kind":"info","place":"Richmond Barracks","maps":"Richmond Barracks, Inchicore, Dublin 8","dur":0,"alts":[]},{"id":"2026-09-26.1.o-que-salva-o-dia","h":"o que salva o dia","t":null,"c":"note","b":"O <b>prédio do Richmond Barracks é entrada livre, sem reserva, seg–sáb 10:00–17:00</b>. Você vê a exposição e o jardim de manhã, sem ingresso nenhum, e o festival passa a ser bônus.","ti":"Richmond Barracks: exposição e jardim, grátis","kind":"do","place":"Richmond Barracks","maps":"Richmond Barracks, Inchicore, Dublin 8","dur":90,"alts":[{"ti":"Jardins do Memorial de Guerra, Islandbridge","b":"Jardins de Lutyens em <b>Islandbridge</b>, grátis, quase sempre vazios; no fim de semana abrem às <b>10:00</b>. ~20 min a pé da cama. Fecham só ao anoitecer — serve para qualquer buraco da manhã.","src":"days/2026-09-25.json tarde; docs/adendo-dublin-porto-ultima-noite.md §2 (ter 29/09)","t":"10:00"},{"ti":"Tour grátis do Royal Hospital Kilmainham","b":"Guia no local <b>todo dia às 11:00, 13:00 e 15:00</b>, sem reserva, até novembro. Emenda com <b>Bully's Acre</b>, o cemitério de pobre e de cólera fechado em 1832, entrada pela avenida oeste. A ~10 min de casa; história do mesmo quarteirão, sem ingresso.","src":"days/2026-09-28.json 11:00; docs/adendo-dublin-porto-ultima-noite.md plano C de 01/10","t":"11:00"},{"ti":"Collins Barracks — Museu Nacional","b":"<b>Artes Decorativas e História, Collins Barracks</b> — grátis, sem reserva, <b>ter–sáb 10:00–17:00</b>, parada Museum do Luas. Militar, industrial, social; o único grande museu de Dublin que nunca esgota. Plano de chuva.","src":"days/2026-09-28.json 13:00; docs/adendo-dublin-porto-ultima-noite.md §2 (ter 29/09)","t":"10:00"}]},{"id":"2026-09-26.2.15-00","h":"15:00","t":"15:00","c":"time","b":"<b>Bohemians × Bohemians Praha 1905</b> no Dalymount Park, Phibsborough. Portões 13:00. <b>€20 adulto, €15 estudante/idoso.</b> Assento não numerado e a arquibancada Des Kelly mistura sentado e em pé — chegue cedo se quiser a geral. É um amistoso histórico entre os dois Bohemians.","ti":"Bohemians × Bohemians Praha — Dalymount","kind":"do","place":"Dalymount Park","maps":"Dalymount Park, Phibsborough, Dublin","dur":150,"alts":[{"ti":"Galgos em Shelbourne Park, €10","b":"<b>Shelbourne Park</b>, Dublin, corre <b>terça, sexta e sábado</b>, €10 na porta. É a bagaceira de sábado à noite se o futebol cair; galgo divide a Irlanda — não é papo leve no pub.","src":"docs/revisao-regioes-v7-bagaceira.md §12 Bingo e galgos","t":""},{"ti":"Rascals Brewing, na sua rua","b":"Taproom + pizzaria em <b>Goldenbridge Estate, Tyrconnell Road</b> — a mesma rua da cama. Sábado abre a partir das <b>13:00</b>. Serve de tarde de chuva ou de cansaço sem sair do bairro.","src":"docs/dossie-pesquisa-irlanda-porto.md §3 O endereço: Inchicore","t":"13:00"},{"ti":"Collins Barracks — Museu Nacional","b":"Grátis, sem reserva, <b>ter–sáb 10:00–17:00</b>, parada Museum do Luas vermelho: de Goldenbridge são seis paradas. Se o jogo esgotar ou chover, a tarde vira museu.","src":"days/2026-09-28.json 13:00; docs/adendo-dublin-porto-ultima-noite.md §2 (ter 29/09)","t":"13:00"}]},{"id":"2026-09-26.3.onde-comer","h":"onde comer","t":null,"c":"eat","b":"No Richmond Barracks eu <b>não</b> consigo confirmar que o café interno ainda funciona (era o “The Mess” — ligue 01 524 2532). O que funciona de verdade e fica a cinco minutos de lá é o <b>Loaf Café, Kilmainham Square, Unit 2, Inchicore Road</b> — <b>todo dia 08:00–16:00</b>, empresa social, comida simples e barata, bem em frente à Kilmainham Gaol (01 516 8294). <b>Indo pro Dalymount:</b> pare em Stoneybatter e coma no <b>Walsh's, 26 Stoneybatter</b>, ou no <b>Frank Ryan's, Queen Street</b>. Compre também o farnel de amanhã: na montanha não há nada.","ti":"Comer: Loaf Café; Walsh's indo pro Dalymount","kind":"do","place":"Loaf Café","maps":"Loaf Café, Kilmainham Square, Unit 2, Inchicore Road, Dublin 8","dur":60,"alts":[{"ti":"Greenville Deli, 200 m da porta","b":"<b>Greenville Deli, 5A Tyrconnell Road</b> — seg–sáb 08:00–16:00. Deli moderno, não é caçarola, mas é o que abre no seu quarteirão se o Loaf estiver cheio ou fechado.","src":"days/2026-09-25.json onde comer; docs/adendo-dublin-porto-ultima-noite.md §4","t":""},{"ti":"The Patriot's Inn, ao lado do Royal Hospital","b":"<b>760 South Circular Road</b>, cozinha <b>12:00–21:30</b>, prato sentado em pub. Atenção: o coddle não aparece no cardápio atual — ligue 01 679 9595 antes se for por ele.","src":"days/2026-09-28.json onde comer; extra_DOUBTS.json #13 Coddle no Patriot's Inn","t":"12:00"},{"ti":"Mannings Bakery, Thomas Street","b":"<b>Mannings Bakery, 39–40 Thomas Street</b> — padaria de trabalho das Liberties, aberta até as <b>19:00</b>. Resolve o farnel de amanhã (na montanha não há nada) e um lanche barato no caminho.","src":"days/2026-09-28.json onde comer; docs/adendo-dublin-porto-ultima-noite.md §4 fora do bairro","t":""}]},{"id":"2026-09-26.4.noite","h":"noite","t":null,"c":"note","b":"<b>Old Royal Oak, 11 Kilmainham Lane</b> — uma sala só, snug de verdade com passa-copos, aquecedor a gás dos anos 70, na mesma família desde 1837. Ou o Slatt's. Cedo: amanhã são 25 km.","ti":"Old Royal Oak — o snug de 1837","kind":"do","place":"The Old Royal Oak","maps":"The Old Royal Oak, 11 Kilmainham Lane, Dublin 8","dur":90,"alts":[{"ti":"Slatt's, 150 m da porta","b":"<b>Slatt's, 126A Tyrconnell Park</b> — pub de conjunto habitacional, bar e lounge com entradas separadas, <b>sem televisão</b>, Guinness €5,40. Volta para casa em dois minutos: ideal para dormir cedo antes dos 25 km.","src":"days/2026-09-25.json noite; extra_DOUBTS.json #21 Um erro meu, corrigido","t":""},{"ti":"Walsh's, Stoneybatter","b":"<b>Walsh's, 26 Stoneybatter</b> — um dos melhores pints de Dublin segundo duas fontes irlandesas, e fica a pé do Dalymount. Se sair do jogo com sede, é a parada antes de voltar para Inchicore.","src":"docs/dossie-pesquisa-irlanda-porto.md §11 Melhores pints de Dublin; days/2026-09-27.json onde comer","t":""},{"ti":"Rascals Brewing, taproom na sua rua","b":"<b>Goldenbridge Estate, Tyrconnell Road</b> — taproom + pizzaria, sábado a partir das 13:00. Cerveja artesanal sem sair da rua da cama.","src":"docs/dossie-pesquisa-irlanda-porto.md §3 O endereço: Inchicore","t":""}]}]},{"d":"2026-09-27","wd":"DOM","dt":"27/09","ti":"★ O dia duro — a travessia das montanhas de Dublin","base":"Dublin · montanha","rg":"dublin","tags":["grátis","★"],"note":"⚠️ Nenhuma trilha fechada em Ticknock, Kilmashogue, Tibradden, Cruagh ou Hell Fire em 12/09 (só trechos de mountain bike). A Coillte fecha as florestas em alerta vermelho de vento. A fase A do BusConnects pode mexer na família do 15 neste outono, sem data publicada — confira no TFI Live na semana. O encerramento do Festival of History no Richmond Barracks cai deste domingo; o sábado já te dá o festival.","lead":"O dia duro: Marlay Park ao Hell Fire Club a pé, 25 km. Farnel na mochila, 15B na volta e Walsh's de recompensa.","etq":[7,1],"ev":[{"id":"2026-09-27.0.o-dia","h":"★ o dia","t":null,"c":"star","b":"Sugestão do Richie (<i>“Dublin mountains is good”</i>), e ela cabe exatamente aqui: <b>Marlay Park → Fairy Castle (536 m) → Three Rock → Tibradden → Cruagh → Hell Fire Club</b>. ~25 km, ~900 m de subida, 7 a 8 horas, pela Dublin Mountains Way (marcação amarela). Se a Priscila topar, é o programa do dia; se o tempo virar ou as pernas reclamarem, a versão curta volta a Marlay Park depois de Tibradden: ~20 km, ~650 m, 5–6 h.","ti":"Travessia das montanhas de Dublin — 25 km","kind":"info","place":"Marlay Park","maps":"Marlay Park, Dublin","dur":0,"alts":[]},{"id":"2026-09-27.1.08-08","h":"08:08","t":"08:08","c":"time","b":"Luas vermelha de Blackhorse → Tallaght (21 min), ônibus <b>S8</b> Tallaght → Marlay Park (08:47 → 09:11). Alternativa: qualquer ônibus até o centro e o <b>16</b> da O'Connell St até Marlay Park, ~30 min.","ti":"Luas Blackhorse → Tallaght, S8 até Marlay Park","kind":"do","place":"Parada Luas Blackhorse","maps":"Blackhorse Luas stop, Dublin","dur":63,"alts":[{"ti":"Ônibus 16 da O'Connell St até Marlay Park","b":"Qualquer ônibus até o centro e o <b>16</b> da O'Connell Street até Marlay Park, ~30 min. Serve se a Luas ou o S8 falharem (a fase A do BusConnects pode mexer nas linhas neste outono — confira no TFI Live).","src":"days/2026-09-27.json evento 08:08 (alternativa) + extra_DOUBTS.json 'Montanhas de Dublin — os ônibus'","t":"08:15"}]},{"id":"2026-09-27.2.09-15","h":"09:15","t":"09:15","c":"time","b":"Marlay Park (portão sul) → Kilmashogue Lane → Wicklow Way até a sela de Two Rock → <b>Fairy Castle</b>, o ponto mais alto da travessia · ida e volta a <b>Three Rock</b> (as antenas) · oeste pela DMW sobre <b>Tibradden</b> (o cairn) e desce por Tibradden Wood · atravessa para <b>Cruagh Wood</b> e sai na R116 (sem calçada: colete refletivo) · <b>Hell Fire Club</b>, Montpelier Hill, 383 m · desce pela Killakee Road até Stocking Avenue.","ti":"Marlay → Fairy Castle → Tibradden → Hell Fire","kind":"do","place":"Marlay Park (portão sul)","maps":"Marlay Park, Dublin","dur":450,"alts":[{"ti":"Versão curta: volta a Marlay após Tibradden","b":"Se o tempo virar ou as pernas reclamarem: Marlay Park → Fairy Castle → Three Rock → Tibradden e volta a Marlay Park. ~20 km, ~650 m de subida, 5–6 h. Volta pelo 16 até a O'Connell St.","src":"days/2026-09-27.json ★ o dia (versão curta) + evento 08:08 (ônibus 16)","t":"09:15"},{"ti":"14 Henrietta Street, visita das 10:00","b":"Se a Coillte fechar as florestas (alerta vermelho de vento) ou chover a ponto de não valer: <b>14 Henrietta Street</b> abre de quarta a domingo com visitas de hora em hora das 10:00 às 16:00, €12, 75 min, só com reserva (14henriettastreet.ticketsolve.com ou 01 524 0383) — e o estoque real não está confirmado, ligue antes. Luas até Four Courts e 8 min a pé. É o museu mais encaixado no seu gosto em Dublin; se for hoje, libera a manhã de quarta 30.","src":"days/2026-09-30.json ★ o achado + preço + 09:05; extra_DOUBTS.json 'Os museus de Dublin'","t":"10:00"},{"ti":"Tour grátis do Royal Hospital + Bully's Acre","b":"Dia de chuva sem sair do bairro: <b>tour grátis dos terrenos do Royal Hospital Kilmainham</b>, guia no local todo dia às 11:00, 13:00 e 15:00, sem reserva, a ~10 min a pé de casa. Emenda com <b>Bully's Acre</b>, o cemitério de pobre e de cólera fechado em 1832, entrada pela avenida oeste.","src":"days/2026-09-28.json evento 11:00 + days/2026-10-01.json plano C + docs/dossie-pesquisa-irlanda-porto.md (IMMA ~10 min)","t":"11:00"}]},{"id":"2026-09-27.3.16-45","h":"~16:45","t":"16:45","c":"time","b":"Volta: <b>15B</b> em Stocking Hill → Merrion Square (~55 min; 16:47, 17:07, 17:27, 17:47…) ou <b>S8</b> em Ballyboden St Enda's → Luas de Tallaght. Pôr do sol 19:12.","ti":"Ônibus 15B de Stocking Hill → Merrion Square","kind":"do","place":"Ponto do 15B em Stocking Hill","maps":"Stocking Hill bus stop, Dublin","dur":55,"alts":[{"ti":"S8 em Ballyboden St Enda's → Luas Tallaght","b":"Se o 15B não vier (ou o BusConnects tiver mexido na família do 15): <b>S8</b> em Ballyboden St Enda's até Tallaght e Luas vermelha de volta a Blackhorse.","src":"days/2026-09-27.json evento ~16:45 + extra_DOUBTS.json 'Montanhas de Dublin — os ônibus'","t":"16:45"},{"ti":"Na versão curta: 16 de Marlay Park ao centro","b":"Se fez a versão curta e terminou em Marlay Park, o <b>16</b> vai de Marlay Park à O'Connell Street em ~30 min, e de lá qualquer ônibus ou a Luas de volta.","src":"days/2026-09-27.json evento 08:08 (alternativa) e ★ o dia (versão curta)","t":""}]},{"id":"2026-09-27.4.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Não há nada nos cumes: leve farnel comprado no sábado. Café da manhã no caminho é balcão de Centra em Tallaght ou em Marlay. Na volta, o jantar da recompensa: <b>Walsh's, 26 Stoneybatter</b> ou <b>Frank Ryan's, Queen Street</b>, e o Cobblestone ao lado se as pernas deixarem.","ti":"Jantar da recompensa: Walsh's ou Frank Ryan's","kind":"do","place":"Walsh's","maps":"Walsh's, 26 Stoneybatter, Dublin","dur":60,"alts":[{"ti":"Frank Ryan's, Queen Street","b":"A outra recompensa citada no plano: <b>Frank Ryan's, Queen Street</b>, Smithfield, a poucos passos do Cobblestone (que não serve comida nenhuma).","src":"days/2026-09-27.json onde comer + docs/adendo-dublin-porto-ultima-noite.md 'Fora do bairro'","t":"18:00"},{"ti":"The Patriot's Inn, ao lado de casa","b":"Se as pernas não quiserem ir até Smithfield: <b>The Patriot's Inn, 760 South Circular Road</b>, ao lado do Royal Hospital, cozinha 12:00–21:30 — prato sentado a poucos minutos de Inchicore. O coddle não está no cardápio atual: ligue 01 679 9595.","src":"days/2026-09-28.json onde comer + docs/adendo-dublin-porto-ultima-noite.md tabela Inchicore","t":"18:00"},{"ti":"Devitt's, Camden Street","b":"Se descer do 15B no centro (Merrion Square): <b>Devitt's, 78 Camden Street Lower</b> — à la carte 14:30–21:00. Trad no andar de cima só de segunda a quinta; hoje é só o prato.","src":"days/2026-09-28.json plano B da noite","t":"17:45"}]},{"id":"2026-09-27.5.noite","h":"noite","t":null,"c":"note","b":"<b>Cobblestone, Smithfield</b> — sessão às 19:00 e 21:30; vá pela cerveja, a música é o fundo. O dia justifica dormir cedo.","ti":"Cobblestone, Smithfield — pela cerveja","kind":"do","place":"The Cobblestone","maps":"The Cobblestone, Smithfield, Dublin","dur":90,"alts":[{"ti":"Fidelity (Whiplash), 79 Queen St","b":"Se o Cobblestone estiver lotado demais: <b>Fidelity (Whiplash), 79 Queen Street, Smithfield</b> — taproom com 24 torneiras, aberto 7 dias, a 200 m do Cobblestone.","src":"docs/dossie-pesquisa-irlanda-porto.md 'Cervejarias artesanais' (Fidelity)","t":"19:30"},{"ti":"Old Royal Oak, 11 Kilmainham Lane","b":"Se as pernas não deixarem ir a Smithfield: <b>Old Royal Oak, 11 Kilmainham Lane</b>, perto de casa — uma sala só, snug de verdade com passa-copos, na mesma família desde 1837. Praticamente só bebida.","src":"days/2026-09-26.json noite + docs/adendo-dublin-porto-ultima-noite.md tabela Inchicore","t":"20:00"},{"ti":"Slatt's, a 150 m da porta","b":"A opção zero-esforço: <b>Slatt's, 126A Tyrconnell Park</b>, a uns 150 metros da sua porta. Pub de conjunto habitacional, sem televisão, Guinness €5,40. Dormir cedo é parte do programa.","src":"days/2026-09-25.json noite","t":"20:00"}]}]},{"d":"2026-09-28","wd":"SEG","dt":"28/09","ti":"O único dia inteiro livre — e é o dia que carrega a semana","base":"Dublin","rg":"dublin","tags":["€8 + €12"],"note":"Esta é a última noite livre até 02/10. O que não couber aqui, não cabe em lugar nenhum da semana.","lead":"Único dia livre: Lutyens cedo, Collins Barracks 13h, Open Gate 16h, Cobblestone à noite. Kilmainham só se cair devolução às 09:15.","etq":[1,7],"ev":[{"id":"2026-09-28.0.atencao","h":"⚠️ atenção","t":null,"c":"warn","b":"Segunda é o pior dia de museu em Dublin. <b>O IMMA fecha às segundas</b> e <b>o Chester Beatty está fechado até 31/12/2026</b> por causa da presidência da UE. Os museus nacionais só abrem às 13:00. Mas é o único dia em que a noite é sua, então a noite é que manda aqui.","ti":"Segunda: IMMA e Chester Beatty fechados","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-09-28.1.17-09","h":"⛔ 17/09","t":null,"c":"gone","b":"<b>A Kilmainham Gaol está esgotada — e não é só o dia 28.</b> Verifiquei o calendário do sistema de vendas: <b>todas as datas liberadas estão lotadas</b>, de 17/09 a 15/10. O calendário marca “daySoldOut”, não “não liberado” — 16/10 em diante é que ainda não abriu. É lotação crônica, não azar do seu dia. Não existe venda no portão, nem revenda (ingresso de terceiro é recusado na entrada).","ti":"Kilmainham Gaol esgotada até 15/10","kind":"info","place":"Kilmainham Gaol","maps":"Kilmainham Gaol, Inchicore Road, Dublin 8","dur":0,"alts":[]},{"id":"2026-09-28.2.a-unica-porta","h":"a única porta","t":null,"c":"note","b":"<b>As devoluções entram online todo dia entre 09:15 e 09:30</b>, hora irlandesa (política publicada no próprio sistema). São ~8 minutos de janela. Tente três manhãs seguidas enquanto estiver em Dublin: 28/09 é a melhor data, mas qualquer manhã de 26/09 a 01/10 serve, já que o Richie quer ir também. kilmainhamgaol.admit-one.eu","ti":"Kilmainham: tentar devolução 09:15–09:30","kind":"do","place":"","maps":"","dur":15,"alts":[{"ti":"Richmond Barracks, Inchicore","b":"<b>Richmond Barracks</b>, a 7 minutos a pé da cama, entrada livre e sem reserva, seg–sáb 10:00–17:00. Foi ali que os líderes de 1916 foram julgados antes de serem fuzilados em Kilmainham — é a coisa mais próxima da cadeia que dá para ver sem ingresso.","src":"days/2026-10-01.json 10:00 plano firme; days/2026-09-26.json o que salva o dia","t":"10:00"},{"ti":"Repetir a janela nas manhãs seguintes","b":"Se não cair hoje, a janela de devoluções abre todo dia às 09:15–09:30. Qualquer manhã de 29/09 a 01/10 serve, e o Richie quer ir junto — dá para tentar de novo até quinta.","src":"days/2026-09-28.json a única porta; docs/adendo-dublin-porto-ultima-noite.md (devoluções 09:15–09:30)","t":"09:15"}]},{"id":"2026-09-28.3.08-00-plano-firme","h":"08:00 · plano firme","t":"08:00","c":"time","b":"Sem a cadeia, a manhã de segunda é toda grátis e sem reserva: ⭐ <b>Jardins do Memorial de Guerra</b>, Islandbridge, abrem <b>08:00 de segunda a sexta</b> — Lutyens, fontes de granito, ninguém. ~22 min a pé pela South Circular.","ti":"Jardins do Memorial de Guerra às 08:00","kind":"do","place":"Irish National War Memorial Gardens","maps":"Irish National War Memorial Gardens, Islandbridge, Dublin 8","dur":75,"alts":[{"ti":"Bully's Acre, Royal Hospital","b":"<b>Bully's Acre</b>, dentro dos terrenos do Royal Hospital Kilmainham, entrada pela avenida oeste: cemitério de pobre e de cólera fechado em 1832. Grátis, sem bilheteria, sem ninguém — dez minutos, no caminho de casa.","src":"days/2026-09-29.json 09:45","t":"09:45"},{"ti":"Caminho de sirga do Grand Canal","b":"Subir o <b>Grand Canal</b> de Suir Road até Portobello e voltar, ~5 km plano, garça, eclusa e nenhuma atração. É a manhã de perna cansada depois da travessia de domingo.","src":"days/2026-09-29.json se não quiser museu","t":"08:30"},{"ti":"Richmond Barracks (se chover)","b":"Coberto e a 7 minutos a pé: <b>Richmond Barracks</b>, Inchicore, seg–sáb 10:00–17:00, entrada livre e sem reserva. Exposição de 1916 e jardim.","src":"days/2026-09-26.json o que salva o dia; days/2026-10-01.json 10:00 plano firme","t":"10:00"}]},{"id":"2026-09-28.4.11-00","h":"11:00","t":"11:00","c":"time","b":"⭐ <b>Tour grátis dos terrenos do Royal Hospital Kilmainham</b> — guia no local <b>todo dia às 11:00, 13:00 e 15:00</b> até novembro, sem reserva. Emenda com <b>Bully's Acre</b>, o cemitério de pobre e de cólera fechado em 1832, dentro dos mesmos terrenos, entrada pela avenida oeste. ⚠️ O IMMA fecha às segundas — é só o terreno.","ti":"Tour grátis do Royal Hospital + Bully's Acre","kind":"do","place":"Royal Hospital Kilmainham","maps":"Royal Hospital Kilmainham, Kilmainham, Dublin 8","dur":90,"alts":[{"ti":"Mesmo tour às 13:00 ou 15:00","b":"O guia dos terrenos do Royal Hospital sai <b>todo dia às 11:00, 13:00 e 15:00</b>, até novembro, sem reserva. Se perder o das 11:00, o das 15:00 cabe entre o Collins Barracks e o Open Gate (que fica aberto até 21:00).","src":"days/2026-09-28.json 11:00; days/2026-10-01.json plano C","t":"15:00"},{"ti":"Bully's Acre por conta própria","b":"Sem guia: entre pela avenida oeste dos terrenos do Royal Hospital e veja o <b>Bully's Acre</b> sozinho. Grátis, sem bilheteria, dez minutos.","src":"days/2026-09-29.json 09:45","t":""},{"ti":"Richmond Barracks, Inchicore","b":"<b>Richmond Barracks</b>, seg–sáb 10:00–17:00, entrada livre e sem reserva, 7 minutos a pé da cama. História de 1916 coberta, se o tempo virar.","src":"days/2026-10-01.json 10:00 plano firme; days/2026-09-26.json o que salva o dia","t":"11:00"}]},{"id":"2026-09-28.5.13-00","h":"13:00","t":"13:00","c":"time","b":"<b>Museu Nacional — Artes Decorativas e História, no Collins Barracks.</b> ✅ Grátis, <b>sem reserva</b>, segunda 13:00–17:00 (ter–sáb abre 10:00), parada Museum do Luas. Militar, industrial, social — é o que mais combina com você dos museus nacionais, e é o único grande que nunca esgota.","ti":"Museu Nacional no Collins Barracks, 13:00","kind":"do","place":"National Museum of Ireland – Collins Barracks","maps":"National Museum of Ireland – Collins Barracks, Dublin","dur":90,"alts":[{"ti":"Museu Nacional de Arqueologia, Kildare St","b":"<b>NMI Archaeology, Kildare Street</b> — segunda 13:00–17:00, grátis. Mesmo horário de segunda que o Collins Barracks, no centro.","src":"docs/dossie-pesquisa-irlanda-porto.md §4 tabela 'Abrem na segunda'","t":"13:00"},{"ti":"National Gallery of Ireland","b":"<b>National Gallery of Ireland</b> — segunda 09:15–17:30, grátis. Ao contrário dos museus nacionais, abre de manhã na segunda, se a ordem do dia mudar.","src":"docs/dossie-pesquisa-irlanda-porto.md §4 tabela 'Abrem na segunda'","t":""},{"ti":"Collins Barracks na terça 29 às 10:00","b":"Se não couber hoje, o <b>Collins Barracks</b> já está no plano de terça 29/09 às 10:00 (ter–sáb 10:00–17:00, grátis), Luas de Goldenbridge até a parada Museum. Hoje pode virar só Open Gate e noite.","src":"days/2026-09-29.json 10:00","t":"10:00"}]},{"id":"2026-09-28.6.16-00","h":"16:00","t":"16:00","c":"time","b":"<b>Guinness Open Gate Brewery</b>, 53 James's Street — a cervejaria experimental de verdade, não o Storehouse. ✅ <b>Confirmado: sem reserva, sem couvert, entra quem chega.</b> Segunda 13:00–21:00, última mesa 20:00. ⚠️ <b>Fecha terça E quarta e nunca abre antes das 13:00</b> — como as quintas são de estágio, <b>hoje é a única chance na viagem inteira</b> (e a segunda 12/10 é o repescão).","ti":"Guinness Open Gate Brewery, James's Street","kind":"do","place":"Guinness Open Gate Brewery","maps":"Guinness Open Gate Brewery, 53 James's Street, Dublin 8","dur":90,"alts":[{"ti":"Repescão: segunda 12/10, 13:00–15:30","b":"Se hoje falhar, a <b>Guinness Open Gate Brewery</b> (segunda 13:00–21:00, 53 James's Street) tem a segunda chance na manhã livre de 12/10, antes de devolver o carro — de 13:00 às 15:30 cabe.","src":"days/2026-10-12.json manhã","t":"13:00"},{"ti":"Rascals Brewing, na sua rua","b":"<b>Rascals Brewing</b>, Unit 5, Goldenbridge Estate, Tyrconnell Road — taproom e pizzaria na mesma rua da cama. O dossiê diz seg–sex a partir das 16:00 numa seção e, noutra, que as artesanais só abrem qui–sáb: confirme antes de ir. Cervejaria de verdade, sem sair do bairro.","src":"docs/dossie-pesquisa-irlanda-porto.md §3 O endereço: Inchicore; §11 Cervejarias artesanais","t":"16:00"},{"ti":"Fidelity (Whiplash), Smithfield","b":"<b>Fidelity</b>, 79 Queen Street, Smithfield — taproom da Whiplash, 7 dias, 24 torneiras, a 200 m do Cobblestone. Encaixa antes da noite de Smithfield.","src":"docs/dossie-pesquisa-irlanda-porto.md §11 Cervejarias artesanais","t":"17:30"}]},{"id":"2026-09-28.7.onde-comer","h":"onde comer","t":null,"c":"eat","b":"De manhã, ao lado da cadeia: <b>Loaf Café, Kilmainham Square</b> (08:00–16:00, todo dia). No caminho para o Open Gate: ⭐ <b>Mannings Bakery, 39–40 Thomas Street</b> — padaria de trabalho das Liberties, aberta até as 19:00. Se quiser sentar e comer prato: <b>The Patriot's Inn, 760 South Circular Road</b>, ao lado do Royal Hospital, cozinha 12:00–21:30 — ⚠️ <b>o coddle NÃO está no cardápio atual</b> que consegui ler; ligue antes: 01 679 9595. Na noite de Smithfield, jante no <b>Walsh's, 26 Stoneybatter</b>.","ti":"Comer: Loaf, Mannings, Patriot's Inn, Walsh's","kind":"do","place":"Mannings Bakery","maps":"Mannings Bakery, 39-40 Thomas Street, Dublin 8","dur":60,"alts":[{"ti":"Greenville Deli, a 200 m da cama","b":"<b>Greenville Deli, 5A Tyrconnell Road</b>, seg–sáb 08:00–16:00. Deli moderno, não é caçarola, mas é o que abre cedo no seu quarteirão.","src":"days/2026-09-25.json onde comer; days/2026-09-29.json onde comer","t":"08:00"},{"ti":"Jantar: Black Lion, Emmet Road","b":"<b>The Black Lion, 207A Emmet Road</b> — pub documentado desde 1734, o mais antigo de Inchicore. Cozinha seg–sex 15:00–21:00, dois pratos por €17. Serve se a noite ficar no bairro.","src":"days/2026-09-25.json onde comer; docs/adendo-dublin-porto-ultima-noite.md §4","t":"18:00"},{"ti":"Frank Ryan's, Queen Street","b":"Em Smithfield, se o Walsh's estiver cheio: <b>Frank Ryan's, Queen Street</b>, ao lado do Cobblestone — que não serve comida nenhuma.","src":"days/2026-09-26.json onde comer; docs/adendo-dublin-porto-ultima-noite.md §4 Fora do bairro","t":"18:30"}]},{"id":"2026-09-28.8.19-15","h":"19:15","t":"19:15","c":"time","b":"<b>Cobblestone, Smithfield: aula de dança de conjunto para iniciantes, €12</b> (a de 20:20 é €14). Sem par e sem experiência. Emenda na <b>sessão bilíngue das 21:00</b>, tocada mais devagar, em irlandês. ⚠️ O calendário publicado da aula é 07/10 a 04/11 — confirme em info@louise.ie antes de ir.","ti":"Cobblestone: aula de dança 19:15 e sessão 21:00","kind":"do","place":"The Cobblestone","maps":"The Cobblestone, Smithfield, Dublin","dur":180,"alts":[{"ti":"Devitt's, Camden Street","b":"<b>Devitt's, 78 Camden Street Lower</b> — trad no andar de cima de segunda a quinta, das 18:30 até fechar, sem couvert. À la carte 14:30–21:00. É o plano B oficial da noite.","src":"days/2026-09-28.json plano B da noite","t":"19:00"},{"ti":"Cobblestone só pela sessão, sem a aula","b":"Se a aula não estiver confirmada (calendário publicado só de 07/10 a 04/11), vá ao <b>Cobblestone</b> mesmo assim pela cerveja: a sessão é o fundo, sem programa marcado.","src":"days/2026-09-28.json 19:15; days/2026-09-27.json noite; extra_DOUBTS.json 'Aula de dança no Cobblestone em 28/09'","t":"21:00"},{"ti":"Old Royal Oak, Kilmainham Lane","b":"Cansaço: <b>Old Royal Oak, 11 Kilmainham Lane</b>, perto de casa — uma sala só, snug de verdade com passa-copos, na mesma família desde 1837. Ou o Slatt's, a 150 m da porta.","src":"days/2026-09-26.json noite; days/2026-09-25.json noite","t":"20:00"}]},{"id":"2026-09-28.9.plano-b-da-noite","h":"plano B da noite","t":null,"c":"note","b":"<b>Devitt's, 78 Camden Street Lower</b> — trad no andar de cima <b>de segunda a quinta, das 18:30 até fechar, sem couvert</b>. Cozinha: café da manhã 10:00–12:00, almoço 12:00–14:30, à la carte 14:30–21:00.","ti":"Plano B da noite: Devitt's, Camden Street","kind":"do","place":"Devitt's","maps":"Devitt's, 78 Camden Street Lower, Dublin 2","dur":90,"alts":[{"ti":"Old Royal Oak, Kilmainham Lane","b":"<b>Old Royal Oak, 11 Kilmainham Lane</b> — uma sala só, snug com passa-copos, aquecedor a gás dos anos 70, na mesma família desde 1837. Praticamente só bebida, perto da casa.","src":"days/2026-09-26.json noite; docs/adendo-dublin-porto-ultima-noite.md §4; docs/dossie-pesquisa-irlanda-porto.md §11 Guinness","t":"20:00"},{"ti":"Slatt's, Tyrconnell Park","b":"<b>Slatt's, 126A Tyrconnell Park</b>, a 150 m da porta. Pub de conjunto habitacional, bar e lounge separados, sem televisão, Guinness €5,40.","src":"days/2026-09-25.json noite","t":"20:30"},{"ti":"Walsh's, Stoneybatter","b":"<b>Walsh's, 26 Stoneybatter</b> — entre as melhores pints de Dublin segundo duas fontes irlandesas, e serve comida. A poucos minutos do Cobblestone.","src":"docs/dossie-pesquisa-irlanda-porto.md §11 Guinness (melhores pints); days/2026-09-27.json onde comer","t":"19:00"}]}]},{"d":"2026-09-29","wd":"TER","dt":"29/09","ti":"Manhã leve — o jardim de Lutyens e o Collins Barracks","base":"Dublin · manhã","rg":"dublin","tags":["grátis"],"note":"⚠️ Não tente o IMMA agora: <b>o Great Hall e a Capela estão fechados o ano inteiro de 2026</b> por causa da presidência da UE. E o <b>Ryan's de Parkgate Street só abre às 15:00 de segunda a quarta</b>.","lead":"Manhã curta antes do estágio: jardins de Lutyens às 08:00, Bully's Acre e Collins Barracks de Luas. Tudo grátis, sem correr.","etq":[],"ev":[{"id":"2026-09-29.0.a-regra-do-dia","h":"a regra do dia","t":null,"c":"note","b":"Estágio à tarde e à noite. Você tem de <b>08:00 a ~12:30</b>, e o plano abaixo cabe nisso com folga, sem correr e sem gastar quase nada.","ti":"Manhã livre das 08:00 às 12:30, estágio depois","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-09-29.1.08-00","h":"08:00","t":"08:00","c":"time","b":"⭐ <b>Jardins do Memorial de Guerra, em Islandbridge — abrem às 08:00 de segunda a sexta, grátis.</b> É a única coisa séria que abre no horário em que a sua manhã começa. Projeto de <b>Edwin Lutyens</b>: fontes de granito, os dois pavilhões de livros e o gramado descendo para o Liffey. Às oito da manhã não tem ninguém. ~22 minutos a pé de Tyrconnell Road pela South Circular.","ti":"Jardins do Memorial de Guerra, Islandbridge","kind":"do","place":"Irish National War Memorial Gardens","maps":"Irish National War Memorial Gardens, Islandbridge, Dublin","dur":80,"alts":[{"ti":"Caminho de sirga do Grand Canal","b":"Suir Road até Portobello e volta, ~5 km plano, garça e eclusa, sem atração nenhuma. O canal em Suir Road é parte do seu bairro a pé, não depende de horário e serve se a perna da travessia de domingo ainda estiver pesada.","src":"days/2026-09-29.json #5 se não quiser museu + days/2026-09-25.json tarde","t":"08:00"},{"ti":"Richmond Barracks, Inchicore","b":"Prédio de entrada livre, sem reserva, seg–sáb 10:00–17:00, sete minutos a pé da cama. Foi ali que os líderes de 1916 foram julgados antes de serem fuzilados em Kilmainham; hoje é biblioteca e centro cultural com jardim. Serve de abrigo se chover e cobre a mesma história a pé.","src":"days/2026-09-26.json 'o que salva o dia' + days/2026-10-01.json 10:00 plano firme","t":"10:00"}]},{"id":"2026-09-29.2.09-45","h":"09:45","t":"09:45","c":"time","b":"Volta por Kilmainham. Se quiser esticar dez minutos: ⭐ <b>Bully's Acre</b>, dentro dos terrenos do Royal Hospital, entrada pela avenida oeste. Cemitério de pobre e de cólera, fechado em 1832, provavelmente em cima de um mosteiro do século VII. Grátis, sem bilheteria e sem ninguém.","ti":"Bully's Acre, no Royal Hospital Kilmainham","kind":"do","place":"Bully's Acre","maps":"Bully's Acre, Royal Hospital Kilmainham, Dublin","dur":15,"alts":[{"ti":"Tour grátis dos terrenos do Royal Hospital","b":"Guia no local todo dia às 11:00, 13:00 e 15:00 até novembro, sem reserva. Cobre os mesmos terrenos com explicação, e o Bully's Acre entra no caminho. É só o terreno: o Great Hall e a Capela do IMMA estão fechados em 2026. Só cabe se você trocar o Collins Barracks por ele.","src":"days/2026-09-28.json 11:00 + days/2026-09-29.json note","t":"11:00"},{"ti":"Richmond Barracks, Inchicore","b":"Entrada livre seg–sáb 10:00–17:00, a sete minutos da cama. Mesma história de 1916 e Kilmainham, coberta e sem bilheteria.","src":"days/2026-10-01.json 10:00 plano firme","t":"10:00"}]},{"id":"2026-09-29.3.10-00","h":"10:00","t":"10:00","c":"time","b":"<b>Museu Nacional — Collins Barracks. Ter–sáb 10:00–17:00, grátis.</b> Luas de Goldenbridge até a parada Museum, seis paradas, ~11 minutos. Uma hora e meia ali é a dose certa. Você volta pra casa de Luas em 15 minutos.","ti":"Collins Barracks — Museu Nacional, de Luas","kind":"do","place":"Museu Nacional da Irlanda — Collins Barracks","maps":"National Museum of Ireland, Collins Barracks, Dublin","dur":120,"alts":[{"ti":"Richmond Barracks, Inchicore","b":"Entrada livre, sem reserva, seg–sáb 10:00–17:00, sete minutos a pé de Tyrconnell Road. Exposição e jardim; é a coisa mais próxima da cadeia esgotada que você consegue ver, e sem Luas.","src":"days/2026-10-01.json 10:00 plano firme + days/2026-09-26.json 'o que salva o dia'","t":"10:00"},{"ti":"Tour grátis dos terrenos do Royal Hospital","b":"Guia no local às 11:00, sem reserva, até novembro. Emenda com o Bully's Acre e você volta a pé por Kilmainham antes do turno. É só o terreno: o Great Hall e a Capela do IMMA estão fechados em 2026.","src":"days/2026-09-28.json 11:00 + days/2026-09-29.json note","t":"11:00"},{"ti":"Caminho de sirga do Grand Canal","b":"Suir Road até Portobello e volta, ~5 km plano. É a manhã de perna cansada: nenhuma atração, nenhum horário, nenhum gasto.","src":"days/2026-09-29.json #5 se não quiser museu","t":"10:00"}]},{"id":"2026-09-29.4.onde-comer","h":"onde comer","t":null,"c":"eat","b":"⭐ <b>Loaf Café, Kilmainham Square, Unit 2, Inchicore Road (D08 Y447) — todo dia 08:00–16:00.</b> Fica exatamente entre os jardins e a Luas, é empresa social, prato quente e sanduíche a preço de bairro. Alternativa a 200 m da cama: <b>Greenville Deli, 5A Tyrconnell Road, 08:00</b>. E a resposta honesta sobre o café da manhã de trabalhador em Inchicore: <b>ele hoje é o breakfast roll do balcão quente do Centra ou do Spar da Emmet Road</b> — uns €4, e nenhuma dessas lojas publica horário.","ti":"Comer: Loaf Café, Kilmainham Square","kind":"do","place":"Loaf Café","maps":"Loaf Café, Kilmainham Square, Unit 2, Inchicore Road, Dublin D08 Y447","dur":45,"alts":[{"ti":"Greenville Deli, Tyrconnell Road","b":"5A Tyrconnell Road, a 200 m da cama, seg–sáb 08:00–16:00. Deli moderno, não é caçarola, mas é o que abre no seu quarteirão antes de sair.","src":"days/2026-09-25.json onde comer + days/2026-09-29.json #4","t":"08:00"},{"ti":"Breakfast roll do Centra ou Spar, Emmet Road","b":"Balcão quente do Centra ou do Spar da Emmet Road, uns €4. É o que restou do café da manhã de trabalhador em Inchicore; nenhuma das lojas publica horário.","src":"days/2026-09-29.json #4 + extra_DOUBTS.json 'O café da manhã tradicional de Dublin'","t":""},{"ti":"Mannings Bakery, Thomas Street","b":"39–40 Thomas Street, padaria de trabalho das Liberties, aberta até as 19:00. Voltando do Collins Barracks de Luas, salte em James's e leve alguma coisa para comer antes do turno.","src":"days/2026-09-28.json onde comer + days/2026-09-30.json onde comer","t":"12:00"}]},{"id":"2026-09-29.5.se-nao-quiser-museu","h":"se não quiser museu","t":null,"c":"note","b":"O caminho de sirga do <b>Grand Canal</b>, subindo de Suir Road até Portobello e voltando — ~5 km plano, garça, eclusa e nenhuma atração. É a manhã de perna cansada — e depois da travessia de domingo, ela pode ser necessária.","ti":"Plano B: caminho do Grand Canal até Portobello","kind":"do","place":"Grand Canal — Suir Road","maps":"Suir Road, Grand Canal, Dublin","dur":75,"alts":[{"ti":"Richmond Barracks, Inchicore","b":"Se chover, o prédio é entrada livre seg–sáb 10:00–17:00, sete minutos a pé. Exposição e jardim, sem reserva.","src":"days/2026-10-01.json 10:00 plano firme + days/2026-09-26.json 'o que salva o dia'","t":"10:00"},{"ti":"Tour grátis dos terrenos do Royal Hospital","b":"Guia no local às 11:00 (também 13:00 e 15:00), sem reserva, até novembro. Caminhada guiada pelos terrenos, emendando com o Bully's Acre. É só o terreno: o Great Hall e a Capela do IMMA estão fechados em 2026.","src":"days/2026-09-28.json 11:00 + days/2026-09-29.json note","t":"11:00"}]}]},{"d":"2026-09-30","wd":"QUA","dt":"30/09","ti":"★ Manhã leve — 14 Henrietta Street às 10:00","base":"Dublin · manhã","rg":"dublin","tags":["€12","★"],"note":"⚠️ Duas armadilhas de quarta-feira: <b>o IMMA só abre 11:30 na quarta</b>, e a <b>Guinness Open Gate fecha terça e quarta</b>. Nenhum dos dois cabe hoje.","lead":"Manhã curta: 14 Henrietta Street às 10:00, só com reserva, Moore Street depois e em casa 12:25. Tarde e noite são do estágio.","etq":[],"ev":[{"id":"2026-09-30.0.o-achado","h":"★ o achado","t":null,"c":"star","b":"<b>14 Henrietta Street abre quarta a domingo, com visitas de hora em hora das 10:00 às 16:00.</b> Uma casa georgiana onde chegaram a morar dezessete famílias, contada pelas pessoas que viveram nela. É o museu mais bem encaixado no seu gosto em Dublin inteira, e não é armadilha nenhuma.","ti":"14 Henrietta Street — visita das 10:00","kind":"do","place":"14 Henrietta Street","maps":"14 Henrietta Street, Dublin","dur":75,"alts":[{"ti":"Henrietta na quinta 01/10 às 10:00","b":"A quinta também tem visita de hora em hora a partir das 10:00. Se a de quarta esgotar ou você atrasar, é o plano C oficial da manhã de quinta — mesma casa, mesmo preço.","src":"plano.json 01/10 plano C","t":"10:00"},{"ti":"Collins Barracks — Museu Nacional, grátis","b":"<b>Ter–sáb 10:00–17:00, grátis, sem reserva</b>, parada Museum do Luas (linha vermelha, seis paradas de Goldenbridge, ~11 min). Militar, industrial, social — dos museus nacionais é o que mais combina com você, e é o único grande que nunca esgota.","src":"plano.json 29/09 10:00 e 28/09 13:00","t":"10:00"},{"ti":"Richmond Barracks, Inchicore","b":"<b>Seg–sáb 10:00–17:00, entrada livre e sem reserva</b>, sete minutos a pé da cama. Onde os líderes de 1916 foram julgados antes de Kilmainham. Nem preço nem café publicados: 01 524 2532.","src":"plano.json 01/10 10:00 e 26/09 'o que salva o dia'","t":"10:00"}]},{"id":"2026-09-30.1.preco","h":"preço","t":null,"c":"note","b":"<b>€12 adulto</b> (€10 concessão), <b>75 minutos</b>, só com visita guiada e <b>só com reserva</b> — a capacidade é pequena e esgota. Reserve em <b>14henriettastreet.ticketsolve.com</b> ou 01 524 0383. Chegue 10 minutos antes.","ti":"Reservar Henrietta: €12, 75 min, esgota","kind":"do","place":"14 Henrietta Street","maps":"14 Henrietta Street, Dublin","dur":5,"alts":[{"ti":"Ligar 01 524 0383","b":"O estoque real do site é JavaScript e não deu para ler. Se o ticketsolve não mostrar vaga, o telefone resolve na hora.","src":"extra_DOUBTS.json #0 (museus de Dublin)","t":""},{"ti":"Chegar 09:50 e arriscar walk-in","b":"Quarta e quinta são os dias quietos e a casa aceita quem chega, mas a capacidade é pequena. Sem reserva, chegue às 09:50 e tente a das 10:00.","src":"docs/roteiro-fontes-build.md (🟡 SE QUISER — 14 Henrietta Street)","t":"09:50"}]},{"id":"2026-09-30.2.09-05","h":"09:05","t":"09:05","c":"time","b":"Luas da Suir Road até Four Courts, ~14 min, e 8 minutos a pé subindo a Bolton Street. Porta a porta são uns 35–40 minutos. <b>Pegue a das 10:00, não a das 11:00</b> — a das 11:00 termina 12:15 e te deixa sem margem.","ti":"Luas Suir Road → Four Courts, 09:05","kind":"do","place":"Suir Road (Luas)","maps":"Suir Road Luas stop, Dublin 8","dur":40,"alts":[{"ti":"Visita das 11:00 (sem margem)","b":"Se perder a das 10:00, existe a das 11:00 — mas termina 12:15 e te deixa sem folga para o turno. Só se o estágio começar mais tarde hoje.","src":"plano.json 30/09 09:05","t":"11:00"},{"ti":"Tour grátis do Royal Hospital Kilmainham","b":"Guia no local <b>todo dia às 11:00</b>, sem reserva, até novembro; emenda com Bully's Acre, o cemitério de pobre e de cólera fechado em 1832. Fica a pé de casa, sem depender de Luas.","src":"plano.json 28/09 11:00 e 01/10 plano C","t":"11:00"},{"ti":"Grand Canal a pé, Suir Road → Portobello","b":"Caminho de sirga do Grand Canal, ~5 km plano, garça, eclusa e nenhuma atração. A manhã de perna cansada, sem bilhete nem horário.","src":"plano.json 29/09 'se não quiser museu'","t":"09:05"}]},{"id":"2026-09-30.3.11-20","h":"11:20","t":"11:20","c":"time","b":"A visita termina ~11:15. A 10 minutos a pé está o <b>Moore Street Market</b>, que <b>abre 11:00, de quarta a sábado</b> — o último mercado de rua de Dublin, hoje tomado por quitandeiro e por balcão africano e asiático, e sem uma única barraca de artesanato.","ti":"Moore Street Market a pé","kind":"do","place":"Moore Street Market","maps":"Moore Street Market, Moore Street, Dublin","dur":30,"alts":[{"ti":"Mannings Bakery, Thomas Street","b":"Padaria de trabalho das Liberties, <b>39–40 Thomas Street</b>, aberta até as 19:00. Salte em James's na volta do Luas e leve alguma coisa.","src":"plano.json 30/09 onde comer e 28/09 onde comer","t":"11:30"},{"ti":"Collins Barracks, parada Museum","b":"Se não quiser mercado: <b>grátis, ter–sáb 10:00–17:00</b>, parada Museum da linha vermelha, a 15 minutos de Luas de casa. Uma hora ali cabe antes do turno.","src":"plano.json 29/09 10:00","t":"11:20"}]},{"id":"2026-09-30.4.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Café da manhã antes de sair: <b>Greenville Deli, 5A Tyrconnell Road, 08:00</b>, ou o breakfast roll da Emmet Road. Perto do museu: ⭐ <b>Kingfisher, 166–168 Parnell Street</b> — ⚠️ <b>abre ao meio-dia</b>, então só serve se o seu turno começar depois das 13:00; peixe com batata e fritada irlandesa o dia todo. Voltando de Luas, salte em James's e leve alguma coisa da ⭐ <b>Mannings Bakery, 39–40 Thomas Street</b>.","ti":"Comer: Greenville Deli cedo, Mannings na volta","kind":"do","place":"Greenville Deli","maps":"Greenville Deli, 5A Tyrconnell Road, Dublin 8","dur":30,"alts":[{"ti":"Loaf Café, Kilmainham Square","b":"<b>Unit 2, Inchicore Road — todo dia 08:00–16:00</b>, empresa social, prato quente e sanduíche a preço de bairro, em frente à Kilmainham Gaol. Fica entre os Jardins do Memorial e a Luas, não no caminho direto da Suir Road.","src":"plano.json 29/09 onde comer e 26/09 onde comer","t":"08:15"},{"ti":"Breakfast roll do Centra/Spar da Emmet Road","b":"~€4 no balcão quente. É literalmente o que o trabalhador de Inchicore come hoje; nenhuma dessas lojas publica horário.","src":"plano.json 29/09 onde comer; extra_DOUBTS.json #14","t":"08:30"}]},{"id":"2026-09-30.5.12-00","h":"12:00","t":"12:00","c":"time","b":"Luas de Jervis ou Four Courts direto para Goldenbridge. Em casa 12:25.","ti":"Luas Jervis/Four Courts → Goldenbridge, 12:25","kind":"do","place":"Jervis (Luas)","maps":"Jervis Luas stop, Dublin","dur":25,"alts":[{"ti":"Salte em James's: Mannings Bakery","b":"Desça uma parada antes, na James's, e leve alguma coisa da <b>Mannings, 39–40 Thomas Street</b>, antes de retomar o Luas até Goldenbridge.","src":"plano.json 30/09 onde comer","t":"12:05"}]}]},{"d":"2026-10-01","wd":"QUI","dt":"01/10","ti":"Manhã leve — o Magazine Fort, que reabriu em julho","base":"Dublin · manhã","rg":"dublin","tags":["grátis","★"],"note":"Amanhã cedo você viaja para Galway. Deixe a mala pronta hoje.","lead":"Magazine Fort esgotou: a manhã é o Richmond Barracks, a 7 min de casa, e o turno à tarde. Mala pronta para Galway.","etq":[],"ev":[{"id":"2026-10-01.0.17-09","h":"⛔ 17/09","t":null,"c":"gone","b":"<b>O Magazine Fort esgotou.</b> O bloco de 1 a 14 de outubro <b>já foi publicado no Eventbrite e está marcado “Sold out”</b> (o de 15–30/09 também). São 12 lugares por dia numa visita diária — era previsível. O forte de 1735 reabriu em julho depois de décadas em ruína e virou o passeio mais disputado do parque.","ti":"Magazine Fort esgotado (bloco 1–14/10)","kind":"info","place":"Magazine Fort","maps":"Magazine Fort, Military Road, Phoenix Park, Dublin","dur":0,"alts":[]},{"id":"2026-10-01.1.se-quiser-insistir","h":"se quiser insistir","t":null,"c":"note","b":"Vale <b>um olhar manual no Eventbrite</b> (eventbrite.ie, “Magazine Fort Guided Tours October 1st–14th”): a página mostra esgotado no nível da série e eu não consegui ler linha por linha, então pode haver uma vaga solta no dia 1. E desistência acontece. Mas <b>não organize a manhã em volta disso</b>.","ti":"Olhar manual no Eventbrite do Magazine Fort","kind":"do","place":"","maps":"","dur":5,"alts":[{"ti":"Ligar 01 677 0095 por desistência","b":"Telefone do Phoenix Park Visitor Centre (OPW). Pergunte se sobrou vaga ou desistência para a visita das 11:00 de quinta 1/10 e confirme a duração: o Eventbrite lista 11:00–12:00, mas nenhuma outra fonte publica quanto dura. Sem resposta, a manhã segue no Richmond Barracks.","src":"extra_DOUBTS.json #11 (Magazine Fort — a reserva ainda não existe); docs/pendencias-reservas-15-09.md (Magazine Fort — verificado em 15/09, ação para o Lucas)","t":""}]},{"id":"2026-10-01.2.o-problema","h":"⚠️ o problema","t":null,"c":"warn","b":"<b>O OPW publica as datas em blocos de quinze dias.</b> O bloco de outubro deve entrar por volta do dia 25/09. Com 12 lugares e uma visita por dia, isso voa. <b>E a duração não está publicada em lugar nenhum</b> — se for 75 minutos, termina 12:15 e fica apertado contra o seu turno. Ligue 01 677 0095 e pergunte as duas coisas. ⚠️ Ignore a página do heritageireland.ie: ela está desatualizada.","ti":"OPW: blocos de 15 dias e duração não publicada","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-01.3.09-2
