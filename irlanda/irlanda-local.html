l, mesmo sendo turístico eu tenho que ir, como o Cristo Redentor do Rio. A questão são lugares que não valem a pena e os turistas vão somente para tirar fotos, como a Fontana di Trevi, quando você chega é uma decepção. Um exemplo claro em Dublin é o Temple Bar.\"* O filtro é **entrega × só foto**, não \"turístico × local\". Por isso os Cliffs of Moher entraram e o Temple Bar nunca entra.\n- **Música:** ele **nunca** elevou a música tradicional a atração. A frase *\"jamais iria em um show de rock estando na Irlanda, e show só se fosse de música cultural regional\"* era uma **condição**, não entusiasmo. Uma versão anterior do plano errou feio pondo um clube de canto à capela como motivo de ir a Cork, e ele reclamou: *\"isso não é de longe o maior motivo, pode fazer parte.\"* Regra vigente: **música é pano de fundo de pub; no máximo uma ida sentada; nenhum show pago.** Cerveja, natureza e cultura antes de vida noturna.\n- **Como trabalhar com ele:** *\"Vamos construir esse plano juntos, sem criar tudo e ir me falando o que devo fazer, me faça perguntas quantas julgar necessárias\"* · *\"não quero tudo agora, vamos montando por parte, porque se você cria tudo agora fica tudo enviesado para o que você já criou\"* · *\"faça mais perguntas aqui diretamente no chat caso você tenha duas coisas que você ache interessantes mas são conflitantes\"* · *\"leve em consideração as observações anteriores, junto com essas novas, não isole só pelos pedidos recentes\"* · *\"Gaste o tempo e tokens que for necessário para essa pesquisa, e nada de preguiça! Pesquise preferencialmente em sites irlandeses, atualizados, e fontes oficiais.\"*\n- **Contas:** *\"se quiser usar a minha conta Firebase e Google Cloud você tem acesso a tudo, só faça tudo separado das minhas contas de trabalho, trate isso como algo pessoal.\"* Ou seja: se o app novo precisar de backend, Firebase é bem-vindo, num projeto pessoal, separado do trabalho.\n- **Tom:** ele pediu para o texto dizer **\"Claude\"** e não \"robô\" (*\"tenho afeto por você, não é só um robô\"*). Nada de flerte em mensagens para a Priscila (ele pediu e depois retirou). Português do Brasil, direto, sem formalidade.\n- **Postura de reservas (decisão de 17/09):** *\"Sinceramente não quero reservar nada agora, vou esperar chegar na Irlanda para tomar decisões melhores, visto que lá consigo perguntar.\"* Isso está certo para quase tudo (entra quem chega, ou o ingresso só abre na semana). As exceções são estoque, não decisão — ver seção 10.\n\n## 3. O que está comprado e travado\n\n| Item | Detalhe |\n|---|---|\n| **Air France, reserva Y4WCIU** | Ida: AF0453 GRU 14:40 → CDG (24/09), EI0521 CDG 10:20 → **DUB 11:15 (sex 25/09)**. Volta: **AF1617 DUB 09:15 (qui 15/10)** → CDG → Rio → Goiânia. ⚠️ **Check-in fecha 08:35** — é a trava que organiza os últimos três dias. |\n| **Ryanair, reserva D2T4SZ** | **FR7072 seg 12/10 DUB 19:35 → OPO 22:00** · **FR7079 qua 14/10 OPO 17:55 → DUB 20:20**. €136,34 pagos (Mastercard final 5548). Portão fecha 30 min antes; check-in no balcão custa €55. |\n| **Base em Dublin** | **38–41 Tyrconnell Road, Inchicore, D08 TXV4** (casa da Priscila). Luas vermelha: Goldenbridge ou Suir Road. Ônibus G1/G2 24 h em Inchicore Village. Leap Card €2/90 min, teto €6/dia. Vale 25/09–01/10, **10–11/10** e a noite de 14→15/10 — ⚠️ as três noites avulsas ainda precisam de confirmação com quem hospeda. |\n| **Estágio num restaurante** | 29/09, 30/09 e 01/10, **tarde e noite**. Sobram só as manhãs, até ~12:15. |\n| **Porto** | O irmão dele mora lá. 12→14/10, duas noites. |\n| **Carro alugado (decidido, não reservado)** | Sex 2/10 ~09:00 Dublin → seg 12/10 ~15:30 Dublin Airport (Eastlands). Retirado com a Priscila e o Richie (eles não têm carro), os três vão a Galway, eles voltam de trem no domingo 4, o carro fica com o Lucas. Manual, ~1.500 km. Referência: Ford Focus 11 dias €250 (carhire.ie, franquia €1.800). Detalhes e o problema do seguro na seção 6. |\n\n## 4. Os 21 dias — o esqueleto\n\nBase = onde dorme. `rg` é a região usada para cor no app. O conteúdo completo de cada dia (com horários, endereços, telefones, \"onde comer\") está em `plano.json`.\n\n| Data | rg | Base | O dia |\n|---|---|---|---|\n| sex 25/09 | dublin | Dublin | Chegada 11:15 — Leap Card, o bairro (Inchicore), primeiro pub: **Slatt's**, Tyrconnell Park |\n| sáb 26/09 | dublin | Dublin | Dublin Festival of History no Richmond Barracks (grátis, prédio de entrada livre) · 15:00 **Bohemians × Bohemians Praha**, Dalymount (€20) |\n| dom 27/09 | dublin | Dublin · montanha | ★ Travessia das montanhas de Dublin: Marlay Park → Fairy Castle → Three Rock → Tibradden → Cruagh → Hell Fire Club, ~25 km / 900 m (ideia do Richie) |\n| seg 28/09 | dublin | Dublin | Único dia inteiro livre. Kilmainham Gaol **esgotada** (devoluções 09:15–09:30) → Jardins do Memorial de Guerra 08:00, tour grátis do Royal Hospital 11:00, Collins Barracks 13:00, **Guinness Open Gate** 16:00 (única chance), Cobblestone 19:15 |\n| ter 29/09 | dublin | manhã | Estágio. Manhã: jardins de Lutyens 08:00 + Bully's Acre + Collins Barracks 10:00 |\n| qua 30/09 | dublin | manhã | Estágio. Manhã: ★ **14 Henrietta Street** às 10:00 (€12, reservar) + Moore Street Market |\n| qui 01/10 | dublin | manhã | Estágio. Magazine Fort **esgotado** → Richmond Barracks 10:00 (entrada livre) |\n| sex 02/10 | west | Galway | Retira o carro ~09:00, Dublin → Galway pela M4/M6 com a Priscila e o Richie. Galgos 19:50 (Galway Greyhound Stadium) se toparem |\n| sáb 03/10 | west | Galway | Galway Market 09:30, Salthill, o que eles quiserem mostrar; Áras na nGael 21:00 |\n| dom 04/10 | west | Galway → Ballinasloe | ★ **Feira de Ballinasloe**, sozinho, de dia (eles voltam a Dublin e não recomendam — ele foi mesmo assim). Citylink 763 10:00, volta 16:25. **\"Don't say travellers!\"** |\n| seg 05/10 | west | Inishbofin | ★ Carro até o cais de Cleggan (89 km), balsa 11:30, Westquarter Loop, noite no **Day's Bar B&B**. \"My favourite place in the country\" (Richie) |\n| ter 06/10 | west | Galway | Balsa 09:00 → Galway ~12:00 → **Galway Races em Ballybrit**, 1º páreo 14:20 (~€15). \"Ballybrit on a Tuesday\" (Richie) |\n| qua 07/10 | west | Galway | ★ Estrada do Burren de carro: Kinvara → Ballyvaughan → Doolin → **Cliffs of Moher** (antes das 11:00, €8 online) → volta. Ônibus 350 é o plano sem carro |\n| qui 08/10 | cork | Cork | Galway → Cork pela M18/M20 (~2h45). English Market (Farmgate), ⭐ **Goldie** 19:30 (021 239 8720), Sin É, Welcome Inn |\n| sex 09/10 | cork | Cork | ★ Beara de carro: Cork → Glengarriff → **Castletownbere** (caranguejo — Breen's, MacCarthy's) → Healy Pass → Kenmare → Cork, ~280 km. Galgos em Curraheen 19:35 |\n| sáb 10/10 | cork | Cork → Dublin | Cork → Dublin pela M8 (~2h45, sai 07:30). O dia com eles no carro: Howth ou Wicklow. ⚡ Se a final de hurling cair hoje, Thurles entra como parada (+11 min). **Comprar a carne do churrasco hoje** |\n| dom 11/10 | dublin | Dublin | ★ **Churrasco na casa dos pais do Richie** — o ponto alto. Sem trem, sem horário. Oferecer-se para assar |\n| seg 12/10 | porto | Dublin → Porto | Manhã livre em Inchicore (Open Gate 13:00 como repescagem), **devolução do carro 15:30** no aeroporto, FR7072 19:35, pousa 22:00, jantar de madrugada no Cufra |\n| ter 13/10 | porto | Porto | Bolhão 09:00, Matosinhos 11:00, almoço na Rua Heróis de França, Casa da Guitarra 16:00, ★ FC Porto no Dragão se jogar (Champions 13–14/10) |\n| qua 14/10 | porto | Porto → Dublin | Café com cheirinho 08:30, Afurada 11:00, bifana no Conga, metrô 15:30, FR7079 17:55 → Dublin 20:20, 782 + Luas até Inchicore ~22:15 |\n| qui 15/10 | dublin | Dublin → casa | Sai a pé 04:50 → Heuston → **Dublin Express 782 05:35 → T1 06:21** (€10). Check-in AF fecha 08:35. AF1617 09:15 |\n\n## 5. As pessoas\n\n**Priscila** — amiga, mora em Dublin, hospeda o Lucas. Em 13/09 mandou o plano deles: Galway juntos sexta e sábado (voltam domingo); Ballinasloe é \"unusual\", não recomendam; day tour aos Cliffs (\"lindíssimo\"); Inishbofin com pernoite (\"uma grande fazenda em forma de ilha, sem iluminação na rua, ou gosta ou odeia\" — a família do Richie vai há 14 anos); último fim de semana em Dublin com eles (Howth, Bray, Guinness Lake); Kilmainham com o Richie. Ela recebeu a página em inglês (`paginas/ireland-itinerary-en.html`).\n\n**Richie** — namorado dela, irlandês, sem carro. Respondeu 17 de 18 perguntas de um questionário em 12/09 (íntegra em `docs/richie-veredito-e-decisoes-12-09.md`). O essencial: *\"Go Galway, down to Cleggan and get the ferry out to Inishbofin. My favourite place in the country.\"* · Ballinasloe: *\"Grand\"* — *\"Don't say travellers!\"* — *\"Nobody will bother him.\"* · Dia a proteger: Sunday · Cork: An Spailpín Fánach, Goldie, e do festival só o Céilí Mór (€10) · Levar um amigo de fora: *\"THE DOGS\"* e *\"BALLYBRIT ON A TUESDAY\"* · Mart de gado: *\"No. Leave the men to it.\"* · Carro: Connemara · Montanha: *\"Dublin mountains is good.\"* · West Cork: Castletownbere, *\"some of the best crab/shellfish in the country\"* · *\"He'll buy a round out of turn. He'll survive.\"* Pints devidos: 5. **Os pais dele são os anfitriões do churrasco de domingo 11 — onde eles moram ainda não foi confirmado** (o dia foi montado supondo Dublin ou arredores).\n\n## 6. Decisões tomadas e por quê (cronológico)\n\nEsta é a parte que evita refazer discussão já vencida.\n\n1. **Belfast × Cork (agosto):** avaliação completa em `docs/belfast-vs-cork-avaliacao.md`. Cork venceu — Belfast exigiria ETA do Reino Unido e quebraria a lógica de Galway → sul. Não reabrir.\n2. **Galway antes de Cork, Ballinasloe no meio:** a feira de cavalos de Ballinasloe (a mais antiga da Europa, 80 mil pessoas numa vila de 6.600, negócio em dinheiro com aperto de mão) é a materialização do \"bagaceira\" que ele pediu. A Priscila e o Richie não recomendam; ele decidiu **ir mesmo assim, sozinho, no domingo 4, de dia, e voltar cedo**. Regra de segurança e etiqueta em `conteudo-completo.json → ETIQUETTE`.\n3. **Inishbofin de segunda para terça (não quarta):** para não perder Ballybrit na terça (Richie). A balsa é uma operadora só; as saídas de outubro das 11:30 (seg) e 09:00 (ter) **não estavam online** — reserva por telefone 095 37228.\n4. **Cliffs of Moher entraram** depois da regra do Cristo Redentor: é o turístico que entrega. Antes das 11:00, €8, falésia vazia.\n5. **Música rebaixada (17/09):** todos os shows pagos cortados; o Cork Singers' Club foi rebaixado e depois cortado de vez. Só pub de fundo. Ver seção 1.\n6. **Carro alugado de sexta 2 a segunda 12 (14/09):** porque o Richie não tem carro e o fim de semana deles (Wicklow) não existe sem carro. Substituiu dois GoCar, ônibus 51 e o trem de sábado. **O problema do seguro, verificado:** o Mastercard Black do Brasil cobre a Irlanda (guia set/2025, \"em qualquer lugar do mundo\", 60 dias; a Visa exclui, a Mastercard não), **mas** Europcar/Irish Car Rentals/carhire.ie só aceitam dispensa de CDW com cartão americano ou canadense; Avis e Sixt aceitam com carta do emissor em inglês citando \"Republic of Ireland\" + caução de €5.000 + taxa €30–40; Hertz não pede carta (bloqueia só a franquia €2.000–3.500). Pergunta aberta para a Mastercard: *\"cobre a franquia quando o CDW básico vem embutido na tarifa e não pode ser recusado?\"* CNH vale sozinha por lei (S.I. 384/1992), mas Avis e Europcar exigem PID no balcão. Custo realista €440 (com o cartão) a €800 (com seguro da locadora).\n7. **Museus (17/09):** Kilmainham Gaol `daySoldOut` em **todas** as datas liberadas (17/09–15/10), sem venda no portão, sem revenda; só devoluções online 09:15–09:30. Magazine Fort: bloco de outubro publicado e esgotado (12 lugares/dia; truque para checar data a data sem abrir o site: `https://www.eventbrite.ie/api/v3/destination/series/1997018994571/events/?time_filter=current_future&page_size=50&expand=ticket_availability`). Dias 28/09 e 01/10 reescritos com substitutos grátis e sem reserva.\n8. **Não reservar nada agora (17/09):** decisão dele, e está certa para quase tudo. Exceções listadas na seção 10.\n9. **O último fim de semana (18/09) — a decisão mais recente:** a ida e volta de domingo a Thurles para a final de hurling ficou puxada, e surgiu o convite para um **churrasco na casa dos pais do Richie**. Decidido: **o churrasco é fixo no domingo 11; a final de hurling virou bônus e só acontece se cair no sábado 10**, quando Thurles fica em cima da M8 (Cork → Thurles pela saída 6 Horse and Jockey + N62: 114 km, 81 min; Thurles → Dublin pela saída 5 Twomileborris: 149 km, 112 min; direto 255 km, 182 min — **desvio de +8,5 km, +11 min, €0 de pedágio a mais**). Fatos: as seis últimas finais sênior de Tipperary (2020–2025) foram todas no domingo; três de seis foram para replay ~2 semanas depois (quando ele já estará em casa); a data sai em tipperary.gaa.ie depois das semifinais de 26–27/09. O Hayes Hotel, Liberty Square, Thurles, é o prédio onde a GAA foi fundada em 1/11/1884. Guia completo do churrasco (picanha = \"rump cap\"/\"top sirloin cap\", comprar no sábado, sal grosso e farinha do Brasil, carne e laticínio não entram na UE) em `docs/churrasco-11-10-e-final-hurling-18-09.md`.\n\nCoisas que **saíram** e não voltam: Belfast; segunda-feira na feira de Ballinasloe; mart de Skibbereen (só plano de chuva); GoCar; clube de canto; Temple Bar; qualquer show pago; Storehouse da Guinness (é o Open Gate que vale); Ryan's Daughter em Thurles (fechou 05/2026); Boavista FC (insolvente); \"Slattery's de Rialto\" (não existe — o certo é o Slatt's).\n\n## 9. Telefones e endereços que mais importam\nBalsa de Inishbofin **095 37228** (seg–sex 10–18) / SMS 087 180 0586 · Day's Bar B&B **+353 95 45829** · Lapwing House +353 95 45996 · hostel da ilha +353 95 45855 · Goldie **021 239 8720** · Hayes Hotel, Thurles **0504 22122** · Breen's, Castletownbere 027 70031 · MacCarthy's 027 70014 · 14 Henrietta Street 01 524 0383 · Richmond Barracks 01 524 2532 · Phoenix Park (Magazine Fort) 01 677 0095 · Patriot's Inn 01 679 9595 · Galway Greyhound Stadium 061 448080 · Kilmainham devoluções: kilmainhamgaol.admit-one.eu 09:15–09:30 · Ingresso do hurling: embed.futureticketing.ie/c/tipperary-gaa · Balsa: inishbofinferry.ie · Cliffs: bookings.cliffsofmoher.ie.\n\n## 10. Pendências abertas (em 24/09)\n\nNada reservado. O que **não espera** (estoque): camas em Galway 2–4 e 6–7/10 (semana da feira, região esvazia; Athlone é plano B); cama em Inishbofin 5/10; **a balsa por telefone** (as duas saídas de outubro); camas em Cork 8–9/10 com estacionamento; confirmação das noites de Inchicore 10, 11 e 14/10. O que só existe no Brasil: **carta da Mastercard** e a **PID** (Detran-GO, ~R$207, presencial) — se não fez até hoje, a alternativa é Hertz (sem carta) e torcer no balcão. O carro em si: reservar com pagamento na retirada e cancelamento grátis. Pergunta de gente: **onde moram os pais do Richie** (muda o desenho de 10–11/10 se for na estrada Cork–Dublin). Se quiser: 14 Henrietta Street 30/09 10:00, Goldie 8/10, comprar a carne no sábado 10.\n\nNão faça: obrigar reserva/login para abrir; pôr o Temple Bar; transformar música em programa; gamificação; pedir para ele decidir de novo o que está na seção 6.","plan":"### sex 25/09 (2026-09-25) — Chegada — Leap Card, o bairro e o primeiro pub · base: Dublin · região: dublin · com a Priscila\n- [2026-09-25.0.11-15] 11:15 · Pousar em Dublin — EI0521 e 782 até Heuston (do) — Pousa em Dublin no EI0521. Luas ou Dublin Express 782 até Heuston, e Inchicore é a parada seguinte.\n- [2026-09-25.1.tarde] tarde · Leap Card, despensa e o bairro a pé (do) — Sem heroísmo no dia de fuso: Leap Card, compra de despensa, e o bairro a pé — Tyrconnell Road, Emmet Road, o canal em Suir Road. Se as pernas pedirem, os Jardins do Memorial de Guerra ficam a 20 minutos e fecham só ao anoitecer.\n- [2026-09-25.2.onde-comer] onde comer · Comer: Greenville Deli · jantar no Black Lion (do) — Greenville Deli, 5A Tyrconnell Road, a 200 metros da porta — seg–sáb 08:00–16:00, domingo 09:00–15:00. É deli moderno, não é a caçarola que você queria, mas é o que abre no seu quarteirão. À noite, a cozinha do Black Lion, 207A Emmet Road — pub documentado desde 1734, o mais antigo de Inchicore — serve seg–sex 15:00–21:00, dois pratos por €17.\n- [2026-09-25.3.noite] noite · Slatt's — o primeiro pub (do) — Slatt's, 126A Tyrconnell Park — a uns 150 metros da sua porta. Pub de conjunto habitacional, bar e lounge com entradas separadas que não se comunicam, sem televisão, Guinness €5,40.\n- [2026-09-25.4.rodape] rodapé · Féile Frank Harte — só rodapé (info) — Nesse fim de semana existe o Féile Frank Harte no Teachers' Club (canto tradicional sem instrumento, €25 o concerto avulso). Você já disse que esse formato não é a sua praia — fica aqui só como rodapé.\n\n### sáb 26/09 (2026-09-26) — Festival de História — no seu quarteirão · base: Dublin · região: dublin · com a Priscila, grátis\n- [2026-09-26.0.o-dia] o dia · Festival de História: 3 de 4 esgotados (info) — Dublin Festival of History, 26/09 a 11/10, com o fim de semana de abertura no Richmond Barracks, em Inchicore — dez minutos a pé da sua cama, tudo grátis. ⚠️ Em 17/09 já havia 13 dos 34 eventos do fim de semana esgotados, e dos quatro do Richmond Barracks três estão lotados: sobrou uma oficina de escrita às 15:00 (18+, 15 lugares) — que bate de frente com o Bohemians. Os eventos são grátis mas exigem reserva; não há entrada de última hora. Veja o que sobrou em dublinfestivalofhistory.ie/events.\n- [2026-09-26.1.o-que-salva-o-dia] o que salva o dia · Richmond Barracks: exposição e jardim, grátis (do) — O prédio do Richmond Barracks é entrada livre, sem reserva, seg–sáb 10:00–17:00. Você vê a exposição e o jardim de manhã, sem ingresso nenhum, e o festival passa a ser bônus.\n- [2026-09-26.2.15-00] 15:00 · Bohemians × Bohemians Praha — Dalymount (do) — Bohemians × Bohemians Praha 1905 no Dalymount Park, Phibsborough. Portões 13:00. €20 adulto, €15 estudante/idoso. Assento não numerado e a arquibancada Des Kelly mistura sentado e em pé — chegue cedo se quiser a geral. É um amistoso histórico entre os dois Bohemians.\n- [2026-09-26.3.onde-comer] onde comer · Comer: Loaf Café; Walsh's indo pro Dalymount (do) — No Richmond Barracks eu não consigo confirmar que o café interno ainda funciona (era o “The Mess” — ligue 01 524 2532). O que funciona de verdade e fica a cinco minutos de lá é o Loaf Café, Kilmainham Square, Unit 2, Inchicore Road — todo dia 08:00–16:00, empresa social, comida simples e barata, bem em frente à Kilmainham Gaol (01 516 8294). Indo pro Dalymount: pare em Stoneybatter e coma no Walsh's, 26 Stoneybatter, ou no Frank Ryan's, Queen Street. Compre também o farnel de amanhã: na montanha não há nada.\n- [2026-09-26.4.noite] noite · Old Royal Oak — o snug de 1837 (do) — Old Royal Oak, 11 Kilmainham Lane — uma sala só, snug de verdade com passa-copos, aquecedor a gás dos anos 70, na mesma família desde 1837. Ou o Slatt's. Cedo: amanhã são 25 km.\n\n### dom 27/09 (2026-09-27) — ★ O dia duro — a travessia das montanhas de Dublin · base: Dublin · montanha · região: dublin · grátis, ★\nNota do dia: ⚠️ Nenhuma trilha fechada em Ticknock, Kilmashogue, Tibradden, Cruagh ou Hell Fire em 12/09 (só trechos de mountain bike). A Coillte fecha as florestas em alerta vermelho de vento. A fase A do BusConnects pode mexer na família do 15 neste outono, sem data publicada — confira no TFI Live na semana. O encerramento do Festival of History no Richmond Barracks cai deste domingo; o sábado já te dá o festival.\n- [2026-09-27.0.o-dia] o dia · Travessia das montanhas de Dublin — 25 km (info) — Sugestão do Richie (“Dublin mountains is good”), e ela cabe exatamente aqui: Marlay Park → Fairy Castle (536 m) → Three Rock → Tibradden → Cruagh → Hell Fire Club. ~25 km, ~900 m de subida, 7 a 8 horas, pela Dublin Mountains Way (marcação amarela). Se a Priscila topar, é o programa do dia; se o tempo virar ou as pernas reclamarem, a versão curta volta a Marlay Park depois de Tibradden: ~20 km, ~650 m, 5–6 h.\n- [2026-09-27.1.08-08] 08:08 · Luas Blackhorse → Tallaght, S8 até Marlay Park (do) — Luas vermelha de Blackhorse → Tallaght (21 min), ônibus S8 Tallaght → Marlay Park (08:47 → 09:11). Alternativa: qualquer ônibus até o centro e o 16 da O'Connell St até Marlay Park, ~30 min.\n- [2026-09-27.2.09-15] 09:15 · Marlay → Fairy Castle → Tibradden → Hell Fire (do) — Marlay Park (portão sul) → Kilmashogue Lane → Wicklow Way até a sela de Two Rock → Fairy Castle, o ponto mais alto da travessia · ida e volta a Three Rock (as antenas) · oeste pela DMW sobre Tibradden (o cairn) e desce por Tibradden Wood · atravessa para Cruagh Wood e sai na R116 (sem calçada: colete refletivo) · Hell Fire Club, Montpelier Hill, 383 m · desce pela Killakee Road até Stocking Avenue.\n- [2026-09-27.3.16-45] 16:45 · Ônibus 15B de Stocking Hill → Merrion Square (do) — Volta: 15B em Stocking Hill → Merrion Square (~55 min; 16:47, 17:07, 17:27, 17:47…) ou S8 em Ballyboden St Enda's → Luas de Tallaght. Pôr do sol 19:12.\n- [2026-09-27.4.onde-comer] onde comer · Jantar da recompensa: Walsh's ou Frank Ryan's (do) — Não há nada nos cumes: leve farnel comprado no sábado. Café da manhã no caminho é balcão de Centra em Tallaght ou em Marlay. Na volta, o jantar da recompensa: Walsh's, 26 Stoneybatter ou Frank Ryan's, Queen Street, e o Cobblestone ao lado se as pernas deixarem.\n- [2026-09-27.5.noite] noite · Cobblestone, Smithfield — pela cerveja (do) — Cobblestone, Smithfield — sessão às 19:00 e 21:30; vá pela cerveja, a música é o fundo. O dia justifica dormir cedo.\n\n### seg 28/09 (2026-09-28) — O único dia inteiro livre — e é o dia que carrega a semana · base: Dublin · região: dublin · €8 + €12\nNota do dia: Esta é a última noite livre até 02/10. O que não couber aqui, não cabe em lugar nenhum da semana.\n- [2026-09-28.0.atencao] atenção · Segunda: IMMA e Chester Beatty fechados (info) — Segunda é o pior dia de museu em Dublin. O IMMA fecha às segundas e o Chester Beatty está fechado até 31/12/2026 por causa da presidência da UE. Os museus nacionais só abrem às 13:00. Mas é o único dia em que a noite é sua, então a noite é que manda aqui.\n- [2026-09-28.1.17-09] 17/09 · Kilmainham Gaol esgotada até 15/10 (info) — A Kilmainham Gaol está esgotada — e não é só o dia 28. Verifiquei o calendário do sistema de vendas: todas as datas liberadas estão lotadas, de 17/09 a 15/10. O calendário marca “daySoldOut”, não “não liberado” — 16/10 em diante é que ainda não abriu. É lotação crônica, não azar do seu dia. Não existe venda no portão, nem revenda (ingresso de terceiro é recusado na entrada).\n- [2026-09-28.2.a-unica-porta] a única porta · Kilmainham: tentar devolução 09:15–09:30 (do) — As devoluções entram online todo dia entre 09:15 e 09:30, hora irlandesa (política publicada no próprio sistema). São ~8 minutos de janela. Tente três manhãs seguidas enquanto estiver em Dublin: 28/09 é a melhor data, mas qualquer manhã de 26/09 a 01/10 serve, já que o Richie quer ir também. kilmainhamgaol.admit-one.eu\n- [2026-09-28.3.08-00-plano-firme] 08:00 · Jardins do Memorial de Guerra às 08:00 (do) — Sem a cadeia, a manhã de segunda é toda grátis e sem reserva: ⭐ Jardins do Memorial de Guerra, Islandbridge, abrem 08:00 de segunda a sexta — Lutyens, fontes de granito, ninguém. ~22 min a pé pela South Circular.\n- [2026-09-28.4.11-00] 11:00 · Tour grátis do Royal Hospital + Bully's Acre (do) — ⭐ Tour grátis dos terrenos do Royal Hospital Kilmainham — guia no local todo dia às 11:00, 13:00 e 15:00 até novembro, sem reserva. Emenda com Bully's Acre, o cemitério de pobre e de cólera fechado em 1832, dentro dos mesmos terrenos, entrada pela avenida oeste. ⚠️ O IMMA fecha às segundas — é só o terreno.\n- [2026-09-28.5.13-00] 13:00 · Museu Nacional no Collins Barracks, 13:00 (do) — Museu Nacional — Artes Decorativas e História, no Collins Barracks. ✅ Grátis, sem reserva, segunda 13:00–17:00 (ter–sáb abre 10:00), parada Museum do Luas. Militar, industrial, social — é o que mais combina com você dos museus nacionais, e é o único grande que nunca esgota.\n- [2026-09-28.6.16-00] 16:00 · Guinness Open Gate Brewery, James's Street (do) — Guinness Open Gate Brewery, 53 James's Street — a cervejaria experimental de verdade, não o Storehouse. ✅ Confirmado: sem reserva, sem couvert, entra quem chega. Segunda 13:00–21:00, última mesa 20:00. ⚠️ Fecha terça E quarta e nunca abre antes das 13:00 — como as quintas são de estágio, hoje é a única chance na viagem inteira (e a segunda 12/10 é o repescão).\n- [2026-09-28.7.onde-comer] onde comer · Comer: Loaf, Mannings, Patriot's Inn, Walsh's (do) — De manhã, ao lado da cadeia: Loaf Café, Kilmainham Square (08:00–16:00, todo dia). No caminho para o Open Gate: ⭐ Mannings Bakery, 39–40 Thomas Street — padaria de trabalho das Liberties, aberta até as 19:00. Se quiser sentar e comer prato: The Patriot's Inn, 760 South Circular Road, ao lado do Royal Hospital, cozinha 12:00–21:30 — ⚠️ o coddle NÃO está no cardápio atual que consegui ler; ligue antes: 01 679 9595. Na noite de Smithfield, jante no Walsh's, 26 Stoneybatter.\n- [2026-09-28.8.19-15] 19:15 · Cobblestone: aula de dança 19:15 e sessão 21:00 (do) — Cobblestone, Smithfield: aula de dança de conjunto para iniciantes, €12 (a de 20:20 é €14). Sem par e sem experiência. Emenda na sessão bilíngue das 21:00, tocada mais devagar, em irlandês. ⚠️ O calendário publicado da aula é 07/10 a 04/11 — confirme em info@louise.ie antes de ir.\n- [2026-09-28.9.plano-b-da-noite] plano B da noite · Plano B da noite: Devitt's, Camden Street (do) — Devitt's, 78 Camden Street Lower — trad no andar de cima de segunda a quinta, das 18:30 até fechar, sem couvert. Cozinha: café da manhã 10:00–12:00, almoço 12:00–14:30, à la carte 14:30–21:00.\n\n### ter 29/09 (2026-09-29) — Manhã leve — o jardim de Lutyens e o Collins Barracks · base: Dublin · manhã · região: dublin · grátis\nNota do dia: ⚠️ Não tente o IMMA agora: o Great Hall e a Capela estão fechados o ano inteiro de 2026 por causa da presidência da UE. E o Ryan's de Parkgate Street só abre às 15:00 de segunda a quarta.\n- [2026-09-29.0.a-regra-do-dia] a regra do dia · Manhã livre das 08:00 às 12:30, estágio depois (info) — Estágio à tarde e à noite. Você tem de 08:00 a ~12:30, e o plano abaixo cabe nisso com folga, sem correr e sem gastar quase nada.\n- [2026-09-29.1.08-00] 08:00 · Jardins do Memorial de Guerra, Islandbridge (do) — ⭐ Jardins do Memorial de Guerra, em Islandbridge — abrem às 08:00 de segunda a sexta, grátis. É a única coisa séria que abre no horário em que a sua manhã começa. Projeto de Edwin Lutyens: fontes de granito, os dois pavilhões de livros e o gramado descendo para o Liffey. Às oito da manhã não tem ninguém. ~22 minutos a pé de Tyrconnell Road pela South Circular.\n- [2026-09-29.2.09-45] 09:45 · Bully's Acre, no Royal Hospital Kilmainham (do) — Volta por Kilmainham. Se quiser esticar dez minutos: ⭐ Bully's Acre, dentro dos terrenos do Royal Hospital, entrada pela avenida oeste. Cemitério de pobre e de cólera, fechado em 1832, provavelmente em cima de um mosteiro do século VII. Grátis, sem bilheteria e sem ninguém.\n- [2026-09-29.3.10-00] 10:00 · Collins Barracks — Museu Nacional, de Luas (do) — Museu Nacional — Collins Barracks. Ter–sáb 10:00–17:00, grátis. Luas de Goldenbridge até a parada Museum, seis paradas, ~11 minutos. Uma hora e meia ali é a dose certa. Você volta pra casa de Luas em 15 minutos.\n- [2026-09-29.4.onde-comer] onde comer · Comer: Loaf Café, Kilmainham Square (do) — ⭐ Loaf Café, Kilmainham Square, Unit 2, Inchicore Road (D08 Y447) — todo dia 08:00–16:00. Fica exatamente entre os jardins e a Luas, é empresa social, prato quente e sanduíche a preço de bairro. Alternativa a 200 m da cama: Greenville Deli, 5A Tyrconnell Road, 08:00. E a resposta honesta sobre o café da manhã de trabalhador em Inchicore: ele hoje é o breakfast roll do balcão quente do Centra ou do Spar da Emmet Road — uns €4, e nenhuma dessas lojas publica horário.\n- [2026-09-29.5.se-nao-quiser-museu] se não quiser museu · Plano B: caminho do Grand Canal até Portobello (do) — O caminho de sirga do Grand Canal, subindo de Suir Road até Portobello e voltando — ~5 km plano, garça, eclusa e nenhuma atração. É a manhã de perna cansada — e depois da travessia de domingo, ela pode ser necessária.\n\n### qua 30/09 (2026-09-30) — ★ Manhã leve — 14 Henrietta Street às 10:00 · base: Dublin · manhã · região: dublin · €12, ★\nNota do dia: ⚠️ Duas armadilhas de quarta-feira: o IMMA só abre 11:30 na quarta, e a Guinness Open Gate fecha terça e quarta. Nenhum dos dois cabe hoje.\n- [2026-09-30.0.o-achado] o achado · 14 Henrietta Street — visita das 10:00 (do) — 14 Henrietta Street abre quarta a domingo, com visitas de hora em hora das 10:00 às 16:00. Uma casa georgiana onde chegaram a morar dezessete famílias, contada pelas pessoas que viveram nela. É o museu mais bem encaixado no seu gosto em Dublin inteira, e não é armadilha nenhuma.\n- [2026-09-30.1.preco] preço · Reservar Henrietta: €12, 75 min, esgota (do) — €12 adulto (€10 concessão), 75 minutos, só com visita guiada e só com reserva — a capacidade é pequena e esgota. Reserve em 14henriettastreet.ticketsolve.com ou 01 524 0383. Chegue 10 minutos antes.\n- [2026-09-30.2.09-05] 09:05 · Luas Suir Road → Four Courts, 09:05 (do) — Luas da Suir Road até Four Courts, ~14 min, e 8 minutos a pé subindo a Bolton Street. Porta a porta são uns 35–40 minutos. Pegue a das 10:00, não a das 11:00 — a das 11:00 termina 12:15 e te deixa sem margem.\n- [2026-09-30.3.11-20] 11:20 · Moore Street Market a pé (do) — A visita termina ~11:15. A 10 minutos a pé está o Moore Street Market, que abre 11:00, de quarta a sábado — o último mercado de rua de Dublin, hoje tomado por quitandeiro e por balcão africano e asiático, e sem uma única barraca de artesanato.\n- [2026-09-30.4.onde-comer] onde comer · Comer: Greenville Deli cedo, Mannings na volta (do) — Café da manhã antes de sair: Greenville Deli, 5A Tyrconnell Road, 08:00, ou o breakfast roll da Emmet Road. Perto do museu: ⭐ Kingfisher, 166–168 Parnell Street — ⚠️ abre ao meio-dia, então só serve se o seu turno começar depois das 13:00; peixe com batata e fritada irlandesa o dia todo. Voltando de Luas, salte em James's e leve alguma coisa da ⭐ Mannings Bakery, 39–40 Thomas Street.\n- [2026-09-30.5.12-00] 12:00 · Luas Jervis/Four Courts → Goldenbridge, 12:25 (do) — Luas de Jervis ou Four Courts direto para Goldenbridge. Em casa 12:25.\n\n### qui 01/10 (2026-10-01) — Manhã leve — o Magazine Fort, que reabriu em julho · base: Dublin · manhã · região: dublin · grátis, ★\nNota do dia: Amanhã cedo você viaja para Galway. Deixe a mala pronta hoje.\n- [2026-10-01.0.17-09] 17/09 · Magazine Fort esgotado (bloco 1–14/10) (info) — O Magazine Fort esgotou. O bloco de 1 a 14 de outubro já foi publicado no Eventbrite e está marcado “Sold out” (o de 15–30/09 também). São 12 lugares por dia numa visita diária — era previsível. O forte de 1735 reabriu em julho depois de décadas em ruína e virou o passeio mais disputado do parque.\n- [2026-10-01.1.se-quiser-insistir] se quiser insistir · Olhar manual no Eventbrite do Magazine Fort (do) — Vale um olhar manual no Eventbrite (eventbrite.ie, “Magazine Fort Guided Tours October 1st–14th”): a página mostra esgotado no nível da série e eu não consegui ler linha por linha, então pode haver uma vaga solta no dia 1. E desistência acontece. Mas não organize a manhã em volta disso.\n- [2026-10-01.2.o-problema] o problema · OPW: blocos de 15 dias e duração não publicada (info) — O OPW publica as datas em blocos de quinze dias. O bloco de outubro deve entrar por volta do dia 25/09. Com 12 lugares e uma visita por dia, isso voa. E a duração não está publicada em lugar nenhum — se for 75 minutos, termina 12:15 e fica apertado contra o seu turno. Ligue 01 677 0095 e pergunte as duas coisas. ⚠️ Ignore a página do heritageireland.ie: ela está desatualizada.\n- [2026-10-01.3.09-20] 09:20 · A pé ao forte pelos Jardins do Memorial (do) — Saia a pé pela South Circular, entre pelo portão de Islandbridge e suba a Military Road — ~30 minutos, e você passa dentro dos Jardins do Memorial de Guerra de novo, que abrem às 08:00. O ponto de encontro é o portão principal do forte.\n- [2026-10-01.4.10-00-o-plano-firme] 10:00 · Richmond Barracks, Inchicore — 10:00 (do) — ⭐ Richmond Barracks, Inchicore — quinta 10:00–17:00, sete minutos a pé da sua cama, entrada livre e sem reserva. Foi ali que os líderes de 1916 foram julgados sumariamente antes de serem fuzilados em Kilmainham — e é a coisa mais próxima da cadeia que você vai conseguir ver. Hoje é biblioteca e centro cultural do município, com jardim. ⚠️ O preço não está publicado em lugar nenhum (tudo indica grátis) e o café “The Mess” não é mencionado no site atual: 01 524 2532.\n- [2026-10-01.5.plano-c] plano C · Plano C: 14 Henrietta St ou Royal Hospital (info) — Volta ao 14 Henrietta Street às 10:00 — a quinta também tem visita de hora em hora. Ou o tour grátis dos terrenos do Royal Hospital Kilmainham, guia no local todo dia às 11:00, 13:00 e 15:00 até novembro.\n- [2026-10-01.6.onde-comer] onde comer · Comer: Phoenix Park Tea Rooms ou Nancy Hands (do) — No parque, os dois cafés abrem 09:30 e são os únicos: Phoenix Park Tea Rooms, na Chesterfield Avenue ao lado do zoológico (prédio vitoriano de 1896, sopa e comida quente, 01 671 9376) e Phoenix Park Café, no Centro de Visitantes em Ashtown (01 255 4445). Descendo pelo portão de Parkgate, Nancy Hands, 30–32 Parkgate Street faz ensopado de carne com Guinness e chowder — ⚠️ mas só a partir das 12:00.\n- [2026-10-01.7.12-15] 12:15 · Volta a Inchicore: bus 25/26, Heuston e Luas (do) — Volta pela Military Road ou de ônibus 25/26 de Parkgate até Heuston, e Luas até Goldenbridge.\n\n### sex 02/10 (2026-10-02) — Dublin → Galway, com a Priscila e o Richie · base: Galway · região: west · com a Priscila e o Richie\n- [2026-10-02.0.09-00] 09:00 · Carro em Dublin e estrada M6 até Galway (do) — Retirada do carro alugado em Dublin — o Richie não tem carro, então vocês alugam um e ele fica com você até segunda 12. Saída pela N4 (sem a M50) → M4 → M6: Galway em ~2h30, pedágios €3,60 + €2,30. Chegando: Spanish Arch, Claddagh, o Long Walk, o Museu da Cidade (grátis). É o fim de semana deles; o programa é o que vocês três combinarem.\n- [2026-10-02.1.19-50] 19:50 · Galgos no Galway Greyhound Stadium (do) — Se topar: galgos no Galway Greyhound Stadium, College Road — sexta é noite de corrida, portões 18:30, €10. ⚠️ Confirme no 061 448080.\n- [2026-10-02.2.noite] noite · Noite: Tigh Neachtain ou Tigh Cóilí (do) — Tigh Neachtain (17 Cross Street) ou Tigh Cóilí (Mainguard Street). Se houver sessão no canto, é fundo.\n- [2026-10-02.3.onde-comer] onde comer · Comer: GBC, a padaria de 1936 (do) — Chegando a Galway: ⭐ GBC — Galway Bakery Company, 7 Williamsgate Street, aberta desde 1936, seg–sáb 08:00–16:30 e domingo 09:00–16:30 (091 563 087). É a última casa de comer velha, simples e sem modinha do centro. ⚠️ O café do andar de cima do McCambridge's fechou: sobrou o deli. Comida em pub: Tigh Neachtain, 17 Cross Street, 11:00–16:00 todos os dias. ⚠️ O Tigh Cóilí e o Crane Bar não servem comida nenhuma. Mas hoje quem escolhe são eles.\n\n### sáb 03/10 (2026-10-03) — Galway com eles · base: Galway · região: west · com a Priscila e o Richie\nNota do dia: Combine hoje as duas coisas do Richie: se ele vai à ilha na segunda (e de carro), e onde moram os pais dele — o churrasco de domingo 11 depende disso.\n- [2026-10-03.0.09-30] 09:30 · Galway Market — ostra aberta na hora (do) — Galway Market, Church Lane, ao lado da igreja de St Nicholas (1320): The Oyster Man abre ostra na hora, Gannet Fishmongers, padarias, quase tudo abaixo de €10.\n- [2026-10-03.1.tarde] tarde · Salthill a pé pela promenade (do) — Salthill a pé pela promenade (chute no muro no fim, como manda a tradição), ou o que eles quiserem mostrar — eles conhecem Galway melhor que qualquer lista.\n- [2026-10-03.2.21-00] 21:00 · Áras na nGael — sessão de sábado (do) — Áras na nGael, 45 Dominick Street — clube em língua irlandesa atrás de um arco de pedra, sessão de sábado, 25 anos de casa e zero turista. Pergunte ao Richie se ele topa: é o tipo de sala que ele conhece.\n- [2026-10-03.3.onde-comer] onde comer · Comer: Galway Market, ostra e farnel da ilha (do) — ⭐ Galway Market, Church Lane, sábado 08:00–18:00, quase tudo abaixo de €10: The Oyster Man abre ostra na hora, Gannet Fishmongers, Coolfin Organic Bakery. A ostra nativa está no auge em outubro: McSwiggans, 3 Eyre Street, €19,50 a meia dúzia. Barato: Handsome Burger (49 Dominick St Lower, €10,50) e Xian Street Food (7 Quay St, spice bag €8,75). Compre hoje o farnel de segunda: na ilha só há o Day's Bar.\n\n### dom 04/10 (2026-10-04) — ★ Ballinasloe — o dia solitário na feira · base: Galway → Ballinasloe · região: west · grátis, ★\nNota do dia: Se na véspera, ouvindo o Richie pessoalmente, você mudar de ideia: o domingo vira Galway com calma — mercado de domingo, Salthill, e a mala pronta para a ilha.\n- [2026-10-04.0.por-que] por quê · Por que a feira, sozinho (info) — A Priscila e o Richie voltam para Dublin hoje, e não recomendam a feira: para o irlandês de classe média ela é “unusual” — é um encontro de Travellers, com fama de áspera. Você escolheu ir mesmo assim, sozinho, porque é exatamente a coisa que você chamou de bagaceira: a feira de cavalos mais antiga da Europa, 80 mil pessoas numa vila de 6.600, negócio em dinheiro com aperto de mão. Vá de dia, respeite as regras, e volte antes do escurecer.\n- [2026-10-04.1.10-00] 10:00 · Citylink 763 Galway → Ballinasloe (do) — Citylink 763 do Galway Coach Station → Ballinasloe, 60 minutos exatos. Há também trem (41–46 min). Deixe o carro em Galway: as ruas da vila fecham de sábado 20:00 a segunda 21:00, o estacionamento oficial é no arrabalde, e dia de feira é dia de pinta.\n- [2026-10-04.2.11-30] 11:30 · Fair Green — cavalos na rua Society (do) — Fair Green, rua Society. Cavalos, pôneis, jennets, burros, cavalos de tração — negociados sem leiloeiro e sem ringue. Fique no meio, não na beira, e não comente preço.\n- [2026-10-04.3.o-dia] o dia · Misleór — a porta respeitosa da feira (info) — O Misleór — festival de culturas nômades dirigido pelo Galway Traveller Movement — leva programação à feira. É a porta de entrada respeitosa.\n- [2026-10-04.4.richie] Richie · Richie: \"Don't say travellers!\" (info) — “Don't say travellers!” — a palavra não sai da sua boca no Fair Green, nem para elogiar, nem para perguntar. Etiqueta completa na seção 09. E sobre segurança, o veredito dele: “Grand. Nobody will bother him.”\n- [2026-10-04.5.16-25] 16:25 · Citylink 16:25 de volta; Tigh Neachtain (do) — Citylink de volta (16:25 ou 18:25 → Galway em 60 min). A noite da feira fica para quem é de lá. Em Galway, Tigh Neachtain e cama cedo: amanhã a balsa é às 11:30.\n- [2026-10-04.6.onde-comer] onde comer · Comer: Gibbons' Pillar House ou Gullane's (do) — ⚠️ Domingo mata os cafés de Ballinasloe — o Bread Basket e o Kariba's fecham os dois. Sobram dois endereços: ⭐ Gibbons' Pillar House, 8 Society Street — a rua do Fair Green — comida das 09:00 às 21:00, sete dias (090 964 3939); e o Gullane's Hotel, Main Street, carvery 12:00–16:30, sem reserva (090 964 2220). Na feira em si: peixe com batata e sonho açucarado frito na hora. ⚠️ O Hayden's Hotel fechou. Ninguém em Ballinasloe publica preço.\n\n### seg 05/10 (2026-10-05) — ★ Inishbofin — a noite na ilha sem luz na rua · base: Galway → Cleggan → Inishbofin · região: west · ~€25 + cama, ★\nNota do dia: ⚠️ Se a balsa de outubro tiver só a saída das 18:45, o dia inverte: Galway com calma, saída 16:30, balsa 18:45 → 19:15, jantar no Day's. Isso se resolve no telefonema desta semana.\n- [2026-10-05.0.o-dia] o dia · Inishbofin: a ilha favorita do Richie (info) — “My favourite place in the country” (Richie). “Uma grande fazenda em forma de ilha, bem simples, à noite não tem iluminação na rua, tudo bem local. Ou gosta ou odeia” (Priscila). Pelo que você me disse sobre o que gosta, você gosta. ~200 moradores, um pub, penhascos, focas, e o forte de Cromwell na boca do porto. O Richie pode ir junto — de segunda para terça é o plano dele.\n- [2026-10-05.1.09-00] 09:00 · Carro: Galway → Cleggan pela N59, 1h45 (do) — O carro alugado, Galway → N59 (Oughterard, Clifden) → cais de Cleggan: 89 km, ~1h45. Estacionamento privado na entrada da vila, ~€4/dia (pernoite cobrado por dia; não deixe no cais). Sem o aluguel, o plano B era um GoCar de dois dias (~€165).\n- [2026-10-05.2.11-30] 11:30 · Balsa Cleggan 11:30 → Inishbofin, €25 (do) — Balsa Island Discovery, Cleggan 11:30 → Inishbofin 12:00. €25 ida e volta. ⚠️ A saída das 11:30 de outubro ainda não está no sistema online (só a das 18:45): reserve por telefone, 095 37228, seg–sex 10:00–18:00, ou SMS 087 180 0586 — e pergunte também pela balsa das 09:00 de terça, que é a que salva Ballybrit.\n- [2026-10-05.3.tarde] tarde · Westquarter Loop: 8 km, penhascos e focas (do) — Westquarter Loop: 8,1 km, 80 m de subida, 2 a 2,5 h, começa e termina no New Pier, setas roxas — penhascos, a praia de Trá Gheal, focas. Depois o porto, Cromwell's Barracks visto do cais, e nada mais: é uma ilha de ficar.\n- [2026-10-05.4.onde-comer] onde comer · Jantar: Day's Bar, lagosta e cavala da ilha (do) — ⭐ The Beach — Day's Bar & B&B: o pub da ilha, comida até tarde, lagosta, caranguejo, cavala e pollock pescados ali. Jante e durma no mesmo lugar.\n- [2026-10-05.5.dormir] dormir · Dormir: Day's Bar & B&B, 4 quartos (do) — Day's Bar & B&B (The Beach), 4 quartos, +353 95 45829, info@thebeach.ie — preço não publicado, reserve por telefone. Alternativas: Lapwing House B&B (aberto o ano todo, +353 95 45996) e o Inishbofin Island Hostel (quarto privado €70, cama em dormitório €25, +353 95 45855). ⚠️ O Doonmore fechou a temporada em 27/09 e o Inishbofin House Hotel não abre reservas para outubro.\n\n### ter 06/10 (2026-10-06) — Balsa das 09:00 → Ballybrit às 14:20 · base: Inishbofin → Galway · região: west · ~€15, ★\nNota do dia: ⚠️ Tudo depende de a balsa das 09:00 rodar em outubro. Se só houver a das 17:00, Ballybrit cai e a terça vira o segundo dia na ilha — o que, pelo que a Priscila descreveu, não é castigo nenhum.\n- [2026-10-06.0.09-00] 09:00 · Balsa 09:00 para Cleggan e volta a Galway (do) — Balsa Inishbofin → Cleggan 09:00 → 09:30. Se der tempo e vontade, a Sky Road (8 km até Clifden + o circuito de 16 km, 45 minutos) antes da N59. Galway por volta das 11:30–12:00; carro estacionado na hospedagem.\n- [2026-10-06.1.12-30] 12:30 · Ônibus 409 de Eyre Square até Ballybrit (do) — Ônibus 409 de Eyre Square → Ballybrit Crescent, 17 min, de 10 em 10 minutos, ou o shuttle de €8 do Skeff. Ballybrit tem estacionamento grátis, mas quem estaciona não bebe. Portões 12:30.\n- [2026-10-06.2.14-20] 14:20 · Galway Races em Ballybrit — 7 páreos (do) — Galway Races, card de obstáculos — 7 páreos, último às 17:20, ~€15. Não há ônibus especial em outubro — sinal de que a multidão de turista não vem. Richie: “Ballybrit on a Tuesday.”\n- [2026-10-06.3.noite] noite · Crane Bar, Sea Road — a pinta da noite (do) — The Crane Bar, Sea Road, andar de cima: se houver sessão, é o fundo da sua cerveja. Ou o Tigh Cóilí.\n- [2026-10-06.4.onde-comer] onde comer · Comer: GBC antes, Dela ou Rúibín depois (do) — Café da manhã no B&B da ilha, e a balsa das 09:00. Em Galway, antes de Ballybrit: GBC, Williamsgate Street (08:00–16:30) ou Tigh Neachtain (11:00–16:00) — dentro do hipódromo é bancada cara e fila. Depois da corrida, o Crane Bar não serve comida: jante antes no Dela (51 Dominick St Lower) ou no Rúibín (1 Dock Road, seg–sáb 12:00–23:00).\n\n### qua 07/10 (2026-10-07) — ★ Cliffs of Moher pela costa do Burren — de carro, ou de ônibus · base: Galway → Burren → Doolin → Cliffs → Galway · região: west · ~€27, ★\nNota do dia: Se a sessão de Doolin te tentar: o 18:33 → 20:13 e o 20:10 → 21:42 ainda te trazem de volta. Mas o 51 para Cork sai cedo na quinta.\n- [2026-10-07.0.por-que] por quê · Por que os Cliffs — e a estrada do Burren (info) — A Priscila recomendou (“lindíssimo”), e pela sua régua é o caso clássico do turístico que entrega: 214 metros de falésia caindo no Atlântico. Com o carro alugado, o dia vira a estrada do Burren: Kinvara (castelo de Dunguaire), Ballyvaughan, o farol de Black Head, Fanore, Doolin, os Cliffs (estacionamento incluído no ingresso), Lisdoonvarna e volta — ~200 km de calcário, mar e nenhuma cidade. Chegue nos Cliffs antes das 11:00: ingresso a €8 e falésia vazia. O ônibus 350 abaixo continua valendo se você preferir não dirigir.\n- [2026-10-07.1.07-00] 07:00 · Bus 350 — Galway Bus Station 07:00 (do) — Bus Éireann 350 sai do Galway BUS STATION, ao lado da estação Ceannt — não do Coach Station. 07:00 → Doolin 08:40 → Cliffs 08:54. €9,45 com Leap/TFI Go (€13,50 em dinheiro). Ir cedo é a jogada: às nove da manhã as falésias são suas; a partir das onze chegam os ônibus de tour. Alternativa: 09:00 → 10:58.\n- [2026-10-07.2.09-00] 09:00 · Cliffs of Moher — torre O'Brien, antes das 11 (do) — Cliffs of Moher Experience, outubro 08:00–19:00. Ingresso online: €8 no horário da manhã (08–11), €12 no pico (11–16), €15 na porta. Torre O'Brien e 800 m de trilha pavimentada. ⚠️ A trilha costeira de Doolin até os Cliffs está fechada (só o trecho Doolin → Surfers Path abre) — não dá para entrar a pé por fora.\n- [2026-10-07.3.10-48] 10:48 · Doolin: o porto e os três pubs (do) — Ônibus Cliffs → Doolin 10:59 (€2,60), ou o 12:05. Doolin é a vila dos pubs de sessão: Gus O'Connor's (Fisher St, 065 707 4168), McGann's (Roadford, 065 707 4133) e McDermott's (Roadford, comida 11:45–21:00). Sessão só à noite em outubro — de dia é almoço, pinta e o porto.\n- [2026-10-07.4.onde-comer] onde comer · Almoço: chowder num pub de Doolin (do) — Almoço num dos três pubs de Doolin — chowder, peixe do dia, Guinness stew — todos servem o dia inteiro. No centro de visitantes dos Cliffs há café, mas é a comida de balcão de armadilha; coma em Doolin. À noite, a última de Galway: Tigh Neachtain.\n- [2026-10-07.5.14-21] 14:21 · Volta a Galway 14:21 e a última noite (do) — Volta: Doolin → Galway 14:21 → 16:14, ou 16:08 → 18:02 (o último é 23:15 → 00:50). Noite de despedida de Galway e mala pronta: amanhã o ônibus para Cork sai cedo.\n\n### qui 08/10 (2026-10-08) — Galway → Cork. Mercado, o jantar do Goldie e noite de pub · base: Cork · região: cork · ~€60 o jantar\n- [2026-10-08.0.manha] manhã · De carro: Galway → Cork pela M18/M20 (do) — De carro: Galway → Cork pela M18/M20 em ~2h45 (túnel de Limerick €2,30), chegando para o almoço com meio dia a mais de Cork. Sem carro seria o Bus Éireann 51, direto, 4h a 4h30. Estacionamento noturno em Cork: pergunte à hospedagem — o centro cobra €10–20 a noite.\n- [2026-10-08.1.13-00] 13:00 · English Market e almoço no Farmgate (do) — English Market (seg–sáb 08:00–18:00) e o Coal Quay. Almoço no Farmgate, dentro do mercado, no mezanino — a última porta do país que serve tripe and drisheen.\n- [2026-10-08.2.19-30] 19:30 · Jantar: Goldie — reserve 021 239 8720 (do) — ⭐ Goldie, 128 Oliver Plunkett Street — o único jantar caro da viagem, movido para hoje porque o sábado agora é em Dublin. 28 lugares, qua–sáb, reserve: 021 239 8720. Aishling Moore, peixe de barco de um dia de Ballycotton, principais €23–35. O Richie, sem saber da lista, escolheu o mesmo.\n- [2026-10-08.3.noite] noite · Sin É e o Welcome Inn, sem programa (do) — Depois do jantar, pub sem programa: Sin É, rua Coburg 8 (sessão rolando no canto até meia-noite na semana do festival) e o Welcome Inn, Parnell Place 24, de 1845, o último early house da Irlanda.\n- [2026-10-08.4.onde-comer] onde comer · Comer: Farmgate, Goldie e o Long Valley (do) — Almoço dentro do English Market: ⭐ Farmgate Café, no mezanino — a última porta do país que serve tripe and drisheen (ter–sex 09:00–15:30; 021 427 8134). Para levar: A. O'Reilly's, o último fabricante de drisheen da Irlanda, €2 a porção. Jantar: Goldie, reservado. Antes do Sin É, se sobrar fome: ⭐ The Long Valley, 10 Winthrop Street (todo dia 10:00–00:30), o doorstep sandwich de spiced beef.\n\n### sex 09/10 (2026-10-09) — ★ O dia de carro — Beara, o Healy Pass e o caranguejo de Castletownbere · base: Cork → Beara → Cork · região: cork · ~€135, ★\nNota do dia: ⚠️ Saída às 08:00 é obrigatória: são 4h30 de estrada estreita, o sol se põe às 19:00 em Castletownbere, e os galgos não esperam. Plano de chuva: ônibus 237 às 09:00, mart de Skibbereen às 11:00 (sentado no fundo, almoço no restaurante do mart) e os mesmos galgos à noite.\n- [2026-10-09.0.por-que] por quê · Por que Beara: o Richie e o caranguejo (info) — O Richie disse duas coisas: “leave the men to it” sobre o mart, e “some of the best crab/shellfish in the country” sobre Castletownbere. O mart saiu, e a sexta virou o dia de natureza de Cork — pela península de Beara, com o almoço de marisco no meio. Sobre os galgos, o Richie: “pode ser legal, principalmente porque é na sexta”.\n- [2026-10-09.1.08-00] 08:00 · Carro: Cork → Glengarriff → Castletownbere (do) — O carro alugado (sem ele seria um GoCar da estação Kent, ~€125). Cork → N22 → Macroom → R584 por Ballingeary e o Pass of Keimaneigh → Glengarriff (93 km) → R572 pela costa da baía de Bantry → Castletownbere (34 km). Chegada ~11:00: o segundo maior porto pesqueiro de peixe branco da Irlanda, e ainda porto de trabalho.\n- [2026-10-09.2.onde-comer] onde comer · Almoço: Breen's Lobster Bar, caranguejo (do) — ⭐ Breen's Lobster Bar, The Square — peixe e marisco desembarcados ali: sanduíche aberto de caranguejo, gratinado de caranguejo, salada de caranguejo. Sex 12:00–17:00 e 17:30–21:30 (horário de fonte não oficial: 027 70031). ⭐ MacCarthy's Bar, The Square — bar que ainda é mercearia, das irmãs MacCarthy, seg–sáb 09:30–23:30 (027 70014); o sanduíche de caranguejo é lenda de guia, confirme no balcão e leve dinheiro. Lynch's on the Pier para peixe com batata.\n- [2026-10-09.3.13-30] 13:30 · Healy Pass, Lauragh, Kenmare e volta a Cork (do) — Healy Pass (R574): 27 km de Castletownbere até o topo pela estrada em ziguezague mais bonita do sul da Irlanda, na divisa de Cork com Kerry. Desce para Lauragh, segue por Kenmare (25 km; parada de café) e volta a Cork por Kilgarvan e a N22 (97 km). Total: ~280 km, 4h30 de direção pura — conte 5h30 a 6h com paradas.\n- [2026-10-09.4.18-30] 18:30 · Deixar o carro e pegar o 205/208/219 (do) — Carro de volta ao estacionamento da hospedagem. Ônibus 205/208/219 sentido MTU/Bishopstown — para os galgos não se dirige.\n- [2026-10-09.5.19-35] 19:35 · Galgos em Curraheen Park, €10 (do) — Galgos em Curraheen Park, €10 — portões 18:30, 1º páreo 19:35. Richie: “which would you actually bring a foreign mate to? The dogs.” Tote na mão, aposta mínima, arquibancada coberta. Cama cedo: o trem de amanhã é às 07:00.\n\n### sáb 10/10 (2026-10-10) — Cork → Dublin, e o quintal deles · base: Cork → Dublin · região: cork · com eles\nNota do dia: Se você for comprar a carne do churrasco, hoje é o dia: os açougues de Dublin abrem no sábado de manhã e domingo fecha tudo.\n- [2026-10-10.0.07-30] 07:30 · Cork → Dublin de carro pela M8/M7, ~2h45 (do) — Cork → Dublin pela M8/M7, ~2h45, pedágios €2,30 + €2,30; em Dublin às 10:30. É este carro que faz o dia deles acontecer: o Richie não tem carro, e Wicklow sem carro não existe.\n- [2026-10-10.1.o-dia] o dia · Howth ou Wicklow com a Priscila e o Richie (do) — Com a Priscila e o Richie, no carro, o que eles propuseram: Howth (a trilha dos penhascos é um loop de 7,8 km, ~2 h, e o peixe do porto), ou Wicklow: o Guinness Lake (Lough Tay) é privado e sem acesso — o mirante autorizado é o do J.B. Malone, em Ballinastoe Woods, na R759 — e daí o Sally Gap. ⚠️ A trilha de Bray a Greystones continua fechada (Câmara de Wicklow, 02/09/2026): se for Bray, é o loop do Bray Head.\n- [2026-10-10.2.se-a-final-cair-hoje] se a final cair hoje · Se a final for hoje: Thurles na estrada (info) — Este é o único dia que a final pode tomar sem quebrar nada — e ela nem custa desvio: Thurles fica praticamente em cima da estrada. Vira: sai de Cork às 09:00, M8 até a saída 6 (Horse and Jockey), N62 até Thurles — 114 km, 81 min, €2,30; almoço no Hayes Hotel; final intermediária ~12:30 e a sênior ~15:45; e às 17:30 você retoma a viagem, saída 5 (Twomileborris) sentido norte, 149 km, 112 min, €2,30, chegando a Dublin ~19:45. Total do desvio: +8,5 km, +11 minutos e €0 de pedágio a mais. Quem perde o dia é Wicklow, não o churrasco.\n- [2026-10-10.3.onde-comer] onde comer · Almoço: Beshoff Bros ou Bloody Stream, Howth (do) — Em Howth: Beshoff Bros, Harbour Road — este é o Beshoff certo, não o da O'Connell Street — e o The Bloody Stream, o pub dentro do prédio da estação; o mercado de Howth roda no fim de semana. Em Wicklow, eles escolhem: é o quintal deles. Se o dia virar Thurles: almoço no Hayes Hotel, Liberty Square (0504 22122) — em dia de jogo servem carvery do meio-dia às 21:30.\n- [2026-10-10.4.noite] noite · Cama em Inchicore e a última no Slatt's (do) — Dublin. Cama em Inchicore — ⚠️ confirme com quem te hospeda que o quarto vale sábado e domingo. Última no Slatt's, que a essa altura já é o seu pub.\n\n### dom 11/10 (2026-10-11) — ★ Churrasco na casa dos pais do Richie · base: Dublin · região: dublin · ★ o ponto alto\nNota do dia: Se sobrar noite e você ainda quiser uma última irlandesa de verdade: Old Royal Oak, Kilmainham Lane, uma sala só, na mesma família desde 1837. Amanhã a mala vai para o Porto.\n- [2026-10-11.0.o-dia] o dia · Churrasco na casa dos pais do Richie (info) — O último dia irlandês inteiro, e o mais bem encaixado no que você veio buscar. Desde a primeira mensagem você disse que queria conhecer pessoas e lugares de verdade, estudando como respeitá-los. Um churrasco no quintal de uma família irlandesa, convidado por um amigo, é isso — e não é uma coisa que se compra ingresso. Sem dirigir, sem trem, sem horário.\n- [2026-10-11.1.confirmar] confirmar · Confirmar onde moram os pais do Richie (info) — Onde moram os pais do Richie? Eu montei o dia supondo Dublin ou arredores. Se for na estrada entre Cork e Dublin (Tipperary, Laois, Kildare), o churrasco pode virar a parada de sábado e o desenho fica ainda melhor — me diga e eu refaço. Se for no oeste, a gente conversa, porque aí ele brigaria com a semana de Galway.\n- [2026-10-11.2.a-oferta] a oferta · Oferecer-se para assar a carne (do) — Ofereça fazer a carne. Churrasco irlandês é hambúrguer e salsicha na grelha; churrasco brasileiro é peça inteira, sal e tempo. Oferecer-se para assar é o melhor movimento social disponível na viagem inteira — e é a única coisa que você sabe fazer que ninguém ali sabe. Pergunte ao Richie antes: em casa de irlandês, quem manda na grelha é o pai.\n- [2026-10-11.3.a-picanha] a picanha · Comprar a picanha no sábado (rump cap) (do) — Existe na Irlanda, mas não com esse nome no balcão: peça “picanha” e, se não entenderem, “rump cap” ou “top sirloin cap” — açougue bom corta, supermercado não tem. Compre no sábado, em Dublin, ou encomende na quinta no English Market de Cork (Tom Durcan, Coughlan's, O'Mahony) e traga na geladeira de isopor — você está de carro. ⚠️ Peça para não tirar a capa de gordura: é o corte inteiro que importa.\n- [2026-10-11.4.o-que-cabe-na-mala] o que cabe na mala · Mala: sal grosso, farinha, cachaça (info) — Duas coisas que a Irlanda não tem e pesam nada: sal grosso (o flocado de supermercado não serve) e farinha para farofa. Uma garrafa de cachaça cabe na franquia de 1 litro de destilado da UE, e limão e gelo se acham em qualquer Tesco. ⚠️ Carne e laticínio do Brasil são proibidos de entrar na UE — nada de linguiça e nada de queijo na mala, é confisco na alfândega.\n- [2026-10-11.5.o-tempo] o tempo · O tempo: ~13 °C e chuva, churrasco segue (info) — Meados de outubro em Dublin: máxima de ~13 °C e chuva provável. Isso não cancela churrasco irlandês — eles assam debaixo de gazebo o ano inteiro, de casaco, e acham normal. Leve casaco e não comente o clima: comentar o clima é o esporte nacional e você não vai ganhar.\n- [2026-10-11.6.o-que-levar] o que levar · Levar cerveja e algo brasileiro (do) — Cerveja para a casa é obrigação, não gentileza. Some algo brasileiro — cachaça, ou o próprio sal grosso como presente do churrasqueiro. E leve o nome certo: não é “barbecue”, é churrasco, e vale explicar a diferença enquanto assa.\n- [2026-10-11.7.e-a-final] e a final · A final de hurling cai se for domingo (info) — Se a final ficar no domingo — que é o provável —, ela cai. Não dá para estar em Thurles e no quintal ao mesmo tempo, e o churrasco ganha. O histórico está na seção 11; a decisão sai em 30/09.\n- [2026-10-11.8.onde-comer] onde comer · Comer: o churrasco no quintal (do) — O churrasco é a comida do dia — o que importa é o que você leva. A carne compra-se no sábado (domingo fecha tudo): açougue de Dublin, pedindo picanha / rump cap / top sirloin cap, com a capa de gordura inteira; ou encomendada na quinta no English Market de Cork (Tom Durcan, Coughlan's, O'Mahony) e trazida na geladeira de isopor, já que você está de carro. Sal grosso e farinha de mandioca vêm do Brasil — não existem lá no formato certo e pesam nada. ⚠️ Carne e laticínio do Brasil não entram na UE. Cerveja para a casa é obrigação. Se a final tomar o sábado, o almoço daquele dia é o Hayes Hotel, Liberty Square, Thurles (0504 22122), que em dia de jogo serve do meio-dia às 21:30.\n\n### seg 12/10 (2026-10-12) — Manhã em Dublin, carro devolvido, Porto à noite · base: Dublin → Porto · região: porto · €60,99 pago\n- [2026-10-12.10.manha] manhã · Open Gate Brewery — repescão 13:00–15:30 (do) — Manhã livre em Inchicore, sem trem nenhum para pegar. Se a segunda 28 tiver falhado por qualquer motivo, hoje é a segunda chance da Guinness Open Gate Brewery (segunda 13:00–21:00, 53 James's Street) — de 13:00 às 15:30 cabe.\n- [2026-10-12.11.onde-comer] onde comer · Comer: Mannings Bakery ou Kingfisher (do) — Mannings Bakery, 39–40 Thomas Street para a última padaria das Liberties, ou o Kingfisher da Parnell Street se estiver no centro. No aeroporto, coma antes de embarcar: a bordo da Ryanair não há nada que valha o preço.\n- [2026-10-12.12.15-30] 15:30 · Devolver o carro — Eastlands, aeroporto (do) — Devolução do carro no Eastlands Car Hire Facility do aeroporto (de Inchicore pela M50, €3,80 — o único pedágio da M50 da viagem). Tanque cheio. Shuttle grátis do pátio ao T1, ~5 min, a cada ~20 min. No T1 às 16:30, três horas antes; o portão da Ryanair fecha 19:05. Sem carro seria Luas + 782 de Heuston.\n- [2026-10-12.13.19-35] 19:35 · Voar FR7072 Dublin → Porto (do) — FR7072 Dublin → Porto, pousa 22:00. Jante tarde: Cufra na Boavista ou Capa Negra II, que servem de madrugada.\n- [2026-10-12.0.22-00] 22:00 · Pousar no Porto — metrô E até Trindade (do) — FR7072 pousa. Metrô linha E (violeta) até Trindade, ~30 min. Compre o Andante na máquina.\n- [2026-10-12.1.onde-comer] onde comer · Jantar: Cufra ou Capa Negra II (do) — Cozinha aberta de madrugada: Cufra, Av. da Boavista 2504 — o clássico portuense da madrugada, família, taxista, pedido às duas da manhã. Ou Capa Negra II, Rua do Campo Alegre 191, que é onde o lado universitário da cidade come francesinha.\n- [2026-10-12.2.nota] nota · Tascas fecham a cozinha às 22:00 (info) — Quase toda tasca fecha a cozinha às 22:00. Na noite de chegada é cervejaria ou nada.\n\n### ter 13/10 (2026-10-13) — O dia inteiro — o único · base: Porto · região: porto · ★ o dia cheio\nNota do dia: Boavista acabou de verdade: insolvência, queda até as distritais e ordem judicial de julho de 2026 para cessar atividade. Não existe jogo no Bessa.\n- [2026-10-13.0.09-00] 09:00 · Mercado do Bolhão — o térreo, cedo (do) — Mercado do Bolhão (fecha domingo, hoje abre). Vá cedo: o piso térreo ainda é banca de verdade com vendedor de verdade. Ao meio-dia o anel de cima vira praça de alimentação para turista.\n- [2026-10-13.1.11-00] 11:00 · Metrô A até o Mercado de Matosinhos (do) — Metrô linha A até Matosinhos. Mercado Municipal de Matosinhos — esse é o mercado que não virou nada. Peixe e hortaliça, sem concessão.\n- [2026-10-13.2.onde-comer] onde comer · Almoço: Rua Heróis de França (Salta o Muro) (do) — ⭐ Rua Heróis de França, a 200 metros do mercado de Matosinhos: uma rua inteira de grelhados onde o peixe foi comprado no mercado de manhã. Salta o Muro (nº 386) é o clássico barato; O Gaveto é a ponta cara. Almoço, não jantar. À noite, se não houver jogo: Casa Aleixo, Rua da Estação 216, ao lado da estação de Campanhã — a casa de tripas à moda do Porto que os portuenses citam (reserve). Barato e sem verniz: Bufete Fase, Rua de Santa Catarina 1147 — balcão apertado, sem cardápio em inglês, só dinheiro, e uma francesinha que muito portuense põe acima do Santiago.\n- [2026-10-13.3.16-00] 16:00 · Casa da Guitarra — guitarra portuguesa (do) — Casa da Guitarra, Av. Vímara Peres 49 — loja de guitarras que faz recitais pequenos de guitarra portuguesa. O Porto não é cidade de fado — quase tudo vendido como fado ali é jantar-espetáculo com fadista de Lisboa em rodízio.\n- [2026-10-13.4.noite] noite · Champions no Dragão — se o Porto jogar em casa (do) — Verifique se o FC Porto joga em casa. A 2ª rodada da fase de liga da Champions é 13 e 14 de outubro e o Porto está na competição. Se for dia 13 no Dragão, é a melhor noite disponível. Ingressos em bilhetes.fcporto.pt.\n- [2026-10-13.5.beber] beber · Café Piolho e Catraio — cerveja de verdade (do) — Café Piolho (Praça Parada Leitão 45, de 1909, mesa de mármore e cadeira de plástico) e Catraio na Rua de Cedofeita 256 para cerveja portuguesa de verdade.\n\n### qua 14/10 (2026-10-14) — Meio dia de Porto e o avião · base: Porto → Dublin · região: porto · €66,99 pago\n- [2026-10-14.0.08-30] 08:30 · Café com cheirinho no Café Progresso (do) — Café com cheirinho — a bica com um dedo de aguardente, ao balcão, entre 8 e 10 da manhã. É a bagaceira portuguesa literal. Café Progresso, Rua Actor João Guedes 5, o mais antigo do Porto ainda em funcionamento, ou a Confeitaria do Bolhão (1896).\n- [2026-10-14.1.11-00] 11:00 · Afurada pela balsa Flor do Gás (do) — Afurada, em Gaia — vila de pescadores que sobreviveu dentro da área metropolitana, com o lavadouro público ainda em uso. Vá pela balsa Flor do Gás. Sardinha na calçada.\n- [2026-10-14.2.onde-comer] onde comer · Almoço: bifana no Conga ou pernil na Casa Guedes (do) — Almoço rápido e barato antes do aeroporto: Conga (Rua do Bonjardim 314) para a bifana com molho, em pé, desde 1976; ou Casa Guedes na Praça dos Poveiros para a sande de pernil com queijo da Serra — a sala antiga, não o rooftop ao lado. Os dois saem por menos de €6.\n- [2026-10-14.3.15-30] 15:30 · Metrô linha E até o aeroporto (do) — Sai do centro. Metrô linha E até o aeroporto, ~30 min. O portão da Ryanair fecha 30 minutos antes.\n- [2026-10-14.4.17-55] 17:55 · Voar FR7079 Porto → Dublin 20:20 (do) — FR7079 → Dublin 20:20. A partir daqui, seção 08.\n\n### qui 15/10 (2026-10-15) — De Inchicore ao portão · base: Dublin → casa · região: dublin · €10\nNota do dia: O check-in da Air France fecha às 08:35. Confira o horário do 782 no app na noite anterior — as fontes divergem em ~7 minutos.\n- [2026-10-15.0.sai] 04:50 · Sair a pé de Tyrconnell Road até Heuston (do) — Sai de Tyrconnell Road a pé — 28 a 32 minutos plano até Heuston pela South Circular → Con Colbert Road → ponte Sean Heuston. Alternativa: FreeNow agendado na véspera para 05:05 (~€10–13) e você sai às 05:00.\n- [2026-10-15.1.coach] 05:35 · Dublin Express 782: Heuston → Terminal 1 (do) — Dublin Express 782, Heuston 05:35 → Terminal 1 às 06:21. €10, mais barato no app. Se perder, o seguinte é 06:05 → 06:57 e ainda sobram 1h38.\n- [2026-10-15.2.ckin] 06:35 · Check-in Air France no T1 e café (do) — Check-in da Air France no T1. Fecha 08:35. Café no terminal, e o guarda-volumes só abre às 05:00 — não conte com ele.\n- [2026-10-15.3.voo] 09:15 · Voo AF1617 Dublin → Paris → Rio → Goiânia (do) — AF1617 Dublin → Paris, e daí Rio e Goiânia. Fim da viagem.","doubts":"1. Os museus de Dublin — verificado em 17/09 — Kilmainham Gaol: esgotada em 100% das datas liberadas (17/09 a 15/10). O calendário do sistema distingue “esgotado” de “não liberado”, e tudo dentro da janela de 28 dias está esgotado — então não é o seu dia, é a atração. Sem venda no portão, sem revenda. Única porta: devoluções online 09:15–09:30. Magazine Fort: bloco de outubro publicado e esgotado (12 lugares/dia). ⚠️ Não consegui ler o Eventbrite linha por linha — pode haver vaga solta no dia 1; vale um olhar manual. Dublin Festival of History: 13 de 34 eventos do fim de semana já esgotados, e três dos quatro do Richmond Barracks. 14 Henrietta Street ainda tem datas, mas o estoque real é JavaScript e não consegui ler: 01 524 0383. Tudo o mais da sua lista entra sem reserva.\n2. O seguro do cartão — o que está confirmado e o que não está — Confirmado no guia de benefícios da Mastercard Black (versão set/2025, vigente): cobertura “em qualquer lugar do mundo”, até 60 dias, colisão, roubo, vandalismo, fenômenos da natureza; condições: recusar o CDW da locadora, alugar e pagar a caução com o cartão, contrato no seu nome. Irlanda, Israel e Jamaica não aparecem em lista de exclusão nenhuma. Não confirmado: se a apólice cobre a franquia quando o CDW básico vem embutido na tarifa e não pode ser recusado (o modelo Hertz/Sixt), e o prazo de aviso de sinistro. É a pergunta do telefonema.\n3. As locadoras e o cartão brasileiro — Europcar, Irish Car Rentals e carhire.ie: só aceitam dispensa de CDW com cartão americano ou canadense, carta do emissor citando “Republic of Ireland” e caução de €5.000 — cartão brasileiro não entra. Avis/Budget: aceitam “prova de cobertura de terceiro”, caução €5.000 + €30 de taxa; o texto de marketing fala em cartões americanos/canadenses — confirme por e-mail. Sixt: aceita carta do provedor citando a Irlanda e o veículo, caução €5.000 + €39,73. Enterprise: deixa recusar o CDW e você assume o valor integral; não publica caução nem exigência de carta. Hertz: CDW com franquia (€2.000 Polo, €2.500 Golf/Focus, €3.500 Octavia) e SuperCover opcional; sem SuperCover, bloqueia a franquia e cobra dela em caso de dano — você recupera do cartão depois.\n4. Cotações de aluguel — A única locadora que cota sem JavaScript hoje é o grupo carhire.ie / Irish Car Rentals (Thrifty): Ford Focus manual, 11 dias, €215,27 + €35 de one-way cidade → aeroporto = €250,27, com CDW e roubo incluídos e franquia €1.800; aeroporto → aeroporto €217,47. Enterprise, Sixt, Avis, Europcar e os brokers só cotam com navegador — os valores deles ficam para você conferir no app antes de fechar. Outubro é baixa temporada: espere €25–45/dia num compacto manual.\n5. Inishbofin — as balsas de outubro — A operadora é uma só e os horários de setembro são 11:30/18:45 de ida e 09:00/17:00 de volta. Para outubro só as saídas das 18:45 e 17:00 estão à venda online, e o site não publica tabela de outubro. Se a das 11:30 de segunda e a das 09:00 de terça rodarem, o plano fecha; se não, a segunda vira saída às 18:45 e a terça perde Ballybrit. Resolve-se com um telefonema: 095 37228.\n6. Inishbofin — cama e Richie — O Day's Bar B&B não publica preço nem disponibilidade legível; o Inishbofin House Hotel aparece fechado para outubro; o Doonmore fechou em 27/09. E o Richie “vai ver se consegue ir”: se for, é de carro dele e são duas camas; se não, GoCar de dois dias (~€165). Duas incógnitas que se resolvem no mesmo dia: pergunte a ele e ligue para o Day's.\n7. Cliffs of Moher — entrada e ônibus — O 350 está confirmado no feed oficial (16/09/2026 a 27/01/2027) e sai do Bus Station ao lado da Ceannt, não do Coach Station. O ingresso online é €8 até as 11:00, €12 depois, €15 na porta; não há regra publicada para quem chega de ônibus, então compre. A trilha costeira de Doolin até os Cliffs está fechada — só o trecho até o Surfers Path abre.\n8. Ballinasloe — a opinião deles — A Priscila e o Richie não recomendam. O Richie tinha dito “grand” no questionário. As duas coisas cabem juntas: é uma feira de Travellers, com fama áspera, que um irlandês não recomendaria a uma amiga estrangeira — e é exatamente o que você pediu. Você decidiu ir de dia, sozinho, e voltar cedo. Se ouvir o Richie ao vivo no sábado e mudar de ideia, o domingo vira Galway.\n9. Trens de domingo 11/10 — Horários e tarifas vêm do feed oficial e do sistema de vendas da Irish Rail em 14/09, sem obras carregadas ainda. Reconfira alterações de serviço em irishrail.ie uma semana antes. As passagens Low (€14,99) valem só para o trem escolhido.\n10. Beara — horários de comida e tempo de direção — Breen's (sex 12:00–17:00 e 17:30–21:30) e Murphy's vêm de avaliações de julho–agosto de 2026, não do site. O cardápio do MacCarthy's é imagem. Ligue 027 70031 / 027 70014 na quinta 8. Os 280 km e 4h30 são cálculo de rede viária; conte 6h.\n11. Montanhas de Dublin — os ônibus — S8, 16, 15B e 44 rodam sob esses nomes no feed da NTA. A fase A do BusConnects está prevista para “outono de 2026, sujeito a financiamento”, sem data, e pode mexer na família do 15. Confira no TFI Live na semana. A trilha de Bray a Greystones está fechada (2/9/2026) — isso é para o sábado 10 com eles.\n12. Magazine Fort — a reserva ainda não existe — Visita grátis das 11:00, diária, 12 lugares, mas o OPW publica no Eventbrite em blocos de quinze dias e o de outubro ainda não estava no ar. A duração da visita não está publicada em fonte alguma. Ligue 01 677 0095.\n13. Richmond Barracks — preço e café — Nem o site oficial nem a Câmara publicam preço de entrada (tudo indica grátis), e o café “The Mess” não é mencionado no site atual. Ligue 01 524 2532.\n14. Coddle no Patriot's Inn — O coddle não aparece no cardápio atual que consegui ler. Ligue 01 679 9595 antes de ir por causa do prato.\n15. O café da manhã tradicional de Dublin — Constatação, não dúvida: a caçarola de operário de Dublin praticamente se extinguiu. O que substituiu foi o balcão quente de deli e o breakfast roll. Não inventei um endereço para preencher a lacuna.\n16. Final de hurling — por que ela virou bônus — Três fatos, verificados em 17–18/09. Um: as seis últimas finais sênior de hurling de Tipperary foram todas no domingo — 2020, 2021, 2022, 2023, 2024 e 2025, nenhuma no sábado. Dois: três dessas seis foram para replay (2021, 2022, 2023), sempre cerca de duas semanas depois — se a de 10–11/10 empatar, o jogo que decide cai por volta de 24–25/10, quando você já está em casa. Três: a data ainda não existe. As semifinais são sáb 26 e dom 27/09, no Semple Stadium, e a final deve ser anunciada na semana seguinte. O único sinal a favor do sábado é que o próprio conselho do condado passou a usar sábado nessa fase. Por isso o churrasco é o plano e a final é o bônus — e não o contrário.\n17. Thurles de carro — os números — Cork → Thurles: 114 km, 81 min, saindo da M8 na saída 6 (Horse and Jockey) pela N62. Thurles → Dublin: 149 km, 112 min, entrando pela saída 5 (Twomileborris), que é só de entrada no sentido norte. Direto Cork → Dublin: 255 km, 182 min. O desvio custa +8,5 km, +11 minutos e nada de pedágio (€2,30 + €2,30 nos dois casos). Números de roteador aberto, não oficiais: some 20–30 min de trânsito em dia de jogo. ⚠️ A Câmara de Tipperary publicou em 2025 uma página sobre fechar a saída 6 no sentido norte e eu não consegui abrir — se estiver fechada, o desvio é pela saída 7 (Cashel) e a R660. Estacionamento: rede de estacionamentos com fiscal pela cidade (St Patrick's College na Cathedral Street e os da Liberty Square são os mais perto); ⚠️ a Garda multa quem estaciona nas ruas residenciais atrás da arquibancada velha.\n18. Clube de canto — caiu — Com o domingo 11 virando churrasco em Dublin, a única ida sentada que sobrava (An Spailpín, domingo 11 em Cork) morre de vez. A música fica como você pediu: pano de fundo de pub, sem programa marcado.\n19. Aula de dança no Cobblestone em 28/09 — O calendário publicado do termo de outono é 07/10 a 04/11. Confirme em info@louise.ie. Essa é a sua única noite de Cobblestone em Dublin — vale o telefonema.\n20. Preço de Ballybrit — €15 é o preço publicado de 2025; a página do card de 06/10/2026 ainda não foi atualizada.\n21. Jogo do FC Porto em 13 ou 14/10 — A 2ª rodada da fase de liga da Champions é 13–14/10 e o Porto está na competição. Confira em bilhetes.fcporto.pt.\n22. Um erro meu, corrigido — Eu havia citado um “Slattery's de Rialto” como early house perto de Inchicore. Não existe. O que existe é o Slatt's, na Tyrconnell Park, a 150 metros da sua porta. E o early house de verdade ao seu alcance é o Galway Hooker, dentro da estação Heuston, que abre às 07:00 todo dia — mas não serve comida.","etiquette":"- Travellers — a palavra e o assunto (Ballinasloe): Richie, sem rodeio: “Don't say travellers!” A palavra não sai da sua boca no Fair Green — nem para elogiar, nem para perguntar, nem para explicar o que você leu. Você é um brasileiro vendo cavalos; é isso que se conversa. · Nunca “tinker”, “knacker”, “gypsy”, “itinerant”. São insultos, alguns criminosos. E não pergunte a ninguém se é Traveller. · Cavalo se olha; não se toca e não se avalia em voz alta. Negócio é entre duas pessoas — quem está de fora não comenta preço. · Se perguntarem de onde você é, responda com prazer e pergunte de volta sobre o cavalo. Fim de conversa boa: “fair play to you”. · Leia antes: paveepoint.ie/traveller-factsheets. Dez minutos que evitam a única gafe grave disponível na viagem.\n- Câmera: Gente não é paisagem. Sem foto de pessoas, crianças ou negócios de cavalo sem pedir — e na feira, pedir já é intromissão. Fotografe o campo, não o negócio. · Sessão de pub: nunca filme. O músico que te viu filmar não volta a tocar solto. Bingo e mart: câmera no bolso a noite inteira. · No clube de canto, o celular fica guardado do começo ao fim. No estádio, foto do jogo é normal; foto das famílias na arquibancada, não.\n- Segurança na feira: 80 mil pessoas numa vila de 6.600. Carteira no bolso da frente, notas pequenas, o celular só sai para o ônibus. Richie: “Grand — nobody will bother him.” · Fique fora do caminho dos cavalos e dos condutores: quem está segurando um animal tem prioridade absoluta. Não passe por trás de cavalo nenhum. · Beba devagar de dia: o fim de tarde é quando o Fair Green fica áspero. O último Citylink é 00:25; não seja o último a sair do pub. · Sulky racing é proibido desde 2015 — se vir corrida improvisada na rua, é a hora de se afastar, não de olhar.\n- Clube de canto (o mais rígido de todos): Silêncio absoluto durante o canto — a única situação em pub irlandês onde falar por cima é ofensa real. Coro só se a sala entrar. Aplauso no fim. · Não leve violão. Clube de canto é à capela, sem instrumento. Isso é diferente de uma session instrumental. · Nome na lista com o organizador. Se cantar, cante algo brasileiro sem acompanhamento — Richie disse “grand”. Uma música, não três. · Chegue antes de começar e não saia no meio de uma canção. Pinta na mão é normal; o balcão espera a canção acabar.\n- Bingo: Chegue 20–30 minutos antes. As pessoas têm seus lugares. Pergunte “is anyone sitting here?” e, se disserem que é da Mary, levante. · Compre o book na mesa da entrada (€10–20) e um dabber (€1,50–3). Caneta não serve. Não peça emprestado o dabber de estranho. Leve dinheiro em notas pequenas. · Depois do eyes down, silêncio total. Celular no silencioso e guardado. · Quando completar, grite “Check!” (alguns dizem “House!”), pare de marcar e levante o cartão. Se errar, “sorry, false call” — acontece o tempo todo. · Você vai ser notado: sala majoritariamente feminina e acima de 60. A frase que resolve tudo é “I'm from Brazil, I'm travelling, I've never played bingo and I wanted to try it”. · Nada de fotografar o salão. Compre o book, entre na rifa e ajude a empilhar as cadeiras no fim.\n- Mart de gado (só no plano de chuva): O Richie foi claro: “No. Leave the men to it.” Por isso o mart saiu do plano principal. Se for no plano de chuva, vá ao escritório primeiro e diga: “I'm just here to look, I'm not buying.” · Bota que você não se importe em estragar. Sente no fundo da arquibancada do ringue, nunca na beira. · Nunca levante a mão, acene com a cabeça ou segure o olhar do leiloeiro. Não entre nos currais nem bloqueie os corredores. · A cantina no andar de cima é onde se conversa — não à beira do ringue. Um jantar do mart sai por ~€8–12.\n- Jogo do GAA: Sem código de vestimenta. Mas não vista camisa de condado (o azul-e-ouro de Tipperary, o vermelho de Cork): final de clube é paróquia contra paróquia e a camisa te marca como turista. Roupa neutra é o certo. · “I've no dog in this fight, I'm just here for the match” é resposta perfeitamente normal e costuma render vinte minutos de conversa sobre as duas paróquias. · Chegue cedo: a final intermediária antes entra no mesmo ingresso e costuma ser tão boa quanto. Não se vende álcool dentro. O Semple Stadium não aceita dinheiro — só cartão nos portões e balcões. · Jogadores são amadores: o açougueiro e o professor da cidade. Elogiar o jogo no pub depois é o jeito de entrar na conversa.\n- Pubs: A rodada é obrigação — e tem vez. Richie: “He'll buy a round out of turn. He'll survive.” Quem chega numa mesa oferece a rodada; depois espera a sua vez chegar de novo. · Sessão não é show: sem pedidos, sem palmas no meio do conjunto de tunes, sem filmar. Você bebe e conversa baixo; a música é o fundo. · Assuntos pesados que não são papo de balcão: o Norte, a Igreja, a Fome, política sobre Travellers. Corrida de galgo divide a Irlanda desde o RTÉ Investigates de 2019 — não é papo leve. · Não se dá gorjeta no balcão. Peça no balcão, não na mesa. “Grand” resolve 80% das perguntas e “sound” é o elogio máximo.","book":"- ⛔ PERDIDO Kilmainham Gaol e Magazine Fort: Os dois esgotaram em todas as datas da sua janela. Não há o que reservar. Kilmainham: tente as devoluções online entre 09:15 e 09:30 em qualquer manhã de Dublin. Magazine Fort: um olhar manual no Eventbrite, sem contar com isso. Os substitutos já estão nos dias 28/09 e 01/10 — e são grátis e sem reserva.\n- ✅ DECIDE LÁ Quase tudo, e você está certo: Ballinasloe (grátis), Ballybrit (€20 no portão contra €15 antecipado), galgos de Curraheen (~€10 na porta), Cliffs of Moher (€15 no portão contra €8 online antes das 11:00), Collins Barracks e Richmond Barracks (grátis, entra quem chega), Guinness Open Gate (sem reserva, sem couvert), mercados, pubs, o Céilí Mór, a semifinal de futebol gaélico (ingresso sai na semana) e a final de hurling (só entra à venda na semana do jogo). Esperar custa no máximo €5 a €7 por item — e compra informação melhor.\n- 🔴 NÃO ESPERA Camas em Galway: 2–4 e 6–7/10: É o único item onde esperar pode custar a viagem: a feira de Ballinasloe esvazia a região de quarto na semana de 4 a 11. Athlone é o plano B. Combine com a Priscila se sexta e sábado são no mesmo lugar que eles.\n- 🔴 NÃO ESPERA Cama em Inishbofin, noite de 5/10: Ilha de 200 moradores. O Day's Bar & B&B tem quatro quartos (+353 95 45829); alternativas são o Lapwing House (+353 95 45996) e o hostel (+353 95 45855, privado €70). O Doonmore fechou a temporada e o Inishbofin House Hotel não abre outubro. Para dois, se o Richie for.\n- 🔴 NÃO ESPERA A balsa de Inishbofin — o telefonema: 095 37228 (seg–sex 10:00–18:00) ou SMS 087 180 0586. Confirmar e reservar a saída de segunda 5/10 às 11:30 e a volta de terça 6/10 às 09:00 — nenhuma das duas está no sistema online para outubro, e a das 09:00 é a que salva Ballybrit. €25 ida e volta. Uma operadora só.\n- 🔴 NÃO ESPERA Camas em Cork: 8 e 9/10: Duas noites na semana do Folk Festival. Perto de South Main Street / Coburg Street, e pergunte sobre estacionamento — agora você chega de carro.\n- 🔴 NÃO ESPERA As três noites em Inchicore: 10, 11 e 14/10: Não é reserva, é pedido: confirmar com quem te hospeda. O fim de semana com a Priscila e o Richie e a madrugada da quinta 15 dependem disso.\n- 🟠 ESTA SEMANA O carro — preço sobe perto da data: Sex 2/10 ~09:00 Dublin → seg 12/10 ~15:30 Aeroporto de Dublin, manual compacto.
