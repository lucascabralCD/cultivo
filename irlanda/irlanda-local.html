0","h":"09:20","t":"09:20","c":"time","b":"Saia a pé pela South Circular, entre pelo portão de Islandbridge e suba a Military Road — ~30 minutos, e você passa dentro dos <b>Jardins do Memorial de Guerra</b> de novo, que abrem às 08:00. O ponto de encontro é o portão principal do forte.","ti":"A pé ao forte pelos Jardins do Memorial","kind":"do","place":"Irish National War Memorial Gardens","maps":"Irish National War Memorial Gardens, Islandbridge, Dublin","dur":30,"alts":[{"ti":"Richmond Barracks a 7 min a pé","b":"Sem vaga no forte, a manhã é o <b>Richmond Barracks, Inchicore</b>: quinta 10:00–17:00, entrada livre, sem reserva, sete minutos da cama. Foi ali que os líderes de 1916 foram julgados antes de Kilmainham.","src":"plano.json 01/10 · 10:00 o plano firme; docs/adendo-dublin-porto-ultima-noite.md (Plano B · Richmond Barracks)","t":"10:00"},{"ti":"Só os Jardins do Memorial, 08:00","b":"Se a ideia é só andar: <b>Jardins do Memorial de Guerra, Islandbridge</b>, abrem 08:00 de segunda a sexta, grátis, ~22 min a pé pela South Circular. Lutyens, fontes de granito, e às oito não tem ninguém.","src":"days/2026-09-29.json 08:00","t":"08:00"},{"ti":"Sirga do Grand Canal, 5 km plano","b":"Caminho de sirga do <b>Grand Canal</b>, subindo de Suir Road até Portobello e voltando — ~5 km plano, garça, eclusa e nenhuma atração. A manhã de perna cansada.","src":"days/2026-09-29.json 'se não quiser museu'","t":""}]},{"id":"2026-10-01.4.10-00-o-plano-firme","h":"10:00 · o plano firme","t":"10:00","c":"time","b":"⭐ <b>Richmond Barracks, Inchicore — quinta 10:00–17:00, sete minutos a pé da sua cama, entrada livre e sem reserva.</b> Foi ali que os líderes de 1916 foram julgados sumariamente antes de serem fuzilados em Kilmainham — e é a coisa mais próxima da cadeia que você vai conseguir ver. Hoje é biblioteca e centro cultural do município, com jardim. ⚠️ O preço não está publicado em lugar nenhum (tudo indica grátis) e o café “The Mess” não é mencionado no site atual: 01 524 2532.","ti":"Richmond Barracks, Inchicore — 10:00","kind":"do","place":"Richmond Barracks","maps":"Richmond Barracks, Inchicore, Dublin","dur":90,"alts":[{"ti":"14 Henrietta Street, visita das 10:00","b":"Casa georgiana onde chegaram a morar dezessete famílias; visitas de hora em hora 10:00–16:00, <b>€12, 75 min, só com reserva</b> (14henriettastreet.ticketsolve.com ou 01 524 0383). Luas de Suir Road até Four Courts ~14 min + 8 min a pé pela Bolton Street. Pegue a das 10:00 — a das 11:00 termina 12:15 e te deixa sem margem para o turno.","src":"plano.json 01/10 plano C; days/2026-09-30.json (preço, reserva e trajeto)","t":"10:00"},{"ti":"Tour grátis do Royal Hospital Kilmainham","b":"Tour grátis dos terrenos do <b>Royal Hospital Kilmainham</b>, guia no local todo dia às 11:00 (também 13:00 e 15:00) até novembro, sem reserva. Emende com <b>Bully's Acre</b>, o cemitério de pobre e de cólera fechado em 1832, dentro dos mesmos terrenos, entrada pela avenida oeste. É só o terreno: o Great Hall e a Capela do IMMA estão fechados o ano inteiro de 2026.","src":"plano.json 01/10 plano C; days/2026-09-28.json 11:00; days/2026-09-29.json note (IMMA fechado em 2026)","t":"11:00"},{"ti":"Collins Barracks — grátis, nunca esgota","b":"<b>Museu Nacional — Artes Decorativas e História, Collins Barracks</b>: ter–sáb 10:00–17:00, grátis, sem reserva, o único grande de Dublin que nunca esgota. Luas de Goldenbridge até a parada Museum, seis paradas, ~11 min; uma hora e meia é a dose, e a volta são 15 min de Luas.","src":"days/2026-09-29.json 10:00; days/2026-09-28.json 13:00","t":"10:00"}]},{"id":"2026-10-01.5.plano-c","h":"plano C","t":null,"c":"note","b":"Volta ao <b>14 Henrietta Street às 10:00</b> — a quinta também tem visita de hora em hora. Ou o <b>tour grátis dos terrenos do Royal Hospital Kilmainham</b>, guia no local todo dia às 11:00, 13:00 e 15:00 até novembro.","ti":"Plano C: 14 Henrietta St ou Royal Hospital","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-01.6.onde-comer","h":"onde comer","t":null,"c":"eat","b":"No parque, os dois cafés abrem <b>09:30</b> e são os únicos: <b>Phoenix Park Tea Rooms</b>, na Chesterfield Avenue ao lado do zoológico (prédio vitoriano de 1896, sopa e comida quente, 01 671 9376) e <b>Phoenix Park Café</b>, no Centro de Visitantes em Ashtown (01 255 4445). Descendo pelo portão de Parkgate, <b>Nancy Hands, 30–32 Parkgate Street</b> faz ensopado de carne com Guinness e chowder — ⚠️ <b>mas só a partir das 12:00</b>.","ti":"Comer: Phoenix Park Tea Rooms ou Nancy Hands","kind":"do","place":"Phoenix Park Tea Rooms","maps":"Phoenix Park Tea Rooms, Chesterfield Avenue, Phoenix Park, Dublin","dur":60,"alts":[{"ti":"Loaf Café, Kilmainham Square","b":"<b>Loaf Café, Kilmainham Square, Unit 2, Inchicore Road</b> — todo dia 08:00–16:00, empresa social, prato quente e sanduíche a preço de bairro. Fica entre os jardins e a Luas: é o lugar certo se a manhã for Richmond Barracks ou Royal Hospital em vez do parque.","src":"days/2026-09-29.json onde comer; docs/adendo-dublin-porto-ultima-noite.md §4 (Inchicore / Kilmainham)","t":""},{"ti":"Greenville Deli, a 200 m da cama","b":"<b>Greenville Deli, 5A Tyrconnell Road</b>, abre 08:00 (seg–sáb até 16:00), a 200 m da porta. Café da manhã antes de sair, sem desvio nenhum — ou o breakfast roll do balcão quente da Emmet Road, ~€4.","src":"days/2026-09-30.json onde comer; days/2026-09-29.json onde comer (breakfast roll ~€4); docs/adendo-dublin-porto-ultima-noite.md §4","t":"08:00"},{"ti":"The Patriot's Inn, prato sentado ao meio-dia","b":"<b>The Patriot's Inn, 760 South Circular Road</b>, ao lado do Royal Hospital, cozinha 12:00–21:30 — se quiser almoçar sentado antes do turno. O coddle não está no cardápio atual que deu para ler: ligue 01 679 9595 antes.","src":"days/2026-09-28.json onde comer; extra_DOUBTS.json #13 (Coddle no Patriot's Inn)","t":"12:00"}]},{"id":"2026-10-01.7.12-15","h":"12:15","t":"12:15","c":"time","b":"Volta pela Military Road ou de ônibus 25/26 de Parkgate até Heuston, e Luas até Goldenbridge.","ti":"Volta a Inchicore: bus 25/26, Heuston e Luas","kind":"do","place":"Parkgate Street (ponto do 25/26)","maps":"Parkgate Street, Dublin","dur":30,"alts":[{"ti":"Voltar a pé pela Military Road","b":"Descer a Military Road, sair pelo portão de Islandbridge e voltar pela South Circular — ~30 min a pé, o caminho da ida ao contrário, sem depender de ônibus.","src":"plano.json 01/10 09:20 (trajeto da ida) e 12:15","t":""},{"ti":"Do Richmond Barracks: 7 min a pé","b":"Se a manhã foi o Richmond Barracks, são sete minutos a pé até a cama — sem ônibus nem Luas, e sobra folga antes do turno.","src":"plano.json 01/10 · 10:00 o plano firme","t":""},{"ti":"Luas vermelha direto para Goldenbridge","b":"Se a manhã foi Collins Barracks ou Henrietta Street: Luas vermelha direto para Goldenbridge — da parada Museum são ~15 min; de Jervis ou Four Courts, em casa em ~25 min.","src":"days/2026-09-29.json 10:00; days/2026-09-30.json 12:00","t":""}]}]},{"d":"2026-10-02","wd":"SEX","dt":"02/10","ti":"Dublin → Galway, com a Priscila e o Richie","base":"Galway","rg":"west","tags":["com a Priscila e o Richie"],"note":"","lead":"Carro em Dublin e M6 até Galway com a Priscila e o Richie. Galgos se toparem, Neachtain à noite. Hoje eles escolhem.","etq":[1,7],"ev":[{"id":"2026-10-02.0.09-00","h":"09:00","t":"09:00","c":"time","b":"<b>Retirada do carro alugado em Dublin</b> — o Richie não tem carro, então vocês alugam um e ele fica com você até segunda 12. Saída pela N4 (sem a M50) → M4 → M6: Galway em ~2h30, pedágios €3,60 + €2,30. Chegando: Spanish Arch, Claddagh, o Long Walk, o Museu da Cidade (grátis). É o fim de semana deles; o programa é o que vocês três combinarem.","ti":"Carro em Dublin e estrada M6 até Galway","kind":"do","place":"Spanish Arch, Galway","maps":"Spanish Arch, Galway","dur":180,"alts":[{"ti":"Trem Heuston → Galway Ceannt","b":"Se o carro atrasar ou não sair no balcão: trem de <b>Heuston para Galway</b> (07:35 → 10:15; há 4 opções, até 11:05 → 13:40) ou Citylink a cada ~30 min. É a mesma linha Ceannt ↔ Heuston que a Priscila e o Richie usam para voltar no domingo. Em Galway existe a <b>Budget da Eyre Square</b> (7 dias, 09–18h) se o aluguel precisar ser refeito lá.","src":"docs/dossie-pesquisa-irlanda-porto.md (linha 154, tabela Galway: trem Heuston 07:35 → 10:15, Budget Eyre Square, Citylink) + extra_CARRO.json \"O desenho\" (domingo 4: eles voltam de trem Ceannt → Heuston ou Citylink)","t":""},{"ti":"Burren Loop de carro — plano de chuva","b":"Se chegar em Galway com chuva e sem ânimo para a cidade a pé: <b>Burren Loop</b>, 66 km, ~1h de Galway (Ballyvaughan, Carran, Kilfenora, Lisdoonvarna, Fanore, Black Head + Corkscrew Hill). Sem acostamento.","src":"docs/adendo-noite-rotas-cenicas-carro.md (linha 47, plano de chuva)","t":""},{"ti":"Salthill a pé pela promenade","b":"Se Spanish Arch e Claddagh já foram vistos ou os três quiserem ar: <b>Salthill pela promenade</b>, com o chute no muro no fim, como manda a tradição. Está no plano de sábado, mas serve para a tarde de hoje se eles preferirem.","src":"days/2026-10-03.json (tarde)","t":""}]},{"id":"2026-10-02.1.19-50","h":"19:50","t":"19:50","c":"time","b":"Se topar: <b>galgos no Galway Greyhound Stadium</b>, College Road — sexta é noite de corrida, portões 18:30, €10. ⚠️ Confirme no 061 448080.","ti":"Galgos no Galway Greyhound Stadium","kind":"do","place":"Galway Greyhound Stadium","maps":"Galway Greyhound Stadium, College Road, Galway","dur":150,"alts":[{"ti":"Galgos no sábado 03/10, mesma pista","b":"Galway corre <b>sexta e sábado</b> (portões 18:30, 1º páreo ~19:35–19:50, €10 na porta). Se hoje não houver corrida — a pista divide instalação com o Connacht Rugby, confirme no 061 448080 — a noite de amanhã é a mesma coisa, e os galgos já estavam no plano do Richie.","src":"extra_BANDS.json \"Galgos, €10\" (dias 7–8: sex 02 e sáb 03/10) + docs/revisao-regioes-v7-bagaceira.md (linha 133: Galway sex+sáb 19:50, Connacht Rugby, 061 448080) + extra_RICHIE.json (\"Os galgos — já estavam no plano\")","t":"19:50"},{"ti":"Garavan's, 46 William Street","b":"Se os galgos caírem: <b>Garavan's</b>, City Bar of the Year 2025, balcão de whiskey com flights a partir de €15 e snugs coladas nos músicos. \"A melhor sala única da pesquisa para beber sozinho\" — serve igual a três, sem programa.","src":"docs/adendo-noite-rotas-cenicas-carro.md (linha 221, Balcão e whiskey)","t":""},{"ti":"Direto ao Tigh Neachtain","b":"Sem corrida, a noite começa mais cedo no <b>Tigh Neachtain, 17 Cross Street</b>, ou no Tigh Cóilí (Mainguard Street). Se houver sessão no canto, é fundo, não programa.","src":"days/2026-10-02.json (noite)","t":""}]},{"id":"2026-10-02.2.noite","h":"noite","t":null,"c":"note","b":"<b>Tigh Neachtain</b> (17 Cross Street) ou <b>Tigh Cóilí</b> (Mainguard Street). Se houver sessão no canto, é fundo.","ti":"Noite: Tigh Neachtain ou Tigh Cóilí","kind":"do","place":"Tigh Neachtain","maps":"Tigh Neachtain, 17 Cross Street, Galway","dur":90,"alts":[{"ti":"The Crane Bar, Sea Road — andar de baixo","b":"<b>The Crane Bar</b>, Sea Road, no West End: sessão às 21:30 sete noites por semana, no <b>andar de baixo</b> (o de cima é sala de concerto paga — não é o seu). Não serve comida. É a noite prevista para terça, mas vale hoje se o Neachtain estiver lotado.","src":"days/2026-10-06.json (noite) + docs/adendo-noite-rotas-cenicas-carro.md (linha 219: 21h30, 7 noites; linha 230: West End) + docs/dossie-pesquisa-irlanda-porto.md (linha 340: andar de baixo) + docs/adendo-dublin-porto-ultima-noite.md (linha 127: não serve comida)","t":"21:30"},{"ti":"Garavan's, 46 William Street","b":"<b>Garavan's</b>, City Bar of the Year 2025: balcão de whiskey, flights a partir de €15, snugs. Boa para beber sozinho ou a três, sem depender de sessão.","src":"docs/adendo-noite-rotas-cenicas-carro.md (linha 221)","t":""},{"ti":"The Front Door — pub adulto, sem música","b":"Se o cansaço da estrada pedir conversa e não pub cheio: <b>The Front Door</b>, Cross St/High St, descrito como \"a good pub for people in their thirties… doesn't do live music\". Na mesma Cross Street do Neachtain.","src":"docs/adendo-noite-rotas-cenicas-carro.md (linha 224, Adulto e conversável)","t":""}]},{"id":"2026-10-02.3.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Chegando a Galway: ⭐ <b>GBC — Galway Bakery Company, 7 Williamsgate Street</b>, aberta desde <b>1936</b>, seg–sáb 08:00–16:30 e domingo 09:00–16:30 (091 563 087). É a última casa de comer velha, simples e sem modinha do centro. ⚠️ <b>O café do andar de cima do McCambridge's fechou</b>: sobrou o deli. Comida em pub: <b>Tigh Neachtain, 17 Cross Street, 11:00–16:00 todos os dias</b>. ⚠️ <b>O Tigh Cóilí e o Crane Bar não servem comida nenhuma.</b> Mas hoje quem escolhe são eles.","ti":"Comer: GBC, a padaria de 1936","kind":"do","place":"GBC — Galway Bakery Company","maps":"GBC Galway Bakery Company, 7 Williamsgate Street, Galway","dur":60,"alts":[{"ti":"McSwiggans — ostra nativa, 3 Eyre Street","b":"Almoço seg–sex 12:00–15:30: <b>McSwiggans, 3 Eyre Street</b>, ostra nativa Kelly's a <b>€19,50 a meia dúzia</b> (outubro é o auge, sem multidão) e chowder €13,50. Sexta funciona, mas o almoço fecha às 15:30 — antes da GBC (16:30) — então é a primeira parada ao chegar, não a de última hora.","src":"docs/onde-comer-cork-galway.md (linha 87: Kelly's, €19,50, seg–sex 12–15:30; linha 113: chowder €13,50) + docs/adendo-dublin-porto-ultima-noite.md (linha 128)","t":"12:30"},{"ti":"Jantar: Rúibín, 1 Dock Road","b":"À noite a GBC e o Neachtain já não servem: <b>Rúibín, 1 Dock Road, seg–sáb 12:00–23:00</b>. É a casa indicada para jantar antes do Crane Bar na terça — serve igual na sexta, antes dos galgos ou no lugar deles.","src":"extra_EAT.json 06/10 + docs/onde-comer-cork-galway.md §€€ (linha 113)","t":""},{"ti":"Handsome Burger, 49 Dominick St Lower","b":"Barato e rápido no West End: <b>Handsome Burger</b>, €10,50, tido como o melhor hambúrguer da Irlanda, a 100 m do Róisín Dubh. Ou o spice bag do <b>Xian Street Food</b> (7 Quay St, €8,75).","src":"extra_EAT.json 03/10 + docs/onde-comer-cork-galway.md §€ (linha 110)","t":""}]}]},{"d":"2026-10-03","wd":"SÁB","dt":"03/10","ti":"Galway com eles","base":"Galway","rg":"west","tags":["com a Priscila e o Richie"],"note":"Combine hoje as duas coisas do Richie: se ele vai à ilha na segunda (e de carro), e onde moram os pais dele — o churrasco de domingo 11 depende disso.","lead":"Sábado com eles em Galway: mercado de manhã, Salthill à tarde, Áras na nGael à noite. Acerte com o Richie a ilha e o churrasco.","etq":[1,7],"ev":[{"id":"2026-10-03.0.09-30","h":"09:30","t":"09:30","c":"time","b":"<b>Galway Market</b>, Church Lane, ao lado da igreja de St Nicholas (1320): The Oyster Man abre ostra na hora, Gannet Fishmongers, padarias, quase tudo abaixo de €10.","ti":"Galway Market — ostra aberta na hora","kind":"do","place":"Galway Market","maps":"Galway Market, Church Lane, Galway","dur":90,"alts":[{"ti":"Tigh Neachtain — comida de pub 11–16h","b":"<b>Tigh Neachtain</b>, 17 Cross Street, serve comida das 11:00 às 16:00 todos os dias (sopa, sanduíche, ostra, mexilhão). Se o mercado estiver debaixo de chuva ou vocês acordarem tarde, é a ostra e o balcão comprido sem sair do centro.","src":"extra_EAT.json 02/10 · docs/adendo-dublin-porto-ultima-noite.md (Galway)","t":"11:00"},{"ti":"GBC — Galway Bakery Company (1936)","b":"<b>GBC, 7 Williamsgate Street</b>, aberta desde 1936, sábado 08:00–16:30 (091 563 087). A última casa de comer velha, simples e sem modinha do centro — café da manhã de gente da terra quando a manhã de mercado não rolar.","src":"extra_EAT.json 02/10","t":"09:00"},{"ti":"Spanish Arch, Claddagh e o Museu da Cidade","b":"O plano de chegada de sexta que talvez não tenha dado tempo: <b>Spanish Arch, Claddagh, o Long Walk e o Museu da Cidade (grátis)</b>. Tudo a pé a partir do centro e serve de manhã de chuva no lugar das bancas.","src":"plano 02/10 evento 09:00 (chegando a Galway)","t":"10:00"}]},{"id":"2026-10-03.1.tarde","h":"tarde","t":null,"c":"note","b":"Salthill a pé pela promenade (chute no muro no fim, como manda a tradição), ou o que eles quiserem mostrar — eles conhecem Galway melhor que qualquer lista.","ti":"Salthill a pé pela promenade","kind":"do","place":"Salthill Promenade","maps":"Salthill Promenade, Salthill, Galway","dur":120,"alts":[{"ti":"Spanish Arch, Claddagh e o Long Walk","b":"Se chover ou eles preferirem ficar perto: <b>Spanish Arch, Claddagh, o Long Walk e o Museu da Cidade (grátis)</b>, o passeio de chegada de sexta, todo dentro do centro.","src":"plano 02/10 evento 09:00 (chegando a Galway)","t":""},{"ti":"Garavan's — balcão e whiskey, 46 William St","b":"<b>Garavan's, 46 William Street</b>, City Bar of the Year 2025, flights de whiskey de €15 a €100+, snugs coladas nos músicos. A melhor sala única da pesquisa para beber sozinho — e serve também com os dois numa tarde de chuva.","src":"docs/adendo-noite-rotas-cenicas-carro.md (Galway — balcão e whiskey)","t":"15:00"},{"ti":"Tigh Neachtain — pub velho até as 16h com comida","b":"<b>Tigh Neachtain, 17 Cross Street</b>: balcão comprido, comida até 16:00. Tarde curta, cansaço ou chuva: senta, come e deixa eles escolherem o resto.","src":"plano 02/10 noite · extra_EAT.json 02/10 · docs/adendo-noite-rotas-cenicas-carro.md","t":"14:00"}]},{"id":"2026-10-03.2.21-00","h":"21:00","t":"21:00","c":"time","b":"<b>Áras na nGael</b>, 45 Dominick Street — clube em língua irlandesa atrás de um arco de pedra, sessão de sábado, 25 anos de casa e zero turista. Pergunte ao Richie se ele topa: é o tipo de sala que ele conhece.","ti":"Áras na nGael — sessão de sábado","kind":"do","place":"Áras na nGael","maps":"Áras na nGael, 45 Dominick Street, Galway","dur":90,"alts":[{"ti":"Galgos no Galway Greyhound Stadium","b":"Sábado também é noite de corrida em Galway: <b>Galway Greyhound Stadium, College Road</b>, portões 18:30, €10 na porta, 1º páreo ~19:35–19:50. Se a sexta não deu, é a segunda chance — e o Richie já disse que é o programa para levar amigo de fora. Confirme no 061 448080.","src":"extra_BANDS.json Galgos (índice 8, sáb 03/10) · plano 02/10 evento 19:50 · extra_RICHIE.json","t":"18:30"},{"ti":"The Crane Bar, Sea Road — sessão às 21:30","b":"<b>The Crane Bar</b>, Sea Road, sessão às 21:30 sete noites por semana; fique no andar de baixo, o de pub — o de cima é sala de concerto paga, e isso não é o programa. No West End, onde os pubs ficam a 8 minutos a pé entre si. Não serve comida — jante antes.","src":"plano 06/10 noite · docs/adendo-noite-rotas-cenicas-carro.md (Galway) · docs/dossie-pesquisa-irlanda-porto.md","t":"21:30"},{"ti":"Tigh Neachtain ou Tigh Cóilí","b":"O plano de noite de sexta vale de novo: <b>Tigh Neachtain</b> (17 Cross Street) ou <b>Tigh Cóilí</b> (Mainguard Street, sessão às 18:00 e 21:30, diário). Se houver sessão no canto, é fundo. Os dois não servem comida à noite.","src":"plano 02/10 noite · docs/adendo-noite-rotas-cenicas-carro.md (Galway)","t":"21:00"}]},{"id":"2026-10-03.3.onde-comer","h":"onde comer","t":null,"c":"eat","b":"⭐ <b>Galway Market</b>, Church Lane, sábado 08:00–18:00, quase tudo abaixo de €10: <b>The Oyster Man</b> abre ostra na hora, <b>Gannet Fishmongers</b>, <b>Coolfin Organic Bakery</b>. A ostra nativa está no auge em outubro: <b>McSwiggans, 3 Eyre Street, €19,50 a meia dúzia</b>. Barato: <b>Handsome Burger</b> (49 Dominick St Lower, €10,50) e <b>Xian Street Food</b> (7 Quay St, spice bag €8,75). Compre hoje o farnel de segunda: na ilha só há o Day's Bar.","ti":"Comer: Galway Market, ostra e farnel da ilha","kind":"do","place":"Galway Market","maps":"Galway Market, Church Lane, Galway","dur":60,"alts":[{"ti":"Tigh Neachtain — almoço de pub 11–16h","b":"<b>Tigh Neachtain, 17 Cross Street</b>, comida 11:00–16:00 todos os dias: sopa, sanduíche, ostra, mexilhão. Se as bancas fecharem cedo ou chover, o almoço resolve ali.","src":"extra_EAT.json 02/10 · docs/adendo-dublin-porto-ultima-noite.md (Galway)","t":"12:30"},{"ti":"GBC — Galway Bakery Company","b":"<b>GBC, 7 Williamsgate Street</b>, sábado 08:00–16:30, desde 1936. Comida velha e simples do centro, sem modinha, para café da manhã ou almoço barato.","src":"extra_EAT.json 02/10","t":"09:00"},{"ti":"Jantar: Rúibín, 1 Dock Road","b":"<b>Rúibín, 1 Dock Road</b>, seg–sáb 12:00–23:00. Jantar antes do Áras na nGael, que não serve comida nenhuma — assim como o Crane Bar e o Tigh Cóilí.","src":"extra_EAT.json 06/10 · docs/onde-comer-cork-galway.md (Galway €€)","t":"19:00"}]}]},{"d":"2026-10-04","wd":"DOM","dt":"04/10","ti":"★ Ballinasloe — o dia solitário na feira","base":"Galway → Ballinasloe","rg":"west","tags":["grátis","★"],"note":"Se na véspera, ouvindo o Richie pessoalmente, você mudar de ideia: o domingo vira Galway com calma — mercado de domingo, Salthill, e a mala pronta para a ilha.","lead":"Ballinasloe sozinho: Citylink 10:00, cavalos no Fair Green de dia, a palavra não sai da boca, e Galway antes de escurecer.","etq":[0,1,2],"ev":[{"id":"2026-10-04.0.por-que","h":"por quê","t":null,"c":"note","b":"A Priscila e o Richie voltam para Dublin hoje, e não recomendam a feira: para o irlandês de classe média ela é “unusual” — é um encontro de Travellers, com fama de áspera. Você escolheu ir mesmo assim, sozinho, porque é exatamente a coisa que você chamou de bagaceira: a feira de cavalos mais antiga da Europa, 80 mil pessoas numa vila de 6.600, negócio em dinheiro com aperto de mão. Vá de dia, respeite as regras, e volte antes do escurecer.","ti":"Por que a feira, sozinho","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-04.1.10-00","h":"10:00","t":"10:00","c":"time","b":"<b>Citylink 763</b> do Galway Coach Station → Ballinasloe, <b>60 minutos exatos</b>. Há também trem (41–46 min). <b>Deixe o carro em Galway</b>: as ruas da vila fecham de sábado 20:00 a segunda 21:00, o estacionamento oficial é no arrabalde, e dia de feira é dia de pinta.","ti":"Citylink 763 Galway → Ballinasloe","kind":"do","place":"Galway Coach Station","maps":"Galway Coach Station, Galway","dur":60,"alts":[{"ti":"Trem Galway → Ballinasloe (41–46 min)","b":"Se perder o Citylink das 10:00, o trem da Irish Rail faz Galway (Ceannt) → Ballinasloe em <b>41–46 minutos</b>. Serve igual: o carro fica em Galway do mesmo jeito.","src":"docs/revisao-regioes-v7-bagaceira.md §1 (transporte) e plano 04/10 10:00","t":""},{"ti":"Citylink 763 das 12:00 ou 14:00","b":"O 763 sai de Galway também às <b>12:00 e 14:00</b> (60 min), todo dia, incluindo domingo. Chegando ao meio-dia ainda pega a tarde inteira de negócio no Fair Green e o carvery do Gullane's (12:00–16:30).","src":"docs/revisao-regioes-v7-bagaceira.md §1 (saídas de Galway)","t":"12:00"},{"ti":"Plano B: Galway com calma","b":"Se na véspera, ouvindo o Richie, mudar de ideia, o domingo vira Galway com calma: <b>Salthill a pé pela promenade</b> (chute no muro no fim, como manda a tradição) e a mala pronta para a ilha de segunda. Café: <b>GBC, 7 Williamsgate Street</b>, abre domingo 09:00–16:30.","src":"days/2026-10-04.json note; days/2026-10-03.json tarde; extra_EAT.json 02/10 (GBC domingo)","t":""}]},{"id":"2026-10-04.2.11-30","h":"11:30","t":"11:30","c":"time","b":"<b>Fair Green, rua Society.</b> Cavalos, pôneis, jennets, burros, cavalos de tração — negociados sem leiloeiro e sem ringue. Fique no meio, não na beira, e não comente preço.","ti":"Fair Green — cavalos na rua Society","kind":"do","place":"Fair Green, Ballinasloe","maps":"Fair Green, Society Street, Ballinasloe","dur":240,"alts":[{"ti":"Programação do Misleór na feira","b":"Se o Fair Green estiver áspero demais ou fechado ao movimento, o <b>Misleór</b> — festival de culturas nômades do Galway Traveller Movement — leva programação à feira neste 04/10. O festival é teatro com elenco Traveller, painéis, oficinas de funilaria e música; o que vai à feira sai em <b>misleor.ie</b>. É a porta de entrada respeitosa para o mesmo assunto.","src":"days/2026-10-04.json 'o dia'; extra_BANDS.json Misleór (dia 9); docs/revisao-regioes-v7-bagaceira.md §2","t":""},{"ti":"The Dunlo Tavern, Dunlo Street","b":"Chuva ou cansaço: <b>The Dunlo Tavern</b>, Dunlo Street — 45 lugares, sem jardim, 90% da renda vem de freguês da terra, gente ombro a ombro. Sem comida (090 964 3603). Outros pubs confirmados em 2026: Downey's (Society St), The Duck Inn (Dunlo St), The Usual (Main St), Finn's (River St).","src":"docs/adendo-dublin-porto-ultima-noite.md (Ballinasloe — pubs)","t":""},{"ti":"Citylink 14:25 de volta a Galway","b":"Se a feira não render, o 763 volta às <b>14:25</b> (Galway em 60 min) — sobra a tarde em Galway para Salthill ou o Museu da Cidade (grátis).","src":"docs/revisao-regioes-v7-bagaceira.md §1 (voltas); days/2026-10-02.json 09:00 (Museu da Cidade)","t":"14:25"}]},{"id":"2026-10-04.3.o-dia","h":"o dia","t":null,"c":"note","b":"O <b>Misleór</b> — festival de culturas nômades dirigido pelo Galway Traveller Movement — leva programação à feira. É a porta de entrada respeitosa.","ti":"Misleór — a porta respeitosa da feira","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-04.4.richie","h":"⚠️ Richie","t":null,"c":"warn","b":"<i>“Don't say travellers!”</i> — a palavra não sai da sua boca no Fair Green, nem para elogiar, nem para perguntar. Etiqueta completa na seção 09. E sobre segurança, o veredito dele: <i>“Grand. Nobody will bother him.”</i>","ti":"Richie: \"Don't say travellers!\"","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-04.5.16-25","h":"16:25","t":"16:25","c":"time","b":"Citylink de volta (16:25 ou 18:25 → Galway em 60 min). A noite da feira fica para quem é de lá. Em Galway, Tigh Neachtain e cama cedo: amanhã a balsa é às 11:30.","ti":"Citylink 16:25 de volta; Tigh Neachtain","kind":"do","place":"Ballinasloe","maps":"Ballinasloe, Co. Galway","dur":60,"alts":[{"ti":"Citylink 18:25","b":"Perdeu o das 16:25: o próximo 763 é às <b>18:25</b>, Galway em 60 min. Ainda chega com luz para o Tigh Neachtain e cama cedo (balsa às 11:30 amanhã). Depois disso há 20:25, 22:25 e 00:25 — mas a noite da feira é para quem é de lá.","src":"days/2026-10-04.json 16:25; docs/revisao-regioes-v7-bagaceira.md §1 (voltas)","t":"18:25"},{"ti":"Trem Ballinasloe → Galway","b":"Alternativa ao ônibus: trem em <b>41–46 min</b>; o último de domingo de volta a Galway é às <b>22:07</b>.","src":"docs/revisao-regioes-v7-bagaceira.md §1 (trem, último de volta dom 22:07)","t":""},{"ti":"Tigh Cóilí ou The Crane Bar em Galway","b":"Se o Tigh Neachtain (17 Cross St) estiver lotado: <b>Tigh Cóilí</b>, Mainguard Street, ou <b>The Crane Bar</b>, Sea Road, andar de cima — se houver sessão, é fundo de pinta, não programa. Nenhum dos dois serve comida.","src":"days/2026-10-02.json noite; days/2026-10-06.json noite; extra_EAT.json 02/10 e 06/10 (Tigh Cóilí e Crane Bar sem comida)","t":""}]},{"id":"2026-10-04.6.onde-comer","h":"onde comer","t":null,"c":"eat","b":"⚠️ <b>Domingo mata os cafés de Ballinasloe — o Bread Basket e o Kariba's fecham os dois.</b> Sobram dois endereços: ⭐ <b>Gibbons' Pillar House, 8 Society Street</b> — a rua do Fair Green — <b>comida das 09:00 às 21:00, sete dias</b> (090 964 3939); e o <b>Gullane's Hotel, Main Street</b>, <b>carvery 12:00–16:30, sem reserva</b> (090 964 2220). Na feira em si: peixe com batata e sonho açucarado frito na hora. ⚠️ O Hayden's Hotel fechou. Ninguém em Ballinasloe publica preço.","ti":"Comer: Gibbons' Pillar House ou Gullane's","kind":"do","place":"Gibbons' Pillar House","maps":"Gibbons' Pillar House, 8 Society Street, Ballinasloe","dur":60,"alts":[{"ti":"Carvery do Gullane's Hotel","b":"<b>Gullane's Hotel, Main Street</b> — carvery <b>12:00–16:30, sem reserva</b> (090 964 2220). A única carvery confirmada da cidade; assado irlandês genérico, e é isso que existe por ali.","src":"extra_EAT.json 04/10; docs/adendo-dublin-porto-ultima-noite.md (Ballinasloe)","t":"12:30"},{"ti":"Comida da feira: peixe com batata e sonho","b":"Na feira em si: <b>peixe com batata e sonho açucarado frito na hora</b> — a única comida de feira documentada. Sem lista de barraca nem preço de 2026; dinheiro em notas pequenas.","src":"extra_EAT.json 04/10; docs/adendo-dublin-porto-ultima-noite.md (comida da feira)","t":""},{"ti":"Nico's, take-away antes do ônibus","b":"<b>Nico's, 6 Dunlo Street</b> — take-away das 16:00 às 23:50. Serve se os dois de cima estiverem cheios e a fome bater na hora de pegar o 763 das 16:25 ou 18:25.","src":"docs/adendo-dublin-porto-ultima-noite.md (Ballinasloe — Nico's)","t":"16:00"}]}]},{"d":"2026-10-05","wd":"SEG","dt":"05/10","ti":"★ Inishbofin — a noite na ilha sem luz na rua","base":"Galway → Cleggan → Inishbofin","rg":"west","tags":["~€25 + cama","★"],"note":"⚠️ Se a balsa de outubro tiver só a saída das 18:45, o dia inverte: Galway com calma, saída 16:30, balsa 18:45 → 19:15, jantar no Day's. Isso se resolve no telefonema desta semana.","lead":"Carro até Cleggan, balsa 11:30 e a noite em Inishbofin: um pub, focas, sem luz na rua. Ilha de ficar.","etq":[7],"ev":[{"id":"2026-10-05.0.o-dia","h":"★ o dia","t":null,"c":"star","b":"<i>“My favourite place in the country”</i> (Richie). <i>“Uma grande fazenda em forma de ilha, bem simples, à noite não tem iluminação na rua, tudo bem local. Ou gosta ou odeia”</i> (Priscila). Pelo que você me disse sobre o que gosta, você gosta. ~200 moradores, um pub, penhascos, focas, e o forte de Cromwell na boca do porto. <b>O Richie pode ir junto</b> — de segunda para terça é o plano dele.","ti":"Inishbofin: a ilha favorita do Richie","kind":"info","place":"Inishbofin","maps":"Inishbofin, Co. Galway","dur":0,"alts":[]},{"id":"2026-10-05.1.09-00","h":"09:00","t":"09:00","c":"time","b":"<b>O carro alugado</b>, Galway → N59 (Oughterard, Clifden) → <b>cais de Cleggan</b>: 89 km, ~1h45. Estacionamento privado na entrada da vila, ~€4/dia (pernoite cobrado por dia; não deixe no cais). Sem o aluguel, o plano B era um GoCar de dois dias (~€165).","ti":"Carro: Galway → Cleggan pela N59, 1h45","kind":"do","place":"Cais de Cleggan","maps":"Cleggan Pier, Cleggan, Co. Galway","dur":105,"alts":[{"ti":"Citylink 923: Galway 08:00 → Cleggan 09:50","b":"Se o carro cair, o ônibus <b>Citylink 923</b> sai de Galway às 08:00 e chega ao cais de Cleggan às 09:50, com folga para a balsa das 11:30. Na terça, o 923 das 11:10 de Cleggan chega a Galway 13:30 — apertado para Ballybrit, mas cabe.","src":"docs/roteiro-fontes-build.md (mapa Inishbofin, plano sem carro)","t":"08:00"},{"ti":"Dia invertido: Galway com calma, saída 16:30","b":"Se a balsa de outubro só tiver a saída das 18:45, o dia inverte: manhã e almoço em Galway com calma (Tigh Neachtain serve comida 11:00–16:00), carro às 16:30, balsa 18:45 → 19:15 e jantar no Day's.","src":"days/2026-10-05.json note + extra_EAT.json 02/10","t":"16:30"}]},{"id":"2026-10-05.2.11-30","h":"11:30","t":"11:30","c":"time","b":"<b>Balsa Island Discovery, Cleggan 11:30 → Inishbofin 12:00. €25 ida e volta.</b> ⚠️ <b>A saída das 11:30 de outubro ainda não está no sistema online</b> (só a das 18:45): <b>reserve por telefone, 095 37228, seg–sex 10:00–18:00, ou SMS 087 180 0586</b> — e pergunte também pela balsa das 09:00 de terça, que é a que salva Ballybrit.","ti":"Balsa Cleggan 11:30 → Inishbofin, €25","kind":"do","place":"Island Discovery, cais de Cleggan","maps":"Cleggan Pier, Cleggan, Co. Galway","dur":30,"alts":[{"ti":"Balsa das 18:45 (a única online em outubro)","b":"Se a das 11:30 não rodar, a saída garantida é a das <b>18:45 → 19:15</b>, à venda online. Jante no Day's ao chegar. Confirme pelo 095 37228 (seg–sex 10:00–18:00) ou SMS 087 180 0586.","src":"extra_DOUBTS.json 'Inishbofin — as balsas de outubro' + days/2026-10-05.json note","t":"18:45"},{"ti":"Sky Road enquanto espera a balsa","b":"Com horas sobrando em Cleggan/Clifden: a <b>Sky Road</b>, 8 km até Clifden + circuito de 16 km, ~45 minutos, sentido horário pela Upper Road. Estrada estreita, sem acostamento.","src":"days/2026-10-06.json 09:00 + docs/adendo-noite-rotas-cenicas-carro.md","t":""},{"ti":"Almoço em Clifden: Mitchell's","b":"Se ficar preso na costa até a balsa da tarde: <b>Mitchell's, Clifden</b>, almoço 12–17h, casa familiar desde 1991 (horários publicados são de verão, confirme: +353 95 21867). Em Cleggan, o <b>Little Fish</b> está na lista de fish and chips do Irish Times.","src":"docs/onde-comer-cork-galway.md (Estrada da Connemara) + docs/dossie-pesquisa-irlanda-porto.md (fish and chips)","t":"12:00"}]},{"id":"2026-10-05.3.tarde","h":"tarde","t":null,"c":"note","b":"<b>Westquarter Loop</b>: 8,1 km, 80 m de subida, 2 a 2,5 h, começa e termina no New Pier, setas roxas — penhascos, a praia de Trá Gheal, focas. Depois o porto, Cromwell's Barracks visto do cais, e nada mais: é uma ilha de ficar.","ti":"Westquarter Loop: 8 km, penhascos e focas","kind":"do","place":"New Pier, Inishbofin","maps":"New Pier, Inishbofin, Co. Galway","dur":150,"alts":[{"ti":"Só o porto e o forte de Cromwell do cais","b":"Chuva ou cansaço: fique no porto, veja o <b>Cromwell's Barracks</b> da boca do porto, visto do cais, e pare. É uma ilha de ficar, não de cumprir roteiro.","src":"days/2026-10-05.json tarde + o dia","t":""},{"ti":"Loop na terça de manhã, se a balsa das 09:00 cair","b":"Se só houver a balsa das 17:00 de terça, Ballybrit cai e a terça vira o segundo dia na ilha — o Westquarter Loop (2 a 2,5 h, setas roxas do New Pier) cabe na manhã seguinte.","src":"days/2026-10-06.json note + days/2026-10-05.json tarde","t":""},{"ti":"Tarde de pub no Day's Bar","b":"O único pub da ilha, <b>Day's Bar (The Beach)</b>, com comida até tarde. Se o tempo fechar, a tarde é balcão, não trilha.","src":"days/2026-10-05.json onde comer","t":""}]},{"id":"2026-10-05.4.onde-comer","h":"onde comer","t":null,"c":"eat","b":"⭐ <b>The Beach — Day's Bar &amp; B&B</b>: o pub da ilha, comida até tarde, <b>lagosta, caranguejo, cavala e pollock pescados ali</b>. Jante e durma no mesmo lugar.","ti":"Jantar: Day's Bar, lagosta e cavala da ilha","kind":"do","place":"Day's Bar & B&B (The Beach), Inishbofin","maps":"Day's Bar, The Beach, Inishbofin, Co. Galway","dur":60,"alts":[{"ti":"Farnel comprado no sábado no Galway Market","b":"O plano já previa: <b>compre o farnel de segunda no sábado</b>, no Galway Market (Church Lane, 08:00–18:00) — na ilha só há o Day's Bar. Se o pub não estiver servindo, é isso que come.","src":"days/2026-10-03.json onde comer + extra_EAT.json 03/10","t":""},{"ti":"Almoço antes da balsa em Clifden (dia invertido)","b":"Se o dia inverter para a balsa das 18:45, almoce em terra: <b>Mitchell's, Clifden</b>, almoço 12–17h (+353 95 21867); ou <b>Little Fish, Cleggan</b>, fish and chips da lista do Irish Times.","src":"docs/onde-comer-cork-galway.md + docs/dossie-pesquisa-irlanda-porto.md","t":"12:00"}]},{"id":"2026-10-05.5.dormir","h":"dormir","t":null,"c":"note","b":"<b>Day's Bar &amp; B&B (The Beach)</b>, 4 quartos, +353 95 45829, info@thebeach.ie — preço não publicado, reserve por telefone. Alternativas: <b>Lapwing House B&B</b> (aberto o ano todo, +353 95 45996) e o <b>Inishbofin Island Hostel</b> (quarto privado €70, cama em dormitório €25, +353 95 45855). ⚠️ O Doonmore fechou a temporada em 27/09 e o Inishbofin House Hotel não abre reservas para outubro.","ti":"Dormir: Day's Bar & B&B, 4 quartos","kind":"do","place":"Day's Bar & B&B (The Beach), Inishbofin","maps":"Day's Bar & B&B, The Beach, Inishbofin, Co. Galway","dur":0,"alts":[{"ti":"Lapwing House B&B (aberto o ano todo)","b":"<b>Lapwing House B&B</b>, Inishbofin, aberto o ano inteiro, +353 95 45996. Para dois, se o Richie for.","src":"days/2026-10-05.json dormir + docs/richie-veredito-e-decisoes-12-09.md","t":""},{"ti":"Inishbofin Island Hostel: privado €70, dorm €25","b":"<b>Inishbofin Island Hostel</b>, quarto privado €70 ou cama em dormitório €25, +353 95 45855. O Doonmore fechou a temporada em 27/09 e o Inishbofin House Hotel não abre outubro — não conte com eles.","src":"days/2026-10-05.json dormir + extra_DOUBTS.json 'Inishbofin — cama e Richie'","t":""}]}]},{"d":"2026-10-06","wd":"TER","dt":"06/10","ti":"Balsa das 09:00 → Ballybrit às 14:20","base":"Inishbofin → Galway","rg":"west","tags":["~€15","★"],"note":"⚠️ Tudo depende de a balsa das 09:00 rodar em outubro. Se só houver a das 17:00, Ballybrit cai e a terça vira o segundo dia na ilha — o que, pelo que a Priscila descreveu, não é castigo nenhum.","lead":"Balsa das 09:00, Sky Road se der tempo, e Ballybrit numa terça: 7 páreos de obstáculo e a pinta no Crane Bar à noite.","etq":[7,1],"ev":[{"id":"2026-10-06.0.09-00","h":"09:00","t":"09:00","c":"time","b":"<b>Balsa Inishbofin → Cleggan 09:00 → 09:30.</b> Se der tempo e vontade, a <b>Sky Road</b> (8 km até Clifden + o circuito de 16 km, 45 minutos) antes da N59. Galway por volta das 11:30–12:00; carro estacionado na hospedagem.","ti":"Balsa 09:00 para Cleggan e volta a Galway","kind":"do","place":"Cais de Cleggan","maps":"Cleggan Pier, Cleggan, Co. Galway","dur":180,"alts":[{"ti":"Segundo dia na ilha, balsa das 17:00","b":"Se a balsa das 09:00 não rodar em outubro, a terça vira o segundo dia em Inishbofin e Ballybrit cai — pela Priscila, não é castigo nenhum. Repita o <b>Westquarter Loop</b> (8,1 km, 2 a 2,5 h, começa no New Pier) ou fique no porto e no Day's Bar, e volte na balsa das <b>17:00</b>.","src":"days/2026-10-06.json note + extra_DOUBTS.json #5 + days/2026-10-05.json tarde e onde comer","t":"17:00"},{"ti":"Citylink 923 de Cleggan, 11:10 → Galway 13:30","b":"Se o carro der problema em Cleggan: o <b>Citylink 923</b> sai de Cleggan às 11:10 e chega a Galway às 13:30 — apertado para o 1º páreo das 14:20, mas cabe.","src":"docs/roteiro-fontes-build.md (mapa Inishbofin, nota do GoCar/Citylink)","t":"11:10"},{"ti":"Loop Roundstone–Ballyconneely em vez da Sky Road","b":"Retorno alternativo a partir de Clifden: <b>R341 + Bog Road</b> por Roundstone e Ballyconneely, 36 km / 50 min, passando pelo porto de Roundstone e pelo <b>O'Dowd's</b> (desde 1840) — que só abre o bar às 12:00, então nesta manhã é só passar. Só se a Sky Road estiver fechada ou o tempo tapar a vista — e sem comprometer o 12:30 em Galway.","src":"docs/adendo-noite-rotas-cenicas-carro.md (retorno alternativo) + docs/onde-comer-cork-galway.md (O'Dowd's)","t":""}]},{"id":"2026-10-06.1.12-30","h":"12:30","t":"12:30","c":"time","b":"Ônibus <b>409</b> de Eyre Square → Ballybrit Crescent, <b>17 min</b>, de 10 em 10 minutos, ou o shuttle de €8 do Skeff. Ballybrit tem estacionamento grátis, mas quem estaciona não bebe. Portões 12:30.","ti":"Ônibus 409 de Eyre Square até Ballybrit","kind":"do","place":"Eyre Square","maps":"Eyre Square bus stop, Galway","dur":17,"alts":[{"ti":"Shuttle de €8 do Skeff, Eyre Square","b":"Se o 409 não aparecer ou estiver lotado: o <b>shuttle de €8</b> sai do Skeff, na própria Eyre Square, direto para o hipódromo.","src":"days/2026-10-06.json 12:30 + docs/richie-veredito-e-decisoes-12-09.md (Ballybrit: shuttle Eyre Sq €8)","t":"12:30"},{"ti":"Ir de carro — estacionamento grátis, sem beber","b":"Ballybrit tem <b>estacionamento grátis</b>, mas quem estaciona não bebe. Só vale se a ideia for ver os páreos seco e guardar a pinta para o Crane Bar à noite.","src":"extra_CARRO.json (terça: Ballybrit)","t":""}]},{"id":"2026-10-06.2.14-20","h":"14:20","t":"14:20","c":"time","b":"<b>Galway Races, card de obstáculos</b> — 7 páreos, último às 17:20, ~€15. Não há ônibus especial em outubro — sinal de que a multidão de turista não vem. Richie: <i>“Ballybrit on a Tuesday.”</i>","ti":"Galway Races em Ballybrit — 7 páreos","kind":"do","place":"Galway Racecourse, Ballybrit","maps":"Galway Racecourse, Ballybrit, Galway","dur":180,"alts":[{"ti":"Terça na ilha se a balsa das 09:00 falhar","b":"Sem a balsa da manhã, Ballybrit cai de vez: o dia vira o segundo em Inishbofin (penhascos, focas, Cromwell's Barracks visto do cais) e a volta é na balsa das 17:00. O October Racing Festival (24–26/10) é depois da viagem — não há segunda chance de corrida em Galway.","src":"days/2026-10-06.json note + days/2026-10-05.json tarde + docs/revisao-regioes-v7-bagaceira.md §3","t":"17:00"},{"ti":"Galway a pé: Spanish Arch, Claddagh, Museu","b":"Chuva pesada ou cansaço da ilha: <b>Spanish Arch, Claddagh, o Long Walk e o Museu da Cidade (grátis)</b> — o roteiro de chegada da sexta, que com a Priscila e o Richie pode não ter saído inteiro.","src":"days/2026-10-02.json 09:00","t":""},{"ti":"Salthill pela promenade","b":"Tarde de ar livre sem corrida: <b>Salthill a pé pela promenade</b>, com o chute no muro no fim, como manda a tradição. Era a tarde de sábado que dependia do que os dois quisessem mostrar.","src":"days/2026-10-03.json tarde","t":""}]},{"id":"2026-10-06.3.noite","h":"noite","t":null,"c":"note","b":"<b>The Crane Bar</b>, Sea Road, andar de cima: se houver sessão, é o fundo da sua cerveja. Ou o Tigh Cóilí.","ti":"Crane Bar, Sea Road — a pinta da noite","kind":"do","place":"The Crane Bar","maps":"The Crane Bar, Sea Road, Galway","dur":90,"alts":[{"ti":"Tigh Cóilí, Mainguard Street","b":"A segunda opção do próprio dia: <b>Tigh Cóilí</b>, Mainguard Street, sessão às 18:00 e 21:30 todos os dias do ano — se houver música no canto, é fundo. Não serve comida.","src":"days/2026-10-06.json noite + days/2026-10-02.json noite + docs/adendo-noite-rotas-cenicas-carro.md (Galway: horários fixos)","t":""},{"ti":"Garavan's, 46 William Street","b":"<b>Garavan's</b>, 46 William St — City Bar of the Year 2025, balcão de whiskey (flights de €15 a €100+) e snugs. Descrito na pesquisa como <i>a melhor sala única para beber sozinho</i>. Sem música como programa.","src":"docs/adendo-noite-rotas-cenicas-carro.md (Galway: balcão e whiskey)","t":""},{"ti":"Tigh Neachtain, 17 Cross Street","b":"<b>Tigh Neachtain</b>, 17 Cross Street: o pub velho de balcão comprido que fecha a noite de domingo e a de quarta no plano. Se a ilha e a corrida esgotaram, é pinta e cama cedo — amanhã é a estrada do Burren até os Cliffs, cedo (ou o 350 das 07:00, se não quiser dirigir).","src":"days/2026-10-04.json 16:25 + days/2026-10-07.json por quê, 07:00 e onde comer + docs/adendo-noite-rotas-cenicas-carro.md (balcão comprido)","t":""}]},{"id":"2026-10-06.4.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Café da manhã no B&B da ilha, e a balsa das 09:00. Em Galway, antes de Ballybrit: <b>GBC, Williamsgate Street</b> (08:00–16:30) ou <b>Tigh Neachtain</b> (11:00–16:00) — dentro do hipódromo é bancada cara e fila. Depois da corrida, <b>o Crane Bar não serve comida</b>: jante antes no <b>Dela</b> (51 Dominick St Lower) ou no <b>Rúibín</b> (1 Dock Road, seg–sáb 12:00–23:00).","ti":"Comer: GBC antes, Dela ou Rúibín depois","kind":"do","place":"GBC — Galway Bakery Company","maps":"GBC Galway Bakery Company, 7 Williamsgate Street, Galway","dur":60,"alts":[{"ti":"McSwiggans, 3 Eyre Street — ostra nativa","b":"Antes do 409, a um passo da Eyre Square: <b>McSwiggans</b>, 3 Eyre Street, ostra nativa no auge de outubro (<b>€19,50 a meia dúzia</b>) e chowder €13,50, almoço seg–sex 12:00–15:30. Substitui GBC ou Neachtain se um dos dois estiver cheio.","src":"extra_EAT.json 03/10 + docs/onde-comer-cork-galway.md (ostras; €€)","t":"12:00"},{"ti":"Handsome Burger, 49 Dominick St Lower","b":"Jantar barato e rápido no West End, na mesma rua do Dela e a poucos minutos do Crane Bar: <b>Handsome Burger</b>, €10,50, tido como o melhor hambúrguer da Irlanda.","src":"extra_EAT.json 03/10 + docs/onde-comer-cork-galway.md (€ até 15)","t":""},{"ti":"Ard Bia at Nimmo's, Spanish Arch","b":"Se o Dela e o Rúibín estiverem cheios: <b>Ard Bia at Nimmo's</b>, no Spanish Arch, jantar ter–dom 18:00–21:00 (irlandês com toque norte-africano). Dá tempo de jantar e seguir para o Crane Bar depois.","src":"docs/onde-comer-cork-galway.md (€€ 15–35)","t":"18:00"}]}]},{"d":"2026-10-07","wd":"QUA","dt":"07/10","ti":"★ Cliffs of Moher pela costa do Burren — de carro, ou de ônibus","base":"Galway → Burren → Doolin → Cliffs → Galway","rg":"west","tags":["~€27","★"],"note":"Se a sessão de Doolin te tentar: o 18:33 → 20:13 e o 20:10 → 21:42 ainda te trazem de volta. Mas o 51 para Cork sai cedo na quinta.","lead":"Cliffs antes das onze: falésia vazia e ingresso a €8. Almoço em Doolin, volta a Galway e mala pronta — amanhã é Cork.","etq":[7,1],"ev":[{"id":"2026-10-07.0.por-que","h":"por quê","t":null,"c":"note","b":"A Priscila recomendou (“lindíssimo”), e pela sua régua é o caso clássico do turístico que entrega: 214 metros de falésia caindo no Atlântico. <b>Com o carro alugado, o dia vira a estrada do Burren</b>: Kinvara (castelo de Dunguaire), Ballyvaughan, o farol de Black Head, Fanore, Doolin, os Cliffs (estacionamento incluído no ingresso), Lisdoonvarna e volta — ~200 km de calcário, mar e nenhuma cidade. Chegue nos Cliffs antes das 11:00: ingresso a €8 e falésia vazia. O ônibus 350 abaixo continua valendo se você preferir não dirigir.","ti":"Por que os Cliffs — e a estrada do Burren","kind":"info","place":"Cliffs of Moher","maps":"Cliffs of Moher, Liscannor, Co. Clare","dur":0,"alts":[]},{"id":"2026-10-07.1.07-00","h":"07:00","t":"07:00","c":"time","b":"<b>Bus Éireann 350 sai do Galway BUS STATION, ao lado da estação Ceannt — não do Coach Station.</b> 07:00 → Doolin 08:40 → <b>Cliffs 08:54</b>. €9,45 com Leap/TFI Go (€13,50 em dinheiro). Ir cedo é a jogada: às nove da manhã as falésias são suas; a partir das onze chegam os ônibus de tour. Alternativa: 09:00 → 10:58.","ti":"Bus 350 — Galway Bus Station 07:00","kind":"do","place":"Galway Bus Station","maps":"Galway Bus Station, Galway (ao lado da Ceannt Station)","dur":114,"alts":[{"ti":"De carro: a estrada do Burren","b":"Com o carro alugado o dia vira a costa do Burren: Kinvara (castelo de Dunguaire), Ballyvaughan, farol de Black Head, Fanore, Doolin, os Cliffs (estacionamento incluído no ingresso), Lisdoonvarna e volta — ~200 km. Saia cedo para chegar nos Cliffs antes das 11:00 e pagar €8.","src":"plano.json 07/10 por quê + extra_CARRO.json 'Quarta 7'","t":"08:00"},{"ti":"O 350 das 09:00","b":"Se perder o das 07:00, o 350 seguinte sai às 09:00 e chega nos Cliffs às 10:58 — ainda dentro da faixa de ingresso de €8 (08–11), mas já com os ônibus de tour chegando.","src":"plano.json 07/10 evento 07:00","t":"09:00"},{"ti":"Burren Loop — o plano de chuva de carro","b":"Se o tempo fechar, o loop do Burren: 66 km, ~1h de Galway — Ballyvaughan, Carran, Kilfenora, Lisdoonvarna, Fanore, Black Head e Corkscrew Hill. Sem acostamento, dirija devagar.","src":"docs/adendo-noite-rotas-cenicas-carro.md 'Plano de chuva'","t":""}]},{"id":"2026-10-07.2.09-00","h":"09:00","t":"09:00","c":"time","b":"<b>Cliffs of Moher Experience</b>, outubro 08:00–19:00. Ingresso online: <b>€8 no horário da manhã (08–11)</b>, €12 no pico (11–16), €15 na porta. Torre O'Brien e 800 m de trilha pavimentada. ⚠️ <b>A trilha costeira de Doolin até os Cliffs está fechada</b> (só o trecho Doolin → Surfers Path abre) — não dá para entrar a pé por fora.","ti":"Cliffs of Moher — torre O'Brien, antes das 11","kind":"do","place":"Cliffs of Moher Experience","maps":"Cliffs of Moher Visitor Experience, Liscannor, Co. Clare","dur":90,"alts":[{"ti":"Burren Loop de carro (chuva ou névoa)","b":"Sem visibilidade nos Cliffs, o dia rende mais na estrada: Burren Loop, 66 km, ~1h de Galway, por Ballyvaughan, Carran, Kilfenora, Lisdoonvarna, Fanore e Black Head. Calcário, mar e nenhuma cidade — sem acostamento.","src":"docs/adendo-noite-rotas-cenicas-carro.md 'Plano de chuva' + plano.json 07/10 por quê","t":""},{"ti":"Caherconnell — o forte escavado do Burren","b":"<b>Caherconnell</b>, no Burren, €12 (ou €23 com demonstração de cães pastores): sítio de escavação ativo com field school, habitado do séc. X ao XVII, vale mais que o Poulnabrone ao lado. Outubro 10:00–16:00. Fica na sua estrada de carro pelo Burren.","src":"docs/dossie-pesquisa-irlanda-porto.md 'Fortes' + plano.json 07/10 por quê","t":"10:00"},{"ti":"Ballinasloe Mart, gado às 11:00","b":"Só no plano de chuva — o Richie foi claro: “No. Leave the men to it.” Era o plano B do dia de carro: quarta é dia de venda de gado no <b>Ballinasloe Mart</b>, às 11:00 (090 964 2384). Vá ao escritório primeiro e diga que só está olhando; sente no fundo da arquibancada e nunca levante a mão. A cantina do andar de cima serve por ~€8–12.","src":"extra_BANDS.json índice 12 (mart) + extra_ETIQUETTE.json 'Mart de gado' + docs/revisao-regioes-v7-bagaceira.md (Ballinasloe Mart)","t":"11:00"}]},{"id":"2026-10-07.3.10-48","h":"10:48","t":"10:48","c":"time","b":"Ônibus Cliffs → <b>Doolin</b> 10:59 (€2,60), ou o 12:05. Doolin é a vila dos pubs de sessão: <b>Gus O'Connor's</b> (Fisher St, 065 707 4168), <b>McGann's</b> (Roadford, 065 707 4133) e <b>McDermott's</b> (Roadford, comida 11:45–21:00). Sessão só à noite em outubro — de dia é almoço, pinta e o porto.","ti":"Doolin: o porto e os três pubs","kind":"do","place":"Doolin","maps":"Doolin, Co. Clare","dur":180,"alts":[{"ti":"Ficar mais nos Cliffs e pegar o 12:05","b":"Se as falésias estiverem rendendo, o ônibus seguinte Cliffs → Doolin é o das 12:05 (€2,60). Ainda dá tempo de almoçar em Doolin antes do 14:21 de volta.","src":"plano.json 07/10 evento 10:48","t":"12:05"},{"ti":"Ballyvaughan ou Ennistymon em vez de Doolin","b":"A pesquisa foi dura com Doolin (“95% são turistas e os outros 5% são funcionários”) e apontou <b>Ballyvaughan</b>, <b>Ennistymon</b> e Kilkee como as vilas de verdade da região. De carro, Ballyvaughan já está na sua estrada de volta.","src":"docs/dossie-pesquisa-irlanda-porto.md tabela 'Doolin como base'","t":""},{"ti":"Lisdoonvarna — Burren Smokehouse","b":"Se estiver de carro, Lisdoonvarna fica no caminho de volta: o <b>Burren Smokehouse</b> é um dos produtores que recebem visita, com o “Taste the Atlantic – Salmon Experience”.","src":"docs/dossie-pesquisa-irlanda-porto.md 'Produtores que recebem visita' + plano.json 07/10 por quê","t":""}]},{"id":"2026-10-07.4.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Almoço num dos três pubs de Doolin — chowder, peixe do dia, Guinness stew — todos servem o dia inteiro. No centro de visitantes dos Cliffs há café, mas é a comida de balcão de armadilha; coma em Doolin. À noite, a última de Galway: <b>Tigh Neachtain</b>.","ti":"Almoço: chowder num pub de Doolin","kind":"do","place":"Gus O'Connor's","maps":"Gus O'Connor's Pub, Fisher Street, Doolin, Co. Clare","dur":60,"alts":[{"ti":"McGann's ou McDermott's (Roadford)","b":"Se o Gus O'Connor's estiver lotado de tour, os outros dois pubs de Doolin ficam em Roadford: <b>McGann's</b> (065 707 4133) e <b>McDermott's</b> (comida 11:45–21:00). Mesmo cardápio de vila: chowder, peixe do dia, Guinness stew.","src":"plano.json 07/10 evento 10:48","t":"12:30"},{"ti":"Vaughan's on the Prom, Lahinch — chipper","b":"De carro, em Lahinch: <b>Vaughan's on the Prom</b>, o chipper da lista do Irish Times — massa com isca-mãe de 19 anos e batata frita em sebo de boi. Fish and chips de verdade em vez de pub de turista.","src":"docs/dossie-pesquisa-irlanda-porto.md 'Fish and chips que valem'","t":""},{"ti":"Jantar em Galway: Dela ou Rúibín","b":"À noite, se quiser comer antes do Tigh Neachtain (ele só serve até 16:00, e Crane Bar e Tigh Cóilí não servem nada): <b>Dela</b>, 51 Dominick St Lower, ou <b>Rúibín</b>, 1 Dock Road, seg–sáb 12:00–23:00.","src":"extra_EAT.json 06/10 + extra_EAT.json 02/10","t":"19:00"}]},{"id":"2026-10-07.5.14-21","h":"14:21","t":"14:21","c":"time","b":"Volta: Doolin → Galway 14:21 → 16:14, ou 16:08 → 18:02 (o último é 23:15 → 00:50). Noite de despedida de Galway e mala pronta: amanhã o ônibus para Cork sai cedo.","ti":"Volta a Galway 14:21 e a última noite","kind":"do","place":"Doolin (parada do 350)","maps":"Doolin bus stop, Doolin, Co. Clare","dur":113,"alts":[{"ti":"O 350 das 16:08 → 18:02","b":"Se Doolin estiver bom, o próximo 350 sai às 16:08 e chega em Galway às 18:02. Ainda sobra a noite no Tigh Neachtain e a mala.","src":"plano.json 07/10 evento 14:21","t":"16:08"},{"ti":"Ficar para a noite em Doolin: 18:33 ou 20:10","b":"Se a sessão de Doolin te tentar como fundo da pinta, o 18:33 → 20:13 e o 20:10 → 21:42 ainda te trazem de volta. Só não esqueça: o 51 para Cork (ou o carro) sai cedo na quinta.","src":"plano.json 07/10 note + extra_CARRO.json 'Quinta 8'","t":"18:33"},{"ti":"Noite: Crane Bar, Tigh Cóilí ou Garavan's","b":"Se o Tigh Neachtain estiver cheio, as outras salas de Galway da viagem: <b>The Crane Bar</b>, Sea Road (andar de baixo, sessão 21:30 sete noites), <b>Tigh Cóilí</b>, Mainguard Street, ou o balcão do <b>Garavan's</b>, 46 William St — a melhor sala para beber sozinho.","src":"plano.json 06/10 noite + plano.json 02/10 noite + docs/adendo-noite-rotas-cenicas-carro.md 'Galway' + docs/dossie-pesquisa-irlanda-porto.md (Crane Bar andar de baixo)","t":"21:00"}]}]},{"d":"2026-10-08","wd":"QUI","dt":"08/10","ti":"Galway → Cork. Mercado, o jantar do Goldie e noite de pub","base":"Cork","rg":"cork","tags":["~€60 o jantar"],"note":"","lead":"Carro até Cork, tripe and drisheen no Farmgate, o único jantar caro no Goldie e o Sin É depois. Música é pano de fundo.","etq":[1,6],"ev":[{"id":"2026-10-08.0.manha","h":"manhã","t":null,"c":"note","b":"<b>De carro: Galway → Cork pela M18/M20 em ~2h45</b> (túnel de Limerick €2,30), chegando para o almoço com meio dia a mais de Cork. Sem carro seria o Bus Éireann 51, direto, 4h a 4h30. Estacionamento noturno em Cork: pergunte à hospedagem — o centro cobra €10–20 a noite.","ti":"De carro: Galway → Cork pela M18/M20","kind":"do","place":"Cork","maps":"Cork city centre, Cork, Ireland","dur":165,"alts":[{"ti":"Bus Éireann 51, direto Galway → Cork","b":"Sem carro (ou sem vontade de dirigir), o <b>Bus Éireann 51</b> vai direto de Galway a Cork em 4h a 4h30. Sai cedo na quinta — era o plano do dia antes do carro.","src":"days/2026-10-08.json manhã + days/2026-10-07.json note (\"o 51 para Cork sai cedo na quinta\") + extra_CARRO.json (Quinta 8: 2h45 contra 4h30 de ônibus)","t":""},{"ti":"Parada de ostra no Moran's, Kilcolgan","b":"Se quiser quebrar a viagem logo na saída de Galway: <b>Moran's Oyster Cottage, The Weir, Kilcolgan</b> — cottage de colmo de 300 anos, 7ª geração, ostra nativa dos bancos próprios (outubro é o auge, sem multidão). Ter–dom 13:00–21:00, reserva só por telefone +353 91 796113. Conta que a ostra vira o almoço do dia: o Farmgate fecha às 15:30. De ônibus é ruim (o X51 pode não parar e são 1,5–2 km a pé com mala); de carro é sem drama.","src":"docs/onde-comer-cork-galway.md (A ostra nativa + seção Moran's Oyster Cottage) e docs/adendo-noite-rotas-cenicas-carro.md (parada em Kilcolgan)","t":"13:00"}]},{"id":"2026-10-08.1.13-00","h":"13:00","t":"13:00","c":"time","b":"<b>English Market</b> (seg–sáb 08:00–18:00) e o <b>Coal Quay</b>. Almoço no Farmgate, dentro do mercado, no mezanino — a última porta do país que serve tripe and drisheen.","ti":"English Market e almoço no Farmgate","kind":"do","place":"English Market","maps":"English Market, Cork","dur":120,"alts":[{"ti":"Kay's Kitchen, dentro do mercado","b":"Se o Farmgate estiver cheio ou fechado: <b>Kay's Kitchen</b>, também dentro do English Market, qua–sáb 10:30–17:00 — o <b>Fish Box €15</b> (o Irish Examiner elogiou as batatas). Quinta abre.","src":"docs/onde-comer-cork-galway.md (English Market — comer dentro; filtro seg/ter/qua)","t":"13:00"},{"ti":"The Long Valley, doorstep sandwich","b":"<b>The Long Valley, 10 Winthrop Street</b>, todo dia 10:00–00:30: balcão comprido e o doorstep sandwich de spiced beef (corned beef €4,50). Almoço de balcão honesto.","src":"extra_EAT.json 08/10 + docs/onde-comer-cork-galway.md (Cork por faixa €) + docs/adendo-noite-rotas-cenicas-carro.md (balcão comprido)","t":"13:30"},{"ti":"Blackrock Castle Observatory","b":"Se chover e sobrar tarde depois do mercado: <b>Blackrock Castle Observatory</b>, €11, todos os dias 10:00–20:00 (horário raro na Irlanda) — universidade + observatório + exposição \"Ireland in Space\". Tarde coberta e história.","src":"docs/dossie-pesquisa-irlanda-porto.md (Blackrock Castle Observatory)","t":"15:30"}]},{"id":"2026-10-08.2.19-30","h":"19:30","t":"19:30","c":"time","b":"⭐ <b>Goldie, 128 Oliver Plunkett Street</b> — o único jantar caro da viagem, movido para hoje porque o sábado agora é em Dublin. 28 lugares, qua–sáb, <b>reserve: 021 239 8720</b>. Aishling Moore, peixe de barco de um dia de Ballycotton, principais €23–35. O Richie, sem saber da lista, escolheu o mesmo.","ti":"Jantar: Goldie — reserve 021 239 8720","kind":"do","place":"Goldie","maps":"Goldie, 128 Oliver Plunkett Street, Cork","dur":120,"alts":[{"ti":"Ichigo Ichie Bistro","b":"Se o Goldie não tiver mesa: <b>Ichigo Ichie Bistro</b> (Miyazaki), Bib Gourmand, qua–sáb — jantar para dois com bebidas ~€116. Ex-kaiseki estrelado que virou bistrô casual; quinta abre.","src":"docs/onde-comer-cork-galway.md (Cork por faixa €€ + filtro seg/ter/qua)","t":"19:30"},{"ti":"Elbow Lane — nano-cervejaria e defumadora","b":"<b>Elbow Lane</b>, 7 dias, faixa €15–35: nano-cervejaria + defumadora, no 100 Best da McKennas'. Cerveja da casa e carne defumada — a opção que sempre está aberta.","src":"docs/onde-comer-cork-galway.md (Cork por faixa €€)","t":"19:30"},{"ti":"Miyazaki, 1A Evergreen Street","b":"<b>Miyazaki</b>, 6 lugares, ter–dom, 100 Best da McKennas' — o melhor custo-benefício de comida séria em Cork. Usa crubeens do mercado em preparações japonesas: pergunte pelo especial do dia. Chegue cedo, são só seis lugares.","src":"docs/onde-comer-cork-galway.md (Cork por faixa € + crubeens)","t":"19:00"}]},{"id":"2026-10-08.3.noite","h":"noite","t":null,"c":"note","b":"Depois do jantar, pub sem programa: <b>Sin É, rua Coburg 8</b> (sessão rolando no canto até meia-noite na semana do festival) e o <b>Welcome Inn, Parnell Place 24</b>, de 1845, o último early house da Irlanda.","ti":"Sin É e o Welcome Inn, sem programa","kind":"do","place":"Sin É","maps":"Sin É, 8 Coburg Street, Cork","dur":150,"alts":[{"ti":"The Corner House, 7 Coburg Street","b":"Na mesma rua do Sin É: <b>The Corner House</b> — \"no TVs, no background music, and no food\". Na semana do festival tem sessão grátis às 18:00 e às 21:00. Se o Sin É estiver lotado, é a porta ao lado.","src":"docs/revisao-regioes-v7-bagaceira.md (programa grátis do Cork Folk Festival) + docs/adendo-noite-rotas-cenicas-carro.md (pub de conversa)","t":"21:00"},{"ti":"An Spailpín Fánach, 29 South Main St","b":"Pub de 1779, sem TV, Beamish da casa; sessão às 21:30 na quinta, grátis. O líder diz que se apresentam a quem chega. Pinta e conversa — a música fica no canto.","src":"docs/adendo-noite-rotas-cenicas-carro.md (Cork — QUI An Spailpín 21:30; session qui 21h30, Hammy Hammond) + docs/revisao-regioes-v7-bagaceira.md (An Spailpín 21:30 grátis; pub de 1779, sem TV, Beamish da casa)","t":"21:30"},{"ti":"The Hi-B, 108 Oliver Plunkett St","b":"Se sair do Goldie sem vontade de música nenhuma: <b>The Hi-B</b>, 1º andar, na mesma rua do restaurante — pub de conversa, <b>celular proibido</b>. Só balcão e gente.","src":"docs/adendo-noite-rotas-cenicas-carro.md (pub de conversa 40+)","t":"21:30"}]},{"id":"2026-10-08.4.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Almoço dentro do English Market: ⭐ <b>Farmgate Café</b>, no mezanino — <b>a última porta do país que serve tripe and drisheen</b> (ter–sex 09:00–15:30; 021 427 8134). Para levar: <b>A. O'Reilly's</b>, o último fabricante de drisheen da Irlanda, €2 a porção. Jantar: <b>Goldie</b>, reservado. Antes do Sin É, se sobrar fome: ⭐ <b>The Long Valley, 10 Winthrop Street</b> (todo dia 10:00–00:30), o doorstep sandwich de spiced beef.","ti":"Comer: Farmgate, Goldie e o Long Valley","kind":"do","place":"Farmgate Café","maps":"Farmgate Café, English Market, Cork","dur":60,"alts":[{"ti":"Kay's Kitchen — Fish Box €15","b":"Dentro do mesmo English Market, qua–sáb 10:30–17:00. Se o Farmgate fechar a cozinha às 15:30 antes de você chegar, é a mesa de almoço que sobra no mercado.","src":"docs/onde-comer-cork-galway.md (English Market — comer dentro)","t":"13:30"},{"ti":"Bracken's, Paul Street — toasted special","b":"O melhor toasted special da cidade segundo o Yay Cork. Está na faixa € (até 15) da lista de Cork — lanche barato.","src":"docs/onde-comer-cork-galway.md (Cork — outros pratos + Cork por faixa €)","t":""},{"ti":"Tony's Bistro, 69 North Main Street","b":"Full Irish a <b>€9</b>, todo dia 08:30–17:00 — fritada de porção descomunal a preço de banca. Serve para um almoço tardio, não para antes do Goldie (fecha às 17:00).","src":"docs/onde-comer-cork-galway.md (Cork por faixa €) + docs/adendo-dublin-porto-ultima-noite.md (Tony's Bistro, 69 North Main Street, 08:30–17:00)","t":""}]}]},{"d":"2026-10-09","wd":"SEX","dt":"09/10","ti":"★ O dia de carro — Beara, o Healy Pass e o caranguejo de Castletownbere","base":"Cork → Beara → Cork","rg":"cork","tags":["~€135","★"],"note":"⚠️ Saída às 08:00 é obrigatória: são 4h30 de estrada estreita, o sol se põe às 19:00 em Castletownbere, e os galgos não esperam. Plano de chuva: ônibus 237 às 09:00, mart de Skibbereen às 11:00 (sentado no fundo, almoço no restaurante do mart) e os mesmos galgos à noite.","lead":"Dia de carro: Beara, caranguejo em Castletownbere, o Healy Pass e os galgos à noite. Saída às 08:00, sem exceção.","etq":[5,1,6],"ev":[{"id":"2026-10-09.0.por-que","h":"por quê","t":null,"c":"note","b":"O Richie disse duas coisas: <i>“leave the men to it”</i> sobre o mart, e <i>“some of the best crab/shellfish in the country”</i> sobre Castletownbere. O mart saiu, e a sexta virou o dia de natureza de Cork — pela península de Beara, com o almoço de marisco no meio. Sobre os galgos, o Richie: “pode ser legal, principalmente porque é na sexta”.","ti":"Por que Beara: o Richie e o caranguejo","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-09.1.08-00","h":"08:00","t":"08:00","c":"time","b":"<b>O carro alugado</b> (sem ele seria um GoCar da estação Kent, ~€125). Cork → N22 → Macroom → R584 por Ballingeary e o Pass of Keimaneigh → <b>Glengarriff</b> (93 km) → R572 pela costa da baía de Bantry → <b>Castletownbere</b> (34 km). Chegada ~11:00: o segundo maior porto pesqueiro de peixe branco da Irlanda, e ainda porto de trabalho.","ti":"Carro: Cork → Glengarriff → Castletownbere","kind":"do","place":"Castletownbere","maps":"Castletownbere, The Square, Co. Cork","dur":180,"alts":[{"ti":"Plano de chuva: ônibus 237 e mart de Skibbereen","b":"Ônibus <b>237</b> às 09:00 pela N71 até Skibbereen; o mart roda com dois ringues às 11:00. Vá ao escritório primeiro e diga <b>“I'm just here to look, I'm not buying”</b>, sente no fundo da arquibancada e almoce no restaurante do mart (~€8–12; tel. 028 21066). Os galgos à noite continuam iguais.","src":"days/2026-10-09.json note; extra_BANDS.json marts idx 14; docs/richie-veredito-e-decisoes-12-09.md decisão 09/10; extra_ETIQUETTE.json Mart","t":"09:00"},{"ti":"Kinsale pelo ônibus 226 e o Fishy Fishy","b":"Se o carro falhar de vez: Kinsale pela rota 226, almoço no <b>Fishy Fishy</b> (todos os dias a partir do meio-dia, 100 Best) e Charles Fort. Bate-volta curto que devolve você a Cork a tempo dos galgos.","src":"docs/onde-comer-cork-galway.md Bate-voltas (Kinsale)","t":""}]},{"id":"2026-10-09.2.onde-comer","h":"onde comer","t":null,"c":"eat","b":"⭐ <b>Breen's Lobster Bar, The Square</b> — peixe e marisco desembarcados ali: sanduíche aberto de caranguejo, gratinado de caranguejo, salada de caranguejo. Sex 12:00–17:00 e 17:30–21:30 (horário de fonte não oficial: <b>027 70031</b>). ⭐ <b>MacCarthy's Bar, The Square</b> — bar que ainda é mercearia, das irmãs MacCarthy, seg–sáb 09:30–23:30 (027 70014); o sanduíche de caranguejo é lenda de guia, confirme no balcão e leve dinheiro. <b>Lynch's on the Pier</b> para peixe com batata.","ti":"Almoço: Breen's Lobster Bar, caranguejo","kind":"do","place":"Breen's Lobster Bar","maps":"Breen's Lobster Bar, The Square, Castletownbere, Co. Cork","dur":60,"alts":[{"ti":"MacCarthy's Bar, The Square","b":"Bar que ainda é mercearia, das irmãs MacCarthy, seg–sáb 09:30–23:30 (027 70014). O sanduíche de caranguejo é lenda de guia: confirme no balcão e leve dinheiro. Na mesma praça do Breen's.","src":"days/2026-10-09.json onde comer; docs/adendo-noite-rotas-cenicas-carro.md Ring of Beara","t":"12:00"},{"ti":"Lynch's on the Pier — peixe com batata","b":"O fish and chips do porto, no cais de Castletownbere. Serve se o caranguejo acabou ou se a pressa é chegar ao Healy Pass.","src":"days/2026-10-09.json onde comer; docs/adendo-noite-rotas-cenicas-carro.md Ring of Beara","t":"12:00"}]},{"id":"2026-10-09.3.13-30","h":"13:30","t":"13:30","c":"time","b":"<b>Healy Pass (R574)</b>: 27 km de Castletownbere até o topo pela estrada em ziguezague mais bonita do sul da Irlanda, na divisa de Cork com Kerry. Desce para <b>Lauragh</b>, segue por <b>Kenmare</b> (25 km; parada de café) e volta a Cork por Kilgarvan e a N22 (97 km). Total: <b>~280 km, 4h30 de direção pura — conte 5h30 a 6h com paradas</b>.","ti":"Healy Pass, Lauragh, Kenmare e volta a Cork","kind":"do","place":"Healy Pass","maps":"Healy Pass, R574, Adrigole, Co. Cork","dur":300,"alts":[{"ti":"Caha Pass (N71): Glengarriff → Kenmare","b":"Se o Healy Pass estiver fechado ou na névoa: volte a Glengarriff e suba pelo <b>Caha Pass, N71</b> — 27 km, 320 m, túneis abertos à mão em 1842, “a melhor sensação de dirigir por km”. Chega a Kenmare do mesmo jeito e segue pela N22 para Cork.","src":"docs/adendo-noite-rotas-cenicas-carro.md Ring of Beara + Healy Pass","t":"13:30"},{"ti":"Volta direta pelo caminho da ida","b":"Se o almoço atrasou e os galgos estão em risco: Castletownbere → R572 → Glengarriff → R584 → Macroom → N22 para Cork, o caminho da ida sem a subida. Encurta o dia e evita dirigir no escuro — o plano não recomenda volta noturna para estreante na mão inglesa.","src":"days/2026-10-09.json 08:00; docs/adendo-noite-rotas-cenicas-carro.md Ring of Beara (aviso saindo de Cork)","t":"14:00"}]},{"id":"2026-10-09.4.18-30","h":"18:30","t":"18:30","c":"time","b":"Carro de volta ao estacionamento da hospedagem. Ônibus <b>205/208/219</b> sentido MTU/Bishopstown — para os galgos não se dirige.","ti":"Deixar o carro e pegar o 205/208/219","kind":"do","place":"Curraheen Park","maps":"Curraheen Park, Bishopstown, Cork","dur":30,"alts":[]},{"id":"2026-10-09.5.19-35","h":"19:35","t":"19:35","c":"time","b":"<b>Galgos em Curraheen Park, €10</b> — portões 18:30, 1º páreo 19:35. Richie: <i>“which would you actually bring a foreign mate to? The dogs.”</i> Tote na mão, aposta mínima, arquibancada coberta. Cama cedo: o trem de amanhã é às 07:00.","ti":"Galgos em Curraheen Park, €10","kind":"do","place":"Curraheen Park","maps":"Curraheen Park, Bishopstown, Cork","dur":150,"alts":[{"ti":"Sin É, 8 Coburg Street","b":"Pub sem programa: na semana do Cork Folk Festival a sessão roda no canto das 18:00 à meia-noite, grátis — a das 18:00 é a adulta e tranquila. Se chegou tarde da estrada ou os galgos não rolaram, é aqui.","src":"days/2026-10-08.json noite; extra_BANDS.json Cork Folk Festival idx 13–14; docs/adendo-noite-rotas-cenicas-carro.md Lee Sessions","t":"20:00"},{"ti":"An Spailpín Fánach, 29 South Main St","b":"Pub de 1779, sem TVs, sessão às 21:30 de quinta a sábado: o dono diz que os músicos se apresentam a quem chega. É o pub que o Richie escolheu para as noites de Cork.","src":"extra_RICHIE.json Noites de Cork; docs/adendo-noite-rotas-cenicas-carro.md pubs de Cork; docs/adendo-dublin-porto-ultima-noite.md An Spailpín (pub de 1779)","t":"21:30"},{"ti":"Welcome Inn, 24 Parnell Place","b":"De 1845, o último early house da Irlanda, pub de conversa. Não serve comida — coma antes no <b>Long Valley, 10 Winthrop St</b> (todo dia até 00:30, doorstep sandwich).","src":"days/2026-10-08.json noite e onde comer; extra_BANDS.json Welcome Inn idx 13; docs/adendo-noite-rotas-cenicas-carro.md pub de conversa","t":"21:00"}]}]},{"d":"2026-10-10","wd":"SÁB","dt":"10/10","ti":"Cork → Dublin, e o quintal deles","base":"Cork → Dublin","rg":"cork","tags":["com eles"],"note":"Se você for comprar a carne do churrasco, hoje é o dia: os açougues de Dublin abrem no sábado de manhã e domingo fecha tudo.","lead":"Cedo pela M8 até Dublin; Howth ou Wicklow com a Priscila e o Richie; a carne do churrasco compra-se hoje. Slatt's à noite.","etq":[6,5],"ev":[{"id":"2026-10-10.0.07-30","h":"07:30","t":"07:30","c":"time","b":"<b>Cork → Dublin pela M8/M7, ~2h45</b>, pedágios €2,30 + €2,30; em Dublin às 10:30. É <b>este carro que faz o dia deles acontecer</b>: o Richie não tem carro, e Wicklow sem carro não existe.","ti":"Cork → Dublin de carro pela M8/M7, ~2h45","kind":"do","place":"Cork → Dublin pela M8/M7","maps":"Cork, Ireland","dur":165,"alts":[{"ti":"Trem Cork → Dublin Heuston, 07:00 → 09:28","b":"Só se o carro falhar: trem da estação Kent às <b>07:00, chegando a Heuston às 09:28</b>, €26,99 online (€47,35 no guichê). Mas sem carro o dia de Wicklow com eles não existe — sobra Howth de DART.","src":"docs/roteiro-fontes-build.md l.544 e docs/richie-veredito-e-decisoes-12-09.md item 4","t":"07:00"},{"ti":"Sair às 09:00 e parar em Thurles (se houver final)","b":"Se a final de hurling cair hoje, a saída vira 09:00: M8 até a saída 6 (Horse and Jockey), N62 até Thurles — 114 km, 81 min, €2,30. Retoma às 17:30 pela saída 5 (Twomileborris), 149 km, 112 min, chegando a Dublin ~19:45. Desvio de +11 min e €0 de pedágio.","src":"docs/churrasco-11-10-e-final-hurling-18-09.md, tabela de Thurles; extra_DOUBTS.json #16","t":"09:00"}]},{"id":"2026-10-10.1.o-dia","h":"o dia","t":null,"c":"note","b":"Com a Priscila e o Richie, no carro, o que eles propuseram: <b>Howth</b> (a trilha dos penhascos é um loop de 7,8 km, ~2 h, e o peixe do porto), ou <b>Wicklow</b>: o Guinness Lake (Lough Tay) é privado e sem acesso — o mirante autorizado é o do <b>J.B. Malone, em Ballinastoe Woods, na R759</b> — e daí o Sally Gap. ⚠️ <b>A trilha de Bray a Greystones continua fechada</b> (Câmara de Wicklow, 02/09/2026): se for Bray, é o loop do Bray Head.","ti":"Howth ou Wicklow com a Priscila e o Richie","kind":"do","place":"Howth Cliff Path Loop","maps":"Howth Cliff Path Loop, Howth, Dublin","dur":240,"alts":[{"ti":"Loop do Bray Head (1h–1h30)","b":"Se Howth lotar ou o tempo apertar: <b>Bray Head Loop / Bray Head Cross</b>, 1h ida e volta ou ~1h30 no loop. É o substituto oficial da Bray–Greystones, fechada até 2029. O calçadão de Bray é kitsch; suba direto.","src":"docs/dossie-pesquisa-irlanda-porto.md §5 (Bray–Greystones fechada; substituto) e o próprio dia 10/10","t":""},{"ti":"Glendalough — Rota Branca (Spinc), 9,5 km","b":"Com o carro, Wicklow pode virar <b>Glendalough</b>: cidade monástica grátis e a <b>Rota Branca (Spinc & Glenealo, 9,5 km, 3h30)</b>, boardwalk sobre o Upper Lake — em 40 min de subida você deixa 90% da multidão. Estacionamento: Upper Lake €5, Visitor Centre €4, <b>Laragh grátis</b> (3 km a pé). Chegue antes das 9h ou aceite Laragh.","src":"docs/dossie-pesquisa-irlanda-porto.md §5 (Wicklow) e tabela de trilhas","t":""},{"ti":"Chuva: Wicklow Wolf Taproom, Newtownmountkennedy","b":"Se chover feio, a alternativa de cerveja no quintal deles: <b>Wicklow Wolf Taproom</b>, em Newtownmountkennedy, sábado 08:00–19:00, tour €20 no sábado à tarde (reservar), pizza qui–dom.","src":"docs/dossie-pesquisa-irlanda-porto.md §5 (Wicklow) e §cervejarias","t":""}]},{"id":"2026-10-10.2.se-a-final-cair-hoje","h":"⚡ se a final cair hoje","t":null,"c":"warn","b":"<b>Este é o único dia que a final pode tomar sem quebrar nada</b> — e ela nem custa desvio: Thurles fica praticamente em cima da estrada. Vira: sai de Cork às 09:00, <b>M8 até a saída 6 (Horse and Jockey), N62 até Thurles — 114 km, 81 min, €2,30</b>; almoço no Hayes Hotel; final intermediária ~12:30 e a sênior ~15:45; e às 17:30 você retoma a viagem, <b>saída 5 (Twomileborris) sentido norte, 149 km, 112 min, €2,30</b>, chegando a Dublin ~19:45. <b>Total do desvio: +8,5 km, +11 minutos e €0 de pedágio a mais.</b> Quem perde o dia é Wicklow, não o churrasco.","ti":"Se a final for hoje: Thurles na estrada","kind":"info","place":"Semple Stadium, Thurles","maps":"Semple Stadium, Thurles, Co. Tipperary","dur":0,"alts":[]},{"id":"2026-10-10.3.onde-comer","h":"onde comer","t":null,"c":"eat","b":"Em Howth: <b>Beshoff Bros, Harbour Road</b> — este é o Beshoff certo, não o da O'Connell Street — e o <b>The Bloody Stream</b>, o pub dentro do prédio da estação; o mercado de Howth roda no fim de semana. Em Wicklow, eles escolhem: é o quintal deles. <b>Se o dia virar Thurles:</b> almoço no <b>Hayes Hotel, Liberty Square</b> (0504 22122) — em dia de jogo servem carvery do meio-dia às 21:30.","ti":"Almoço: Beshoff Bros ou Bloody Stream, Howth","kind":"do","place":"Beshoff Bros, Howth","maps":"Beshoff Bros, Harbour Road, Howth, Dublin","dur":60,"alts":[{"ti":"Octopussy's, Howth — sentado, peixe dos Doran","b":"Se o Beshoff estiver com fila ou você quiser sentar: <b>Octopussy's</b>, no porto de Howth, abastecido pela família Doran. Regra anti-armadilha: evite cardápio plastificado com foto na porta.","src":"docs/dossie-pesquisa-irlanda-porto.md §5 (Howth: comer)","t":""},{"ti":"Mercado de Howth (sáb 9–18h)","b":"O <b>mercado de Howth</b> roda sábado e domingo das 9 às 18h — comida de barraca para comer andando antes ou depois da trilha, e as focas de graça no West Pier.","src":"docs/dossie-pesquisa-irlanda-porto.md §5 (Howth) e o próprio dia 10/10","t":""},{"ti":"Se for Bray/Wicklow: Killruddery farm shop e café","b":"No lado de Wicklow, quem escolhe são eles; se pedirem sugestão: <b>Killruddery House & Gardens</b> (Bray) — fazenda em operação, jardins do século XVII, farm shop e café todos os dias 9–17h.","src":"docs/dossie-pesquisa-irlanda-porto.md §5 (Bray)","t":""}]},{"id":"2026-10-10.4.noite","h":"noite","t":null,"c":"note","b":"Dublin. Cama em <b>Inchicore</b> — ⚠️ confirme com quem te hospeda que o quarto vale sábado e domingo. Última no <b>Slatt's</b>, que a essa altura já é o seu pub.","ti":"Cama em Inchicore e a última no Slatt's","kind":"do","place":"Slatt's, Inchicore","maps":"Slatt's, 126A Tyrconnell Park, Inchicore, Dublin","dur":90,"alts":[{"ti":"Old Royal Oak, 11 Kilmainham Lane","b":"Se o Slatt's estiver fechado ou lotado: <b>Old Royal Oak, 11 Kilmainham Lane</b> — uma sala só, snug de verdade com passa-copos, aquecedor a gás dos anos 70, na mesma família desde 1837. Praticamente só bebida.","src":"days/2026-09-26.json noite; days/2026-10-11.json note; docs/adendo-dublin-porto-ultima-noite.md tabela Inchicore","t":""},{"ti":"Black Lion, 207A Emmet Road","b":"O pub mais antigo de Inchicore, documentado desde 1734. Atenção: cozinha só seg–sex 15:00–21:00 — no sábado é pint, não jantar.","src":"days/2026-09-25.json onde comer; docs/adendo-dublin-porto-ultima-noite.md tabela Inchicore","t":""},{"ti":"Confirme as noites avulsas de Tyrconnell Road","b":"Quem te hospeda precisa confirmar as <b>três noites avulsas: 10, 11 e 14/10</b> — o fim de semana com eles depende disso. O plano só tem substituto escrito para a noite de 14/10: <b>albergue no centro (~€22, cancelamento grátis)</b>. Os ônibus G1/G2 param em Inchicore Village e rodam 24h, se a noite acabar longe.","src":"extra_CONFIRMADO.json 'Base em Dublin'; docs/adendo-dublin-porto-ultima-noite.md (ação crítica da cama, noite de 14/10)","t":""}]}]},{"d":"2026-10-11","wd":"DOM","dt":"11/10","ti":"★ Churrasco na casa dos pais do Richie","base":"Dublin","rg":"dublin","tags":["★ o ponto alto"],"note":"Se sobrar noite e você ainda quiser uma última irlandesa de verdade: <b>Old Royal Oak</b>, Kilmainham Lane, uma sala só, na mesma família desde 1837. Amanhã a mala vai para o Porto.","lead":"Último dia irlandês inteiro: churrasco no quintal dos pais do Richie. Sem dirigir, sem trem, sem horário. Só a carne e a cerveja.","etq":[7],"ev":[{"id":"2026-10-11.0.o-dia","h":"★ o dia","t":null,"c":"star","b":"O último dia irlandês inteiro, e o mais bem encaixado no que você veio buscar. Desde a primeira mensagem você disse que queria <b>conhecer pessoas e lugares de verdade, estudando como respeitá-los</b>. Um churrasco no quintal de uma família irlandesa, convidado por um amigo, é isso — e não é uma coisa que se compra ingresso. <b>Sem dirigir, sem trem, sem horário.</b>","ti":"Churrasco na casa dos pais do Richie","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-11.1.confirmar","h":"⚠️ confirmar","t":null,"c":"warn","b":"<b>Onde moram os pais do Richie?</b> Eu montei o dia supondo Dublin ou arredores. Se for na estrada entre Cork e Dublin (Tipperary, Laois, Kildare), o churrasco pode virar a parada de sábado e o desenho fica ainda melhor — me diga e eu refaço. Se for no oeste, a gente conversa, porque aí ele brigaria com a semana de Galway.","ti":"Confirmar onde moram os pais do Richie","kind":"info","place":"","maps":"","dur":0,"alts":[]},{"id":"2026-10-11.2.a-oferta","h":"★ a oferta","t":null,"c":"star","b":"<b>Ofereça fazer a carne.</b> Churrasco irlandês é hambúrguer e salsicha na grelha; churrasco brasileiro é peça inteira, sal e tempo. Oferecer-se para assar é o melhor movimento social disponível na viagem inteira — e é a única coisa que você sabe fazer que ninguém ali sabe. Pergunte ao Richie antes: em casa de irlandês, quem manda na grelha é o pai.","ti":"Oferecer-se para assar a carne","kind":"do","place":"","maps":"","dur":300,"alts":[{"ti":"Se o pai não larga a grelha: presente","b":"Em casa de irlandês quem manda na grelha é o pai. Se ele não passar a vez, o movimento vira o presente: a cerveja para a casa (obrigação) mais o <b>sal grosso</b> ou a <b>cachaça</b> como presente do churrasqueiro brasileiro.","src":"days/2026-10-11.json eventos 'o que levar' e 'o que cabe na mala'; docs/churrasco-11-10-e-final-hurling-18-09.md","t":""},{"ti":"Explicar churrasco × barbecue enquanto assa","b":"Sem assar, ainda dá para ser o brasileiro do quintal: o nome certo é <b>churrasco</b>, não barbecue, e a diferença (peça inteira, sal e tempo contra hambúrguer e salsicha) é conversa que rende enquanto o pai grelha.","src":"days/2026-10-11.json evento 'o que levar'; docs/churrasco-11-10-e-final-hurling-18-09.md","t":""},{"ti":"Se o churrasco cair: Open Gate, dom 13–19h","b":"<b>Guinness Open Gate Brewery, 53 James's Street</b>, ~20 min a pé de Inchicore, abre domingo 13:00–19:00, sem reserva nem couvert. A cervejaria experimental de verdade, não o Storehouse. Serve de tarde inteira se o domingo ficar livre.","src":"docs/dossie-pesquisa-irlanda-porto.md (Open Gate, dom 13–19h); docs/app-roteiro-e-postura-reservas.md (entra quem chega)","t":"13:00"}]},{"id":"2026-10-11.3.a-picanha","h":"a picanha","t":null,"c":"note","b":"Existe na Irlanda, mas não com esse nome no balcão: peça <b>“picanha”</b> e, se não entenderem, <b>“rump cap”</b> ou <b>“top sirloin cap”</b> — açougue bom corta, supermercado não tem. <b>Compre no sábado</b>, em Dublin, ou encomende na quinta no <b>English Market de Cork</b> (Tom Durcan, Coughlan's, O'Mahony) e traga na geladeira de isopor — você está de carro. ⚠️ Peça para <b>não</b> tirar a capa de gordura: é o corte inteiro que importa.","ti":"Comprar a picanha no sábado (rump cap)","kind":"do","place":"","maps":"","dur":30,"alts":[{"ti":"Encomendar na quinta no English Market","b":"Se o açougue de Dublin não rolar no sábado de manhã, encomende na quinta 8 no <b>English Market de Cork</b> (seg–sáb 08:00–18:00): Tom Durcan, Coughlan's ou O'Mahony cortam a peça com a capa de gordura inteira. Volta na geladeira de isopor, já que está de carro.","src":"days/2026-10-08.json (English Market seg–sáb 08:00–18:00); days/2026-10-11.json evento 'a picanha'; docs/churrasco-11-10-e-final-hurling-18-09.md","t":""},{"ti":"Sem carne: deixa a grelha e leva o presente","b":"Se ficar sem picanha (domingo fecha tudo em Dublin), o churrasco é deles e o seu papel vira o presente: cerveja para a casa e sal grosso ou cachaça. Não invente supermercado: supermercado não tem o corte.","src":"days/2026-10-10.json nota (açougues só sábado); days/2026-10-11.json eventos 'o que levar' e 'a picanha'","t":""}]},{"id":"2026-10-11.4.o-que-cabe-na-mala","h":"o que cabe na mala","t":null,"c":"note","b":"Duas c
